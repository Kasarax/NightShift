  {label:'Joke with Chuck about the fax machine',do:['alca+3']},
  {label:'Keep quiet and watch everyone’s faces',do:['flag:read_room=true']}]);

p('D01E','Apartment 4C',[
 'The apartment is in Ashgrove, in a building where the elevator is permanently stuck on the third floor and everyone pretends that’s completely normal. In the hallway stands Kim Ingram, the neighbor from 4D, holding a grocery bag of tomatoes. She is a night nurse at St. Brennan Hospital.',
 '“From my mother. Homegrown. I said I’d take them to the ward, but brought them here instead. You never sleep, do you?”',
 '>> Be careful around her. She’s the kind of neighbor who notices when you come home. Pleasant, but dangerous: the Codex’s second rule says never among the people you love.'],
 [{label:'Accept the tomatoes and chat with her for a few minutes',do:['alca+4','gyanu-1','flag:kim_talk=true']},
  {label:'Say hello and head inside',do:['alca-1']},
  {label:'Ask about her shifts and watch how she answers',tag:'Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['alca+2','info+:in_kim']},{label:'Talk with Kim in a way that wins her trust',tag:'Persuasion ≥ 5 · Cover +4',req:'meg>=5',why:'Requires Persuasion ≥ 5',do:['alca+4','gyanu-2','flag:kim_talk=true']}]);

p('D01J','The First File',[
 'Past midnight. The apartment is dead silent. On the kitchen table lies a manila envelope slipped under your door this morning. You don’t need to open it to know who sent it: Neil, who gave you the Codex years ago. He never asks and never orders. He only names whoever the system let go, and waits.',
 'In the drawer sits the yellowed dossier sheet: the Codex, typed and underlined. Five rules, and a quiet voice in your head: **Read it.**',
 'I. Only the proven guilty whom the authorities let go. II. Never among the people you love. III. Never the same method twice. IV. Everyday life comes first. V. When in doubt, leave it.',
 {if:'megf>=5',t:'At the bottom of the sheet is a tiny, barely legible year: 1961. Neil wasn’t even a cop yet back then.'},
 'On the first page of the file is the name Eugene Novak. Two years ago he walked on the murder of Louise Hartman because the lab botched the sample.',
 '>> Which means the lab’s mistake is your mistake, too. Not an easy case, but at least a familiar one.'],
 [{label:'Read the file thoroughly',tag:'Evidence +1',do:['flag:t1_known=true','ev1+1','rend+2','info+:in_novak']},
  {label:'Just leaf through it and leave the rest for tomorrow',do:['flag:t1_known=true','alca+2']}],
 {enter:[{if:'megf>=5',do:['info+:ny_evszam']},{if:'info:leg_neil',do:['info+:ny_evszam']}]});

p('D02N','The Intern',[
 'Dr. Zeller leads a scrawny kid with glasses into the evidence room. Shane Crowe is nineteen, spent a single semester in college, and looks around like someone who wants to take everything in without being noticed.',
 '“{{n}}, he’s yours. Show him the ropes for a month.”',
 'Within his first five minutes, Shane asks why you log everything twice, and why you seal the evidence boxes left to right.',
 '>> Sharp. That’s what makes him dangerous. You can’t fool the young with routine.'],
 [{label:'Explain patiently why it’s done that way',do:['alca+2','rend+1','flag:shane_taught=true']},
  {label:'Tell him to tone down the questions',do:['alca-2','gyanu+1']},
  {label:'Hand him off to Chuck and get back to work',do:['alca+1']}]);

p('D02E','Night Shift',[
 'On WMHR 101.3, the city’s loudest loneliness airs at midnight. Keith Yates sits at the mic, his voice smooth as worn leather. The name of the show: **Night Shift**.',
 '“Before we get started: Louise Hartman. Exactly two years ago today, and Eugene Novak is still walking the streets a free man. Say something, Morgan Hills. Tell me you remember.”',
 'The phone lines burst open. A woman breaks down on air; a man curses. You sit in the kitchen clutching a glass of water.',
 '>> The city is angry. That’s good—at least you aren’t the only one listening to that voice.'],
 [{label:'Listen to the entire show',do:['alca+0','info+:in_keith']},
  {label:'Turn it off and go to sleep',do:['alca+3']},
  {label:'Write down what callers say about Novak',tag:'Evidence +1',do:['ev1+1','gyanu+1']}]);

p('D02J','The Docks',[
 'After the broadcast you can’t sleep. The Codex says to work with facts, not with anger. So you go down to the docks to find out who Eugene Novak really is.',
 'Novak lives in Dockside, on the second floor of a run-down three-story tenement. In the evenings he frequents a dive bar called the Anchor, sitting with his back to the door. That’s either an oversight or pure arrogance.',
 'The waterfront smells of wet rope and oil. A fog lamp flickers on the corner.',
 '>> No need to rush. Patience isn’t written into the Codex, but it’s the most crucial rule of all.'],
 [{label:'Go into the Anchor and take a stool at the far end of the bar',tag:'Evidence +1 · Suspicion +2',do:['ev1+1','gyanu+2']},
  {label:'Stake out his apartment from across the street',tag:'Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['ev1+1']},
  {label:'Go home and sleep',do:['alca+3'],goto:'R1'}]);

p('D03N','Saturday Duty',[
 'On Saturdays the lab is quiet but noisy in its own way: the AC hums, the refrigeration units click. You are alone except for Chuck, who is passed out in the corner.',
 'The door to the records room is unlocked. On the back shelf, buried among dead files, sits the box for the Hartman case. The key is in your hand.',
 '>> If you don’t open it, there’s no paper trail. If you do, your name goes into it, too.'],
 [{label:'Pull the box and review the sample log',tag:'Evidence +1 · Suspicion +3',do:['ev1+1','gyanu+3','flag:box_opened=true']},
  {label:'Walk away and do routine lab work',do:['alca+2','rend+1']}]);

p('D03E','On the Roof',[
 'Kim taped a note to your door handle: **Roof, seven o’clock. Bring whatever.** Up there, a handful of neighbors crowd around a cheap charcoal grill, looking faintly melancholic—like people who know summer is well and truly over.',
 'Kim catches your arm. “I told you to come.” Her smile is warm, which only makes it dangerous.',
 '>> Your inner circle. That circle stays untouched. The Codex doesn’t forbid love, but it makes it inconvenient.'],
 [{label:'Stick around for an hour and socialize',tag:'Cover +5',do:['alca+5','gyanu-2','flag:kim_bond=true']},
  {label:'Say hello and leave early',do:['alca+1']},
  {label:'Say you are working and can’t make it',do:['alca-3']}]);

p('D03J','Novak’s Habits',[
 'On Saturday nights Novak drinks at the Anchor until eleven, then walks back. Three blocks out, the streetlights give up, and he cuts through the same dark alley every time.',
 'He doesn’t sit alone at the bar, but nobody in his crew bothers asking who he is.',
 '>> A routine. A routine is a detective’s best friend. Yours, too.'],
 [{label:'Tail him home and map the route',tag:'Evidence +1 · Suspicion +2',do:['ev1+1','gyanu+2']},
  {label:'Watch the alley from a distance',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['ev1+1']},
  {label:'Call it a night—not worth it tonight',do:['alca+2']}]);

p('D04N','Sunday Lunch',[
 'Neil Jessup’s place sits at the edge of Eastgate, a modest brick home with freshly swept steps. Neil is sixty-eight, a retired cop who carves Sunday roast like he’s taking a formal deposition.',
 'In the living room stands a cabinet with a closed door that no one has seen open since you were a child.',
 {if:'megf>=6 or info:leg_neil',t:'The lock is brand-new, but the surrounding wood is scarred: the same hand has been working it for decades.'},
 '“Eat up, kid. You look like you haven’t slept in a week.”',
 'You have never called Neil anything but Neil.'],
 [{label:'Help out in the kitchen and talk with him',do:['alca+3','rend+1']},
  {label:'Take a closer look at the cabinet',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['info+:ny_szekreny']},
  {label:'Sit down and eat in silence',do:['alca+1']}]);

p('D04E','The Codex',[
 'After dinner, Neil sets down his coffee mug and speaks in the flat tone he uses for police reports.',
 '“What’s the status on the file?”',
 'He doesn’t name names, but you know it’s Novak, and Neil knows you know. The Codex lies quietly between them, like the salt on the table.',
 '>> He never says much, yet he knows everything. In this house, silence is the only shared dialect.'],
 [{label:'Tell him where you stand',tag:'Order +3',do:['rend+3']},
  {label:'Ask where he got the rules',tag:'Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['info+:ny_valasz','alca-1']},
  {label:'Stay silent and look away',do:[]}]);

p('D04J','Decision',[
 'One in the morning. The file on the kitchen table, the Codex beside it, the ticking of the wall clock uncomfortably loud.',
 {if:'ev1>=3',t:'You have everything you need. Three separate leads, all pointing to the same target. No doubts left.'},
 {if:'ev1<3',t:'You’re missing pieces. Two leads are solid, but the third isn’t there. The Codex’s fifth rule is plain: when in doubt, walk away.'},
 '>> Tonight it isn’t mandatory yet. There’s always tomorrow, and the day after. Clean work takes time.'],
 [{label:'Carry out the Codex’s work: Novak',tag:'Evidence ≥ 3',show:'flag:t1_known and !flag:t1_done',req:'ev1>=3',why:'Not enough evidence (3 needed)',danger:1,do:['flag:t1_done=true','rend+4','gyanu+4','alca-3'],goto:'>'},
  {label:'Rush it: the evidence is incomplete, but it has to be now',tag:'Order −10 · Suspicion +5',show:'flag:t1_known and !flag:t1_done and ev1<3',danger:1,do:['flag:t1_done=true','rend-10','gyanu+5','alca-3'],goto:'>'},
  {label:'Wait—not yet',do:['alca+1']}]);

p('D05N','The New Detective',[
 'Monday morning. Detective Chief Bonnie Ostrander stands in the doorway of the lab, scanning the room as if sizing everyone up for interrogation. Mid-forties, crop-cut hair, gray blazer, holding a yellow legal pad she never puts down.',
 'Dr. Zeller introduces her. “Chief Detective Ostrander, new head of Homicide. We’ll be working closely with her unit.”',
 {if:'flag:t1_done',t:'Ostrander eyes you, then the filing shelf, then you again. A cold, unblinking glare.'},
 '>> She’s the type who goes quiet before she asks. Go quiet too.'],
 [{label:'Cooperate eagerly if she asks about evidence bags',tag:'Suspicion −3',do:['gyanu-3','alca+2']},
  {label:'Keep your head down and stick to your work',do:['alca-1']},
  {label:'Try to figure out what she’s fishing for',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['info+:in_ostrander']},{label:'Speak with confidence and steer her focus away from the files',tag:'Persuasion ≥ 6 · Suspicion −4',req:'meg>=6',why:'Requires Persuasion ≥ 6',do:['gyanu-4','alca+1']}]);

p('D05E','The Phone Call',[
 'At eight PM the phone rings. On the line, that familiar dry voice. Neil, whose table you sat at on Sunday, and who gave you the Codex.',
 '“Just checking if you talked to anyone today.”',
 'He doesn’t state his purpose, and that’s the worst part—it always begins like this.',
 '>> It isn’t what he says that matters; it’s the weight of the silence on the line.'],
 [{label:'Be open: tell him a new detective has arrived at the police department',do:['rend+2','alca+0']},
  {label:'Keep it short: “Everything’s under control.”',do:['alca-1']},
  {label:'Push back: ask why he’s asking',do:['alca-1','rend-1']}]);

p('D05J','Second Chance',[
 'The city is slick with rain; streetlights bleed across wet asphalt. Outside the Anchor, a sedan sits with fogged windows.',
 {if:'flag:t1_done',t:'It’s done. Nobody saw anything, and you walk home clean. The choice wasn’t yours; it belonged to the Codex.'},
 {if:'!flag:t1_done',t:'Tonight Novak sits in the exact same booth, back to the door, just like before.'}],
 [{label:'Carry out the Codex’s work: Novak',tag:'Evidence ≥ 3',show:'flag:t1_known and !flag:t1_done',req:'ev1>=3',why:'Not enough evidence (3 needed)',danger:1,do:['flag:t1_done=true','rend+4','gyanu+4','alca-3']},
  {label:'Rush it: the evidence is incomplete, but it has to be now',tag:'Order −10 · Suspicion +5',show:'flag:t1_known and !flag:t1_done and ev1<3',danger:1,do:['flag:t1_done=true','rend-10','gyanu+5','alca-3']},
  {label:'Head home and pack the file away',show:'flag:t1_known and !flag:t1_done',do:['alca+2']},
  {label:'Stay on the corner another hour and see who looks back from the Anchor',tag:'Suspicion +2 · new information',show:'!flag:t1_known or flag:t1_done',do:['gyanu+2','info+:in_horgony'],goto:'R2'},
  {label:'Go home and sleep',show:'!flag:t1_known or flag:t1_done',do:['alca+3'],goto:'R2'}]);

p('D06N','The News',[
 {if:'flag:t1_done',t:'The morning news broadcasts talk about little else: Eugene Novak’s body was pulled from a waterfront warehouse. Ostrander stands in the lab alongside Sergeant Kessler, reviewing evidence logs. Chuck chuckles: “Well, somebody finally cleaned house.”'},
 {if:'!flag:t1_done',t:'A quiet day. Ostrander takes statements on the third floor, Sergeant Kessler brings up lukewarm coffee, and Chuck cracks jokes about the new DNA machines.'},
 'You wipe down the counters, breathe in the sharp smell of fingerprint powder, and put on your usual pleasant expression.',
 '>> The smile isn’t a lie. It’s the cover.'],
 [{label:'Smile and joke along with Chuck',do:['alca+3','gyanu-1']},
  {label:'Work quietly and give the detective a wide berth',do:['alca-1','gyanu-1']},
  {label:'Sound out Sergeant Kessler to see what Homicide has',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['info+:in_kessler']}]);

p('D06E','Late Shift',[
 'Six o’clock. The lab empties out. Shane is still lingering at his workbench, mentally cataloging a rack of test tubes.',
 '“Why do you always stay late?”',
 {if:'flag:shane_taught',t:'That isn’t an accusation, it’s respect. Or maybe he’s watching.'},
 '>> Curiosity in an intern is hazardous. But a curious mind can also be shaped into an apprentice.'],
 [{label:'Tell him the paperwork never ends',do:['alca+2']},
  {label:'Invite him to stay and show him a procedure',tag:'Cover +2 · Suspicion +1',do:['alca+2','gyanu+1','flag:shane_close=true']},
  {label:'Send him home with orders to get some sleep',do:['alca+0']}]);

p('D06J','Third Chance',[
 {if:'flag:t1_done',t:'You get home. In the dead quiet of the apartment, exhaustion hits all at once. The Host is unnaturally quiet, as if it were resting.'},
 {if:'!flag:t1_done',t:'Eleven PM, and the file still sits on the table. The rules of the Codex have no expiration date, but suspicion does.'}],
 [{label:'Carry out the Codex’s work: Novak',tag:'Evidence ≥ 3',show:'flag:t1_known and !flag:t1_done',req:'ev1>=3',why:'Not enough evidence (3 needed)',danger:1,do:['flag:t1_done=true','rend+4','gyanu+4','alca-3']},
  {label:'Rush it: the evidence is incomplete, but it has to be now',tag:'Order −10 · Suspicion +5',show:'flag:t1_known and !flag:t1_done and ev1<3',danger:1,do:['flag:t1_done=true','rend-10','gyanu+5','alca-3']},
  {label:'Drop it—the window of opportunity has closed',show:'flag:t1_known and !flag:t1_done',do:['flag:t1_skip=true','alca+2']},
  {label:'Walk around the block before you lie down',tag:'Cover +2 · Suspicion +1',show:'!flag:t1_known or flag:t1_done',do:['alca+2','gyanu+1'],goto:'R3'},
  {label:'Lie down',show:'!flag:t1_known or flag:t1_done',do:['alca+3'],goto:'R3'}]);

p('D07N','Wednesday Morning',[
 {if:'flag:t1_skip',t:'The morning coffee tastes of nothing. The Codex remains tucked in the drawer, while Novak drinks in some waterfront dive, alive and breathing.'},
 {if:'flag:t1_done',t:'The lab hums along as usual, but Ostrander’s legal pad has fresh pages filled out. You can feel the heat.'},
 'Dr. Zeller calls a quick meeting. “Next Wednesday is the mandatory training for the DNA protocol. Three techs have already tried to get out of it. Don’t even think about it.”',
 'Chuck mutters under his breath: “If I’m counting right, within ten years they’ll be testing every sample.”',
 '>> Ten years. The Codex is older than that, but the database has endless patience.'],
 [{label:'Agree to attend and master the material',tag:'Expertise ≥ 6 · Suspicion −2',req:'szak>=6',why:'Requires Expertise ≥ 6',do:['gyanu-2','alca+2']},
  {label:'Agree, but do not show too much interest',do:['alca+1']},
  {label:'Let Chuck do the talking',do:['alca-1']}]);

p('D07E','The Radio',[
 'On the air, Keith Yates won’t let the topic die.',
 {if:'flag:t1_done',t:'“The city’s breathing a little easier tonight, folks. Eugene Novak is gone. We don’t know who did it, but someone delivered justice. So I ask you: do we owe them a thank-you note?”'},
 {if:'!flag:t1_done',t:'“The Louise Hartman case is still an open wound. What does Homicide know that we don’t? Why is Novak still walking around free?”'},
 'Callers flood the switchboard. A man argues: “Somebody finally did the job the city wouldn’t.”',
 '>> Truth is welcome on the radio. In the lab, evidence is what counts.'],
 [{label:'Listen to the broadcast and weigh his words',do:['info+:in_keith2']},
  {label:'Turn it off',do:['alca+2']},
  {label:'Note the airtime of Yates’s show for future reference',do:['flag:keith_noted=true']}]);

p('D07J','The Second Envelope',[
 'Late at night, footsteps echo in the stairwell, followed by the slide of paper against the floorboards. The same paper stock. The same delivery.',
 {if:'flag:t1_done',t:'Under the Codex, once a mark is cleared, the next arrives. No congratulations, no debrief: just another handoff.'},
 {if:'!flag:t1_done',t:'The first file isn’t closed, yet the next one is already sitting on your rug. It doesn’t wait.'},
 'The second file belongs to Vernon Prescott. Two years ago he walked on charges involving the death of a seventeen-year-old girl. The jury cited lack of evidence; the court of public opinion disagreed.',
 '>> The target list is the spine of the Codex. Neil names them, you eliminate them. The arrangement is simple—which is precisely why you can’t allow yourself to think about it.'],
 [{label:'Read the file thoroughly',tag:'Order +2',do:['flag:t2_known=true','rend+2','info+:in_prescott']},
  {label:'Glance over it and leave the details for tomorrow',do:['flag:t2_known=true','alca+1']}],
 {enter:[{if:'flag:t1_known and !flag:t1_done',do:['flag:t1_skip=true']}]});

/* ===== Arc 2: Cracks (Oct 8–14) ===== */
p('D08N','Questions',[
 'Ostrander has commandeered the third-floor conference room: city maps on the wall, stale coffee, three phone lines ringing off the hook. Throughout the morning, lab staff are called in one by one to recount their weekend whereabouts.',
 {if:'flag:t1_done',t:'You are next. Ostrander does not ask about Novak, but about what you did on Saturday night. An ordinary voice, an ordinary question.'},
 {if:'!flag:t1_done',t:'You are up next. Ostrander asks about a dockside warehouse fire where two workers went missing.'},
 '>> You’re being questioned, not charged. The line between the two is paper-thin.'],
 [{label:'Answer briefly and calmly',tag:'Suspicion −2',do:['gyanu-2','alca+1']},
  {label:'Be chatty and tell her about your everyday life',tag:'Cover +3 · Suspicion +1',do:['alca+3','gyanu+1']},
  {label:'Pivot: ask how the lab can assist her unit',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['gyanu-3','info+:in_ostrander2']},{label:'Convince her you’re a valuable asset to her investigation',tag:'Persuasion ≥ 7 · Suspicion −4',req:'meg>=7',why:'Requires Persuasion ≥ 7',do:['gyanu-4','alca+1']}]);

p('D08E','A Beer with Chuck',[
 'Chuck Wexler has been insisting since Friday that every working stiff needs a local watering hole. The Spur sits on the corner right behind the lab, packed with grizzled cops and rookie detectives trying to look tough.',
 'Chuck orders two pints and looks at you as if the invitation were not even a question.',
 '“One piece of advice: don’t work too much. Sleep you skip comes back eventually.”',
 '>> The neatest cover is telling the absolute truth about something utterly meaningless.'],
 [{label:'Stay for a drink',tag:'Cover +4 · Suspicion −1',do:['alca+4','gyanu-1','flag:chuck_friend=true']},
  {label:'Pass on the beer and head home',do:['alca-1']},
  {label:'Ask Chuck about the old cases',tag:'Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['info+:in_chuck','alca+1']}]);

p('D08J','Prescott',[
 'Vernon Prescott works the graveyard shift as a crane operator down at the Dockside cannery. The high-pressure sodium lights cast an orange glare, and the hum of heavy machinery sounds like a long, metallic sigh.',
 'You stand by the fence and check the time twice, because what you see does not match what the file says.',
 'The dossier claims Prescott was home alone the night of the murder. The cannery shift logs, however, list him on duty that exact evening.',
 '>> A minor discrepancy. This is where Rule Five kicks in: when in doubt...'],
 [{label:'Document the shift logs and try to cross-reference them',tag:'Evidence +1',do:['ev2+1','flag:prescott_doubt=true','info+:in_alibi','gyanu+2']},
  {label:'Let it go, the data in the file is what counts',do:['rend-2']},
  {label:'Go home and think it over',do:['alca+2']}]);

p('D09N','Old Samples',[
 'On the back shelves of the evidence vault sits the box for the Hollis case, neglected for two years. Tammy Hollis was seventeen.',
 'A glass slide contains a hair sample recovered from Prescott’s house. According to the original lab report, it’s a positive match.',
 {if:'szak>=6',t:'Under the microscope, the color and cross-section don’t match Prescott’s hair at all. It was a botched comparison two years ago.'},
 {if:'szak<6',t:'You aren’t entirely sure what you’re seeing. The pigmentation looks slightly off, but it could just be poor lighting.'},
 '>> The lab made a critical error two years ago. That part, at least, feels familiar.'],
 [{label:'Examine the hair structure under high magnification',tag:'Expertise ≥ 6 · Evidence +1 · Suspicion +2',show:'szak>=6',do:['ev2+1','gyanu+2','info+:in_haj']},
  {label:'Photograph it and compare at home',tag:'Suspicion +1',show:'szak<6',do:['gyanu+1','info+:in_haj_foto']},
  {label:'Put the evidence box back on the shelf',do:['alca+1']}]);

p('D09E','Training Session',[
 'At four o’clock, Dr. Zeller runs a practice session on the DNA protocol. Long stainless-steel tables, plastic trays, empty pipette racks. Chuck nods off in the back; Shane takes feverish notes. Zeller glances around: “If something isn’t crystal clear, ask now.”',
 'You understand it inside out. So well that it’s unsettling.',
 '>> Don’t be a genius. But don’t act suspiciously incompetent either.'],
 [{label:'Show that you understand the system well',tag:'Expertise ≥ 6 · Suspicion −3',req:'szak>=6',why:'Requires Expertise ≥ 6',do:['gyanu-3','alca+2','flag:zeller_trust=true']},
  {label:'Stay in the background and blend in with the paperwork',do:['alca+1']},
  {label:'Raise a sharp technical question regarding chain of custody',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['gyanu-2','flag:zeller_trust=true']}]);

p('D09J','The Handwriting',[
 'You spread the pages of the file out on the table and study them for a long time. Something is wrong with the letters: Neil’s handwriting is angular and sharp. In the file the g’s are looped, and the stroke of the t’s is slow and hesitant.',
 {if:'megf>=6 or info:leg_tobin',t:'The Codex sheet bears this second handwriting as well. It matches the dossier—and it doesn’t belong to Neil.'},
 {if:'megf<6 and !info:leg_tobin',t:'The looped g’s and the slow, hesitant t’s are not Neil’s hand. Whose it is, you don’t know yet.'}],
 [{label:'Record the difference and put the pages away',tag:'Observation ≥ 6',show:'megf>=6 or info:leg_tobin',do:['info+:ny_kez','rend+0']},
  {label:'Copy the looped g and the hesitant t onto a slip of paper, and put it away',tag:'Suspicion +1 · new information',show:'megf<6 and !info:leg_tobin',do:['gyanu+1','info+:ny_kez']},
  {label:'Store the pages away and get some rest',do:['alca+2']}]);

p('D10N','Saturday Duty',[
 'Shane comes in on his day off. He unlocks the lab, brews a pot of coffee, and sits at the bench reading equipment manuals.',
 {if:'flag:box_opened',t:'At one point he pauses and turns to you: “The Hartman box has a lot less dust on it than the rest of the shelf. Someone pulled it recently.”'},
 {if:'!info:in_novak',t:'Shane asks a lot of questions, though they seem innocent enough: where the microscope slides are archived, why the evidence vault lacks terminals.'},
 '>> A trivial detail nobody pays attention to—until someone mentions it out loud.'],
 [{label:'Say it was you: you were doing inventory',tag:'Suspicion −2 · Cover −1',show:'flag:box_opened',do:['gyanu-2','alca-1','flag:shane_lied=true']},
  {label:'Say it was Chuck',tag:'Suspicion −3 · Order −2 · Cover −2',show:'flag:box_opened',do:['gyanu-3','rend-2','alca-2','flag:chuck_blamed=true']},
  {label:'Let the remark go and say something else',do:['alca+1']},{label:'Persuade Shane that he’s mistaking ordinary shelf wear',tag:'Persuasion ≥ 6 · Suspicion −3',req:'meg>=6',why:'Requires Persuasion ≥ 6',show:'flag:box_opened',do:['gyanu-3','alca+1']}]);

p('D10E','Caller on the Radio',[
 'On WMHR, an elderly woman calls into Yates’s show. Keith chuckles into the mic: “Marlene, let’s start with what’s bothering you tonight.”',
 'Marlene Okafor speaks deliberately, weighing every word. “I’ve seen this kind of work before. Not the murders themselves. That... surgical cleanliness. No pattern, just discipline. Back in sixty-eight. Thirty years ago.”',
 'Keith goes quiet for two beats before thanking her and moving on to the next caller.',
 '>> Thirty years. That’s not a coincidence, is it?'],
 [{label:'Write down Marlene’s name and remember her',do:['info+:ny_hivo','gyanu+1']},
  {label:'Shut the radio off',do:['alca+2']},
  {label:'Keep listening and analyze Keith’s subtle reaction',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['flag:keith_noticed=true','gyanu+1']}]);

p('D10J','A Truck',[
 'Parked near Prescott’s fence sits a rusted gray pickup truck. Its rear passenger tire is worn bald, and the tread impression left in the mud matches the evidence photo perfectly—a lead missing entirely from the trial record.',
 'The truck belongs to Wesley Lindqvist, Prescott’s cousin, who moved in right around the time the girl vanished.',
 {if:'megf>=5',t:'A quick DMV registry check reveals the vehicle is titled to Lindqvist, who was spotted multiple times in the Hollis neighborhood.'},
 '>> Not Prescott. The question now is what to do with this revelation.'],
 [{label:'Log the license plate and ask around the block',tag:'Evidence +1 · Suspicion +2',do:['ev2+1','gyanu+2','flag:l_lead=true','info+:in_lindqvist']},
  {label:'Photograph the tire tread in the mud',tag:'Observation ≥ 5 · Evidence +1',req:'megf>=5',why:'Requires Observation ≥ 5',do:['ev2+1','flag:l_lead=true','info+:in_lindqvist']},
  {label:'Let it go, no need to bother with it this much',do:['rend-1']}]);

p('D11N','Sunday Lunch',[
 'Neil’s tremors are worse today. His soup spoon rattles against the china. He covers his right hand with his left, as if ashamed.',
 'In the kitchen drawer, tucked beside the cutlery, rests a framed photograph facing down.',
 {if:'megf>=6 or info:leg_tobin',t:'The photo shows two men: a young Neil alongside an older man wearing thick spectacles. Inscribed on the back: *L.T. & N.J., 1972.*'},
 {if:'megf<6 and !info:leg_tobin',t:'The photo lies face down, and Neil snaps the drawer shut so fast you only catch a glimpse of yellowed photo paper.'},
 '>> A man hiding a photograph in his own house. Interesting, what he chooses to keep.'],
 [{label:'Take out the photo and look at it',tag:'Observation ≥ 6',show:'megf>=6 or info:leg_tobin',do:['info+:ny_foto','gyanu+0']},
  {label:'Steady Neil’s hand and ask if he’s feeling alright',tag:'Cover +2',do:['alca+2','rend+1']},
  {label:'Let it go and keep eating',do:[]}]);

p('D11E','Doubt',[
 'After dinner, Neil brings up the file again, asking flatly about the Prescott situation.',
 {if:'flag:prescott_doubt',t:'The doubt won’t let you rest. Once you say it, you can’t take it back.'},
 {if:'!flag:prescott_doubt',t:'You keep quiet. There’s nothing to discuss beyond what’s written in the dossier.'},
 '>> Neil’s answer will show whether you are still an apprentice, or only a tool.'],
 [{label:'Air your doubts: the alibi doesn’t add up',tag:'Order +2 · Suspicion +1',show:'flag:prescott_doubt',do:['rend+2','gyanu+1','flag:neil_doubt=true']},
  {label:'Say everything is fine and you are going ahead',do:['alca+0','rend-1']},
  {label:'Ask who compiles the list',tag:'Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['info+:ny_lista','alca-1']}]);

p('D11J','Three Files',[
 'Late at night, three files cover your desk: Prescott’s dossier, the original evidence log from the Hollis murder, and your field notes on Lindqvist gathered from registry checks and night walks.',
 {if:'flag:l_lead and info:in_haj',t:'The puzzle pieces lock together. Lindqvist’s pickup, the hair analysis, the shift alibi. Three separate vectors pointing to one man.'},
 {if:'flag:l_lead and !info:in_haj',t:'The vehicle registration and the shift alibi align, but you still lack the physical hair evidence.'},
 {if:'!flag:l_lead',t:'You can’t connect the dots yet. Prescott is the only name appearing in official records.'},
 '>> Three files, one list. The list belongs to Neil, but facts don’t yield to loyalty.'],
 [{label:'Merge the three files into one list',tag:'Evidence +1 · Expertise ≥ 5',show:'flag:l_lead',req:'szak>=5',why:'Requires Expertise ≥ 5',do:['ev2+1','rend+2','alca-1']},
  {label:'Let it go, there is not enough evidence yet',do:['alca+2']},
  {label:'Nap for an hour and start over',do:['alca+3','gyanu+0']}]);

p('D12N','The Questioner',[
 'Shane stands by the counter and does not look you in the eye. “I don’t think I believe you. But I don’t want to, either.”',
 {if:'flag:shane_lied',t:'You catch the implication: Shane knows more than he’s letting on.'},
 {if:'flag:chuck_blamed',t:'Chuck walks over, arms crossed. “Funny thing. I wasn’t even on duty last Saturday.”'},
 {if:'!flag:shane_lied and !flag:chuck_blamed',t:'It’s unclear what he’s driving at, but his tone is deadly serious.'},
 '>> A nineteen-year-old kid isn’t a threat on his own. Handle him wrong, though, and you wind up with an apprentice you never asked for.'],
 [{label:'Be straightforward: admit you’re hiding something, but nothing bad',tag:'Suspicion −2 · Cover +1',do:['gyanu-2','alca+1','flag:shane_half=true']},
  {label:'Shake him off: he thinks too much',do:['alca-2','gyanu+2']},
  {label:'Invite him for a coffee to smooth things over',tag:'Cover +3',do:['alca+3','flag:shane_close=true']}]);

p('D12E','Closed Door',[
 'You arrive home to find Kim standing in the hallway, the harsh overhead fluorescent lighting giving her hair a brassy sheen.',
 {if:'flag:t1_done',t:'She reaches out, touching your hand. “What happened to your knuckles? Is that a scrape?”'},
 {if:'!flag:t1_done',t:'“You look exhausted.” It’s a statement, not a question.'},
 '>> Kim is the only person in the building who can spot a lie a mile off. She doesn’t call you on it, but she knows.'],
 [{label:'Say you hit your hand on a box',tag:'Suspicion −1 · Cover −1',do:['gyanu-1','alca-1']},
  {label:'Admit you’re running on fumes and thank her for caring',tag:'Cover +3',do:['alca+3','flag:kim_bond=true']},
  {label:'Avoid her gaze and go inside',do:['alca-2','rend-1']},{label:'Reassure Kim warmly and pivot the subject',tag:'Persuasion ≥ 6 · Cover +3',req:'meg>=6',why:'Requires Persuasion ≥ 6',do:['alca+3','gyanu-2','flag:kim_bond=true']}]);

p('D12J','The Host',[
 'Midnight. The apartment is soundless. Inside your head, the Host speaks—not aloud, but the silence inside your skull warps around its resonance.',
 '>> Neil thinks the rule is gospel. I say keeping your head is what keeps you breathing. Look at you, overthinking everything. As if you’re waiting for permission from a piece of paper.',
 {if:'rend<=60',t:'>> **There’s no need to wait.** One quick motion and all these doubts disappear.'},
 {if:'rend>60',t:'>> But of course, the rule keeps you safe. For tonight, anyway.'}],
 [{label:'Listen to it and say aloud what you are thinking',tag:'Order −3 · Cover −2',do:['rend-3','alca-2'],danger:1},
  {label:'Open the Codex and read the rules',tag:'Order +3',do:['rend+3']},
  {label:'Go out for some air and let it pass',do:['alca+1','rend+1']},{label:'Say firmly: no',tag:'Composure ≥ 6 · Order +4',req:'hid>=6',why:'Requires Composure ≥ 6',do:['rend+4']}]);

p('D13N','The Pattern',[
 {if:'flag:t1_done',t:'Ostrander walks into the lab and slaps a crime scene photo onto the table: Novak, inside the warehouse. “I don’t see a pattern. One clean wound. Like someone practiced it for months.” She locks eyes with you. “I don’t trust overly disciplined people.”'},
 {if:'!flag:t1_done',t:'Ostrander asks about the waterfront warehouse fire, noting casually that the evidence room looks so immaculate it’s like someone double-checks every surface. “I don’t trust overly disciplined people.”'},
 'You nod, but cannot think of a suitable answer.',
 '>> Rule Three protects you from her. Rule Five does, too. Did you actually keep both?'],
 [{label:'Smile and joke about discipline',tag:'Suspicion −2',do:['gyanu-2','alca+1'],goto:'O1'},
  {label:'Query her: ask what gave her that impression',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['gyanu-3','info+:in_ostrander3'],goto:'O1'},
  {label:'Maintain composure and return the photo',do:['gyanu+2','alca-1'],goto:'O1'},{label:'Turn discipline into a joke',tag:'Persuasion ≥ 7 · Suspicion −4',req:'meg>=7',why:'Requires Persuasion ≥ 7',do:['gyanu-4','alca+2'],goto:'O1'}],
 {enter:[{if:'flag:t1_done',do:['gyanu+3']},{if:'!flag:t1_done',do:['gyanu+1']}]});

p('D13E','Practice',[
 'Late in the evening, the main lab is dark. you and Shane are running drill samplings for the DNA machine. Shane’s hand technique is far steadier than you expected. After every step he asks: “Like this? Is the angle right?”',
 {if:'flag:shane_close',t:'Shane sits closer and closer, as if closeness were a way to learn. You feel this was not what you wanted, but it cannot be undone now.'},
 '>> A sharp apprentice is a gift. He’s also a liability.'],
 [{label:'Guide his hand patiently and offer praise',tag:'Cover +2',do:['alca+2','flag:shane_taught=true']},
  {label:'Set a boundary: only the work matters',do:['alca+0','gyanu-1']},
  {label:'Observe his facial expressions when he thinks you aren’t looking',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['info+:in_shane']}]);

p('D13J','The Call',[
 'Neil calls past midnight. No greeting.',
 '“Prescott. What’s the status?”',
 {if:'flag:neil_doubt',t:'His voice is razor-sharp. “I told you: the list doesn’t make mistakes. It’s not your call to make.”'},
 {if:'!flag:neil_doubt',t:'His tone is measured, but the silence on the line drags longer than usual.'},
 {if:'flag:neil_doubt',t:'>> Neil isn’t asking now; he’s defending. A man who guards the rule this hard already has doubts.'},
 {if:'!flag:neil_doubt',t:'>> It’s the first time Neil hasn’t issued a directive, but asked a question instead. Almost as if he’s feeling the pressure, too.'}],
 [{label:'Tell him you want to verify the evidence',tag:'Order +2',do:['rend+2','flag:neil_pressed=true']},
  {label:'Reassure him everything is fine and drop the inquiry',do:['rend-2']},
  {label:'Turn the question back on him: ask if he has doubts',tag:'Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['flag:neil_unsure=true','alca-1']}]);

p('D14N','Pilot Lead',[
 'Dr. Zeller calls you into her office. “You’re taking point on the DNA pilot rollout. Sample intake, chain of custody logs, the initial database uploads. Chuck is too sloppy; Shane is too green. You’re methodical.”',
 'The assignment is both a promotion and a bullseye. You know that responsibility is just a polite word for exposure.',
 '>> The best hiding place is right in the spotlight. But the spotlight makes you visible to everyone.'],
 [{label:'Accept cleanly: “Thank you for the confidence, Dr. Zeller.”',tag:'Suspicion +3 · Cover +3',do:['gyanu+3','alca+3','flag:pilot_lead=true'],goto:'S1'},
  {label:'Say that Chuck is more experienced',tag:'Suspicion −1 · Cover −2',do:['gyanu-1','alca-2'],goto:'S1'},
  {label:'Accept, but ask for Shane’s help',tag:'Cover +2',do:['alca+2','flag:pilot_lead=true','flag:shane_close=true'],goto:'S1'}]);

p('D14E','About DNA',[
 'On the radio, Keith Yates hosts a former state forensic chemist to explain DNA profiling. The guest’s delivery is bone-dry.',
 '“After October fifteenth, criminals will have to reckon with it: from then on every body keeps its trace.”',
 'Yates chuckles: “You heard him, listeners. Welcome to the brave new world. Everyone better watch what they shed.”',
 '>> A single strand of hair, a single skin cell. The world is a portable archive.'],
 [{label:'Listen closely to the technical breakdown',tag:'Expertise ≥ 5',req:'szak>=5',why:'Requires Expertise ≥ 5',do:['info+:in_dna_tech','gyanu-1']},
  {label:'Switch it off',do:['alca+2']},
  {label:'Call the show and ask something',tag:'Suspicion +4 · dangerous',danger:1,do:['gyanu+4','flag:radio_exposed=true','alca-1']}]);

p('D14J','The Eve',[
 'The calm before the storm. The DNA pilot launches tomorrow morning, and the new network will illuminate every dark corner of the crime lab.',
 {if:'ev2<3 and flag:l_lead',t:'The Prescott and Lindqvist connection remains unverified. If you dig deeper, one more link will surface.'},
 {if:'ev2>=3',t:'The evidence has locked into place. It’s Lindqvist, not Prescott. The only question is what you do with it.'},
 '>> Half the month is spent. The remaining half won’t offer this kind of quiet.'],
 [{label:'Dig deeper into Lindqvist’s records',tag:'Evidence +1 · Suspicion +2',show:'flag:l_lead and ev2<3',do:['ev2+1','gyanu+2']},
  {label:'Rest and prepare for tomorrow',do:['alca+4','gyanu-1']},
  {label:'Write down everything you know in the journal',do:['rend+2']},{label:'Think the month over with a cool head',tag:'Composure ≥ 6 · Order +3',req:'hid>=6',why:'Requires Composure ≥ 6',do:['rend+3']}]);

/* ===== Arc 3: The Squeeze (Oct 15–21) ===== */
p('D15N','Go Live',[
 'October fifteenth. From nine AM onward, the DNA system belongs to the city. Zeller presents the first batch of sample trays with formal ceremony; flashbulbs pop from a department photographer; someone brought cheap champagne nobody dares uncork.',
 {if:'flag:t1_done',t:'The initial batch includes evidence collected from the waterfront warehouse. You spot the specimen tag on the tray, and your hand freezes over the logbook.'},
 {if:'!flag:t1_done',t:'The initial batch consists of evidence pulled from the dockside warehouse fire. Your task is to catalog every vial and pass them to processing.'},
 'Zeller signals across the room. “{{n}}, you’re in charge.”',
 '>> This is the moment the ordinary world looks you in the eye. Don’t be afraid. Just be present.'],
 [{label:'Submit the sample in the usual way',tag:'Order +2 · dangerous',show:'flag:t1_done',danger:1,do:['flag:dna_risk=true','gyanu+6','rend+2']},
  {label:'Slip it into the next batch with clever paperwork',tag:'Expertise ≥ 6 · Order −2 · Suspicion +2',show:'flag:t1_done',req:'szak>=6',why:'Requires Expertise ≥ 6',do:['gyanu+2','rend-2']},
  {label:'Delegate the logging to Shane',tag:'Suspicion +3 · Shane gets a look inside',show:'flag:t1_done',do:['gyanu+3','flag:shane_involved=true']},
  {label:'Log every sample strictly by the book and keep your posture calm',show:'!flag:t1_done',do:['alca+3','gyanu-2']}]);

p('D15E','Champagne',[
 'At the end of the day, Zeller pops the champagne cork. Paper cups, Chuck proposing a boisterous toast, Shane beaming, while Ostrander leans against the doorframe, hands in her pockets, abstaining.',
 'You get a cup too, cold between your fingers.',
 {if:'flag:t1_done',t:'Ostrander glides over, speaking low enough that only you can hear: “Tell me, {{s}}... how long do you think before this machine catches everyone?”'},
 {if:'!flag:t1_done',t:'Ostrander steps over, asking politely what you think of the system.'},
 '>> Nothing is more dangerous than a glass of drink. Everyone is honest, and everyone is watching.'],
 [{label:'Reply: “In time, everyone. Though maybe not the ones we expect.”',tag:'Cover −1 · Suspicion +2',do:['alca-1','gyanu+2']},
  {label:'Say: “If the system is good, quickly.”',tag:'Suspicion −1',do:['gyanu-1','alca+1']},
  {label:'Deflect: “My job is only the samples.”',tag:'Cover +1',do:['alca+1']}]);

p('D15J','Night Duty',[
 'Past midnight. The main floor lights are switched off. Glowing green text cascades down the computer monitor: Day One of the database system, zero fatal errors.',
 'You sit alone in the hum of the cooling fans and the rhythmic clicking of the specimen fridges.',
 {if:'szak>=6',t:'You pull up the system audit log. Every query executed today is recorded with user ID and timestamp. Ostrander ran eight searches—three of them targeting samples from the waterfront case.'},
 {if:'szak<6',t:'The system logs every search, but you can’t read the log yet. It may be better that way.'},
 '>> What enters the system once, the system never forgets. From here on the world won’t be the same.'],
 [{label:'Inspect the terminal access log',tag:'Expertise ≥ 6 · Suspicion +1',show:'szak>=6',do:['gyanu+1','info+:in_naplo']},
  {label:'Power down the console and head home',do:['alca+2']},
  {label:'Wait and watch who else asks',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['info+:in_naplo2','gyanu+1']}]);

p('D16N','The First Results',[
 {if:'flag:dna_risk',t:'In the morning, Zeller stands inside her office, staring at a partial DNA profile on the monitor. “Inconclusive. An unknown secondary contributor, but I can’t isolate the origin.” Her tone is calm, but you pick up the nervous edge beneath it.'},
 {if:'!flag:dna_risk',t:'In the morning, Zeller stands inside her office with a wide grin. “Clean results across the board. The launch batch processed flawlessly.”'},
 'Ostrander is already seated in the corner, legal pad resting on her knee.',
 '>> Today everyone is waiting for a single word. You hold the power to speak it or swallow it.'],
 [{label:'Explain that a partial profile like this is a common source of error',tag:'Expertise ≥ 6 · Suspicion −3',show:'flag:dna_risk',req:'szak>=6',why:'Requires Expertise ≥ 6',do:['gyanu-3','rend-1'],goto:'H1'},
  {label:'Say nothing and let Zeller draw her own conclusions',tag:'Suspicion +2',show:'flag:dna_risk',do:['gyanu+2'],goto:'H1'},
  {label:'Congratulate Zeller on the success',show:'!flag:dna_risk',do:['alca+2','gyanu-1'],goto:'H1'},{label:'Stay cool and let the result speak for itself',tag:'Composure ≥ 7 · Suspicion −3',req:'hid>=7',why:'Requires Composure ≥ 7',show:'flag:dna_risk',do:['gyanu-3'],goto:'H1'}]);

p('D16E','Dinner with Kim',[
 'Kim is cooking in her apartment, the aroma of garlic and spices drifting out into the hallway. You ring the bell, mildly unsettled to realize you no longer feel like an outsider here.',
 'At the small table, Kim talks about the hospital: an elderly patient on her ward who repeats the exact same story every night about a missing girl.',
 {if:'flag:kim_bond',t:'Kim touches your hand lightly. “You’re a good person. If you ever start doubting that, tell me. I’ll remind you.”'},
 '>> The Codex’s second rule: never involve those you care about. Kim never asked to be cared about. It happened anyway.'],
 [{label:'Stay and be kind',tag:'Cover +5 · Suspicion −2',do:['alca+5','gyanu-2','flag:kim_bond=true'],goto:'K1'},
  {label:'Thank her and leave early',do:['alca+1'],goto:'K1'},
  {label:'Pay attention to what she says about the hospital',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['info+:in_kim2'],goto:'K1'}]);

p('D16J','The Hair',[
 'The hair strand recovered from the Hollis case is barely visible under the microscope lamp. You hold the slide up to the light. The new DNA sequencer is your only path forward.',
 {if:'flag:l_lead and ev2<3',t:'If the hair profile matches Lindqvist’s archived sample, the file is airtight. If it doesn’t, you’re back to square one.'},
 {if:'ev2>=3',t:'You already possess sufficient evidence. Running the test now adds unnecessary risk for minimal return.'},
 {if:'!flag:l_lead',t:'You lack a comparative target. Running the sequence is useless.'},
 '>> A single hair. That’s all it takes for the world not to be wrong.'],
 [{label:'Sequencer-run the hair against Lindqvist’s record',tag:'Expertise ≥ 6 · Evidence +1 · Suspicion +3',show:'flag:l_lead and ev2<3',req:'szak>=6',why:'Requires Expertise ≥ 6',do:['ev2+1','gyanu+3','info+:in_dna_match']},
  {label:'Ask Shane to run it',tag:'Evidence +1 · Suspicion +4',show:'flag:l_lead and ev2<3',do:['ev2+1','gyanu+4','flag:shane_involved=true']},
  {label:'Note the hair’s data in the journal and lock it away',tag:'Order +2',show:'!flag:l_lead or ev2>=3',do:['rend+2']},
  {label:'Leave it and stay cautious',do:['alca+2']}]);

p('D17N','The Log',[
 'Saturday. The main lab is deserted; compressor units click in sequence. You sit before the terminal monitor, scanning the administrative access log.',
 {if:'flag:dna_risk',t:'The waterfront warehouse specimen log has been accessed twice by an unauthorized ID—not Zeller, not Chuck, and not you. Ostrander.'},
 {if:'!flag:dna_risk',t:'Ostrander keeps questioning the system. Every question is different, but they all point in the same direction.'},
 '>> You can’t hide from a digital network. But you can maneuver within its blind spots.'],
 [{label:'Write down what she is looking for and reckon with it',tag:'Expertise ≥ 5',req:'szak>=5',why:'Requires Expertise ≥ 5',do:['info+:in_ostrander4','gyanu-1']},
  {label:'Log off the system and head home',do:['alca+2']},
  {label:'Play innocent: ask about Ostrander',tag:'Cover +1 · Suspicion +2',do:['alca+1','gyanu+2']}]);

p('D17E','The Letter',[
 'At six PM, a yellow envelope sits inside your metal mailbox. The recipient address is penned in Neil’s shaky handwriting. Inside is a single sheet of heavy bond paper, lines wavering.',
 '“Dear child. I don’t know how much time I have. What I passed to you was never truly mine. Don’t take everything I wrote as gospel. The chain is far older than I am, and older than you. Watch out for the kid.”',
 '>> A letter that conceals more than it reveals. Classic Neil. He only ever gave you half the picture.'],
 [{label:'Re-read the letter carefully and store it away',do:['info+:ny_level']},
  {label:'Place an immediate call to Neil',do:['alca-1','info+:ny_level','flag:neil_called=true']},
  {label:'Tear it up and forget it',do:['rend-2','alca-2']}]);

p('D17J','Decision: The Hollis Case',[
 'One AM. Two dossiers rest on the kitchen table: Vernon Prescott, designated by Neil’s Codex list, and your custom file on Wesley Lindqvist.',
 {if:'ev2>=3',t:'You hold the complete picture: the hair, the license plate, the alibi. It’s Lindqvist, not Prescott.'},
 {if:'ev2<3 and flag:prescott_doubt',t:'Prescott’s alibi renders him questionable, but the case against Lindqvist isn’t fully built yet.'},
 {if:'ev2<3 and !flag:prescott_doubt',t:'You haven’t done sufficient ground work. Prescott remains the sole target listed.'},
 '>> The target list belongs to Neil. The ground truth belongs to you. They were never one and the same.'],
 [{label:'Carry out the job on Wesley Lindqvist',tag:'Evidence ≥ 3',show:'flag:t2_known and !flag:t2_done and !flag:t2_skip',req:'ev2>=3',why:'Not enough evidence (3 needed)',danger:1,do:['flag:t2_done=true','rend+5','gyanu+5','alca-3']},
  {label:'Carry out the job on Vernon Prescott, according to the list',tag:'The evidence contradicts it',show:'flag:t2_known and !flag:t2_done and !flag:t2_skip',danger:1,goto:'E_TEV'},
  {label:'Wait, not yet',show:'flag:t2_known and !flag:t2_done and !flag:t2_skip',do:['alca+1']},
  {label:'Lie down',show:'!flag:t2_known or flag:t2_done or flag:t2_skip',do:['alca+3']}]);

p('D18N','Sunday',[
 'Neil’s backyard is scattered with crisp autumn leaves. He sits motionless in a folding lawn chair, offering no explanation for the letter. You sit down beside him.',
 {if:'flag:neil_called',t:'“Why did you call me? I explicitly told you not to.” The line isn’t spoken in anger, but in shame.'},
 {if:'!flag:neil_called',t:'Neil remains silent for a long stretch. Finally he asks quietly: “Did you read it?”'},
 '>> You complete the unspoken half of the question yourself: *who writes a letter like this to the child he raised?*'],
 [{label:'Ask what he meant by “the chain”',tag:'Order −1 · Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['info+:in_lanc','rend-1']},
  {label:'Say you understand, and that you needn’t talk about it',do:['alca+1']},
  {label:'Take his trembling hand and sit in shared silence',tag:'Cover +3',do:['alca+3','flag:neil_close=true']}]);

p('D18E','Somebody Is Following You',[
 'In the stairwell in the evening, you think you hear footsteps. You stop, and the footsteps fall silent. There is nobody, only the elevator door slowly closing.',
 {if:'flag:shane_involved or flag:shane_close',t:'Behind the wall, someone stays perfectly still for a minute. You are certain you recognize that shallow breathing.'},
 {if:'!flag:shane_involved and !flag:shane_close',t:'You can’t identify the shadow. But the stairwell feels distinctly colder than a moment ago.'},
 '>> Suspicion is just another word for attention. Someone is watching more than your usual routine.'],
 [{label:'Go back and see who it was',tag:'Suspicion +2',danger:1,do:['gyanu+2','info+:in_kovetes']},
  {label:'Go inside and lock the door',do:['alca+1']},
  {label:'Wait in the dark and listen',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['info+:in_kovetes2']}]);

p('D18J','Last Chance',[
 {if:'flag:t2_done',t:'The Hollis case is resolved. The camera swings away, and the city remains none the wiser.'},
 {if:'!flag:t2_done',t:'The final night of the week. The offer still stands: Lindqvist lives where he always has.'},
 '>> Only tonight remains. The Codex detests deadlines, but suspicion thrives on them.'],

p('D19N','Ostrander Again',[

p('D19E','The Pawnbroker',[

p('D19J','Clarity',[

/* ===== Shane’s stance ===== */
p('H4','Shane’s Question',[
 'At the cemetery gates stands Shane Crowe, holding a folded newspaper. “I didn’t mean to intrude. I just... wanted to offer my condolences.” He refrains from asking who Neil was to you.',
 'You walk together toward the parking lot. Shane stays quiet for a block before voicing what’s been burning inside him. “I think I’ve figured out what you’re doing. I’m not saying I’m right, but if I am...” He stops. “I’m not judging you. I just want the system to work. I want someone to finish what Homicide dropped. You don’t believe the legal system works, do you?”',
 '>> The kid isn’t accusing you. He’s asking. That’s the hardest case.'],
 [{label:'Admit the truth: “No. I don’t believe in the system.”',tag:'Order +3 · Suspicion +3 · Shane finds out',do:['rend+3','gyanu+3','flag:shane_honest=true'],goto:'D29J'},
  {label:'Say that you do believe in it',tag:'Cover +2 · Order −1',do:['alca+2','rend-1','flag:shane_lied_to=true'],goto:'D29J'},
  {label:'Ask back: “And you?”',tag:'Observation ≥ 5 · new information',req:'megf>=5',why:'Requires Observation ≥ 5',do:['info+:in_shane6','flag:shane_asked=true'],goto:'D29J'},
  {label:'Say nothing',tag:'Suspicion +1',do:['gyanu+1'],goto:'D29J'}],
 {at:'D29E',kh:'1998. október 29. · csütörtök · késő este',ke:'October 29, 1998 · Thursday · late evening'});

inf('in_shane6','Shane’s Faith','Shane believes in the system, but only as long as somebody sees the work through. He does not want to judge, he wants it to work.','i');

/* ===== Point 3: Shane’s deeper role ===== */
p('H1','The Newspaper Clippings',[
 'By the breakroom coffee maker, Shane holds a spread of clipped newspaper articles. “Take a look at this.” A collection of headlines: the Louise Hartman homicide, the Hollis disappearance, two high-profile acquittals.',
 {if:'flag:t1_done',t:'“Eugene Novak was pulled out of that warehouse. He walked two years ago. Prescott walked the same year. It’s like someone is running down a checklist.”'},
 {if:'!flag:t1_done',t:'“Novak walked, and so did Prescott. Both from the same two years. Strange coincidence, right?”'},
 'Shane isn’t accusing anyone. He looks like a student who just cracked a math problem. “I don’t want anyone getting hurt. I just want to understand the pattern.”',
 '>> The kid is noticing things you desperately need him to overlook. And not out of malice.'],
 [{label:'Say it is only a coincidence, newspapers love to see patterns',tag:'Suspicion −1 · Cover +1',do:['gyanu-1','alca+1','flag:shane_noticed=true'],goto:'D16E'},
  {label:'Listen him out and ask what drew his attention to those specific cases',tag:'Observation ≥ 5 · new information',req:'megf>=5',why:'Requires Observation ≥ 5',do:['info+:in_shane3','flag:shane_noticed=true'],goto:'D16E'},
  {label:'Confiscate the clippings: “Drop it, Shane. The lab has no time for this.”',tag:'Suspicion +2 · Cover −1',do:['gyanu+2','alca-1','flag:shane_noticed=true'],goto:'D16E'}],
 {at:'D16N',kh:'1998. október 16. · péntek · délelőtt',ke:'October 16, 1998 · Friday · morning'});

p('H2','Shane’s Mother',[
 'As the shift ends, the lab clears out, but Shane remains perched on a lab stool, making no move to leave. “You look beat. Rough day?”',
 'He pours a cup of fresh coffee and slides it across the counter. “My mom used to say: the quietest people carry the heaviest baggage.” He stares down at the stainless steel surface. “She worked as a diner waitress down in Dockside. Back in ninety-one, a regular murdered her. I was twelve.”',
 '“The Homicide detectives closed out the case in two weeks. Never double-checked his alibi, skipped interviewing two key witnesses, and a blood-stained glove found in the alley dumpster never got logged into evidence. The suspect walked clean. The judge cited reasonable doubt.”',
 {if:'flag:t1_done',t:'You don’t move a muscle. *Reasonable doubt* was the exact legal phrase used to let Novak walk, too.'},
 'Shane looks up, eyes steady. “That’s why I took this job. To make sure whatever comes through that vault door never gets buried. So someone actually finishes the job. Like Ostrander.” He shrugs. “A month ago, some guy named Tobin called my house saying there was an opening here. Never met the guy before. He even knew my mom’s name. Thought I just got lucky.”',
 '>> Every failure of the system raises someone. He’s sitting here now, looking at you.'],
 [{label:'Express sympathy and hear out his story',tag:'Cover +3 · Order +1',do:['alca+3','rend+1','flag:shane_trauma=true','flag:shane_close=true','info+:in_shane4','info+:ny_shane_tobin'],goto:'D20E'},
  {label:'Say the system really does fail people sometimes',tag:'Cover +2 · Order −2 · Shane grows closer',do:['alca+2','rend-2','flag:shane_trauma=true','flag:shane_close=true','info+:in_shane4','info+:ny_shane_tobin'],goto:'D20E'},
  {label:'Steer him elsewhere, because you don’t want him this close',tag:'Cover −1 · Suspicion −1',do:['alca-1','gyanu-1','flag:shane_trauma=true','info+:in_shane4','info+:ny_shane_tobin'],goto:'D20E'}],
 {at:'D20N',kh:'1998. október 20. · kedd · késő délután',ke:'October 20, 1998 · Tuesday · late afternoon'});

p('H3','In the Corridor',[
 'Ostrander emerges from the conference room. Passing you in the corridor, she utters not a word. Through the glass partition, you see Shane sitting alone inside, staring at his knees.',
 'Shane steps out once her footsteps fade. “She grilled me, too. Same line: where was I on those nights.”',
 {if:'flag:shane_noticed',t:'“She asked about those news clippings. I told her they were my personal project, not yours.”'},
 '“I told her we were cross-referencing archives together last weekend. I don’t know why. I don’t believe you did anything. Someone who works with this level of precision shouldn’t have to keep defending themselves.”',
 {if:'flag:shane_involved',t:'Shane doesn’t mention that he ran the sample. That’s his largest lie, and you both know it.'},
 '>> A kid who believes in your innocence just lied for you. Now you have to decide what his loyalty is worth.'],
 [{label:'Thank him quietly and pledge mutual silence',tag:'Suspicion −4 · Cover +2 · Order −2',do:['gyanu-4','alca+2','rend-2','flag:shane_defended=true'],goto:'D26J'},
  {label:'Tell him not to lie for you',tag:'Suspicion +2 · Order +3',do:['gyanu+2','rend+3','flag:shane_defended=true'],goto:'D26J'},

p('W1','After Wayne',[
 {if:'flag:t4_done',t:'On the morning news, Wayne Sullivan’s name comes up: found dead last night in his Dockside pawnshop. No signs of forced entry; no robbery. Ostrander stands in the lab doorway, silent, her eyes locked on your hands for several seconds.'},

p('W2','Wayne at the Gate',[
