<style>
/* Elrendezés: fent tapadó terminál-HUD (4 mérő), alatta egyoszlopos regényoldal 62 karakteres sorhosszal,
   a döntések mono-címkés konzolsorok. Egyetlen sötét világ, tudatosan nincs világos téma. */
:root{
  --bg:#0a0c12; --bg2:#0f1320; --panel:#121726; --line:#232b42;
  --fg:#d9deec; --dim:#8791ad;
  --cyan:#27e6ff; --magenta:#ff2fa3; --amber:#ffb62e; --amber-soft:#ffd58a;
  --net:#9b8cff; --danger:#ff4d5e;
  --sys:var(--cyan);
  --f-display:"Chakra Petch",system-ui,sans-serif;
  --f-body:"Spectral",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.7}
button{font:inherit;color:inherit}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,color-mix(in srgb,var(--magenta) 60%,transparent) 100%);
  opacity:calc(var(--par,0)*var(--par,0)*.95);transition:opacity .8s}
#scan{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
#app{position:relative;z-index:2;max-width:900px;margin:0 auto;
  padding-block:14px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 2.4s infinite}
.save-ind{color:var(--cyan);opacity:0;transition:opacity .4s}
.save-ind.on{opacity:1}
.tools{display:flex;gap:8px}
.btn{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  background:transparent;border:1px solid var(--line);color:var(--fg);padding:8px 12px;cursor:pointer;border-radius:2px}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.primary{border-color:var(--cyan);color:var(--bg);background:var(--cyan);font-weight:500}
.btn.primary:hover{background:transparent;color:var(--cyan)}
.btn.warn{border-color:var(--magenta);color:var(--magenta)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
  padding:12px 14px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:2px}
.meter{--c:var(--cyan);min-width:0;font-family:var(--f-mono)}
.m-ri{--c:var(--amber)} .m-net{--c:var(--net)} .m-par{--c:var(--magenta)}
.meter.crit{--c:var(--danger)}
.meter{cursor:pointer} .meter:hover .ab{text-decoration:underline}
.mh{display:flex;align-items:baseline;gap:8px;font-size:12px;letter-spacing:.08em;min-height:20px}
.ab{color:var(--c);font-weight:500}
.nm{color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.val{color:var(--fg);font-variant-numeric:tabular-nums;margin-left:auto}
.delta{font-size:11px;padding:0 4px;border-radius:2px;animation:chip 3s forwards}
.delta.good{color:var(--bg);background:var(--cyan)} .delta.bad{color:var(--bg);background:var(--magenta)}
.delta:empty{display:none}
.bar{height:6px;background:var(--bg2);margin-top:5px;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .6s ease}
.meter.crit .bar i{animation:blink 1s infinite}
.m-par.crit .ab::after{content:" // FIGYELNEK";font-size:10px}

main{padding-top:30px;min-height:60vh}
.kick{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);display:flex;gap:10px;flex-wrap:wrap}
.kick span:last-child{color:var(--dim)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,6vw,3rem);line-height:1.1;margin:10px 0 22px;
  text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;outline:none}
body.lowci h1{animation:jit .22s steps(2) infinite;text-shadow:2px 0 var(--magenta),-2px 0 var(--cyan)}
.story{max-width:62ch}
.story p{margin:0 0 1.05em;animation:rise .6s ease both;animation-delay:calc(var(--i)*.26s)}
.story p.dial{color:var(--amber-soft);padding-left:1em;border-left:1px solid var(--line)}
.story p.sys{font-family:var(--f-mono);font-size:13px;line-height:1.5;color:var(--sys);letter-spacing:.04em;transition:color .6s}
.story p.echo{color:var(--dim);font-style:italic}
.story em{color:var(--fg)}
.choices{display:grid;gap:10px;margin-top:30px;max-width:720px;animation:rise .6s ease both;animation-delay:var(--d,.5s)}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:13px 15px;line-height:1.5}
.choice:hover:not(.locked){border-color:var(--cyan);background:var(--bg2);transform:translateX(3px)}
.choice{transition:transform .15s,border-color .15s,background .15s}
.key{font-family:var(--f-mono);font-size:12px;border:1px solid var(--dim);color:var(--dim);padding:1px 7px;margin-top:3px;flex:none}
.choice:hover:not(.locked) .key{border-color:var(--cyan);color:var(--cyan)}
.ctext{flex:1;min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--cyan);color:var(--cyan)}
.tag.ko{border-color:var(--amber);color:var(--amber)}
.choice.locked{opacity:.55;cursor:not-allowed;border-style:dashed}
.choice.aux{border-color:var(--magenta)}
.choice.aux .ctext{color:var(--magenta);font-style:italic}

.title-box{max-width:62ch}
.mega{font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,12vw,6rem);line-height:.95;letter-spacing:.03em;margin:0;
  text-shadow:2px 0 var(--magenta),-2px 0 var(--cyan);animation:glitch 6s infinite}
.sub{font-family:var(--f-mono);letter-spacing:.3em;text-transform:uppercase;color:var(--amber);font-size:clamp(.78rem,3vw,1rem);margin:14px 0 28px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;margin:28px 0;font-size:15px;line-height:1.5}
.legend div{border-top:1px solid var(--line);padding-top:8px}
.legend b{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;display:block;margin-bottom:2px}
.pips{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.pip{border:1px solid var(--line);padding:3px 8px}
.pip.on{border-color:var(--amber);color:var(--amber)}
.fine{font-family:var(--f-mono);font-size:12px;color:var(--dim);margin-top:18px;line-height:1.6}

.banner{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--amber);color:var(--amber);display:inline-block}
.banner.over{border-color:var(--danger);color:var(--danger)}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:26px 0;max-width:720px}
.sum{border:1px solid var(--line);padding:8px 10px;font-family:var(--f-mono);font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.sum b{display:block;color:var(--fg);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}

.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(4px);
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--cyan);max-width:640px;width:100%;padding:20px;margin-block:24px}

<script>
var __DICT={"Kognitív Integritás":"Cognitive Integrity","Mentális HP. Traumák és erőszakos emlékek apasztják. Nullán tudat-összeomlás következik, alacsonyan pedig bátor lehetőségek zárulnak le, és paranoiás látomások törnek rád.":"Mental HP. Trauma and violent memories wear it down. At zero your mind collapses; when it runs low, bold options close off and paranoid visions break over you.","Valóság-Index":"Reality Index","Mennyire tudod elkülöníteni a beültetett emlékeidet a valóditól. Alacsonyan romlik a szöveg és hamis emlékek csalogatnak, magasan észreveszed a Cég manipulációit.":"How well you can tell your implanted memories from real ones. When it is low, the text breaks down and false memories lure you; when it is high, you notice the Corp's manipulation.","Hálózati Hozzáférés":"Network Access","A technikai szinted. Magas értéknél rejtett fájlok, rövidítések és a rendszerátvétel nyílik meg.":"Your technical level. At high values, you gain access to hidden files, shortcuts and system takeover.","Csak nőhet a nyomozással: ennyire figyel a Mnemosyne. Százon a Cég elkap.":"It can only grow as you investigate: this is how closely Mnemosyne is watching you. At 100, the Corp catches up with you.","Átírt ügyirat":"Doctored case file","Az ügyirat metaadatait a Mnemosyne szerkesztette, nem a rendőrség.":"The case file's metadata was edited by Mnemosyne, not by the police.","A kórus suttogása":"The chorus's whisper","A Synapse tömege egyetlen nevet ismétel: Fekete Nap.":"The crowd of the Synapse repeats a single name: Black Sun.","Megrendelt hálózat":"A commissioned network","Az illegálisnak mondott Synapse alaphálózata a Mnemosyne szervereiről fut. A Cég tudott róla.":"The Synapse, supposedly illegal, runs its core network from Mnemosyne's servers. The Corp knew about it.","A gyilkos keze":"The killer's hand","A tettes keze egy csavart rézérmét forgat. Pontosan olyat, mint a zsebemben.":"The killer's hand is turning a twisted copper coin. Exactly like the one in my pocket.","Végre, Rex":"At last, Rex","Hegedűs az utolsó pillanatában a nevemen szólította a gyilkost.":"In his final moment, Hegedűs called the killer by my name.","Ismétlődő időbélyeg":"Repeating timestamp","A gyilkosság felvétele harmincegy iteráció óta ismétlődik.":"The recording of the murder has been repeating for thirty-one iterations.","Léthé-protokoll":"Lethe protocol","Az archívumban: ALANY-0, kódnév REX, iteráció: 31. Kísérleti személy vagyok.":"In the archive: SUBJECT-0, codename REX, iteration: 31. I am a test subject.","Vak Mihály tanúsága":"Blind Mihály's testimony","Ékes Nóra holttestét sosem találták meg. A halálát a Cég jelentette be.":"Nóra Ékes's body was never found. Her death was announced by the Corp.","Hibás emlék":"Flawed memory","Az emlékem Nóráról túl tökéletes. Nincs benne eső. Utólag szerkesztették.":"My memory of Nóra is too perfect. There is no rain in it. It was edited afterwards.","Léthé":"Lethe","Eső a Dunán":"Rain on the Danube","Új-Budapest · Pesti oldal · 31. szint · 23:14":"New Budapest · Pest side · Level 31 · 23:14","Az eső nem mos tisztára semmit Új-Budapesten. Csak lemossa a felszínt, a zsírosabb valóságot meg a csatornákba küldi. Az irodám ablakán át a Mnemosyne-torony vörös hologramja ég a Duna fölött, mint egy be nem gyógyult seb.":"The rain doesn't wash anything clean in New Budapest. It only rinses the surface and sends the greasier reality down into the sewers. Through my office window the red hologram of the Mnemosyne Tower burns above the Danube like a wound that never healed.","Varga hadnagy tizenegykor lép be, kopogás nélkül, nyirkos kabátban, a szeme alatt két fekete félhold. Nem ül le. Egy adatlapot csúsztat az asztalomra. Fizikai papírt, mert a papír nem tud hazudni egy hálózatnak.":"Lieutenant Varga comes in at eleven, without knocking, in a damp coat, two black crescents under his eyes. He doesn't sit down. He slides a data sheet across my desk. Physical paper, because paper can't lie to a network.","— Hegedűs Lőrinc, a Mnemosyne Léthé-osztályának igazgatója. Három napja halott. A Synapse-ben ölték meg, négyezer összekötött elme közepén, és egyikük sem látott semmit. A tettes a Szent Imre-klinikán fekszik: Szél Iván, tizenkilenc éves, agyhalál szélén, de él. Te vagy az egyetlen, aki be tud menni hozzá.":"— Lőrinc Hegedűs, director of Mnemosyne's Lethe Division. Dead for three days. He was killed in the Synapse, in the middle of four thousand linked minds, and not one of them saw anything. The culprit is lying in the Saint Emeric Clinic: Iván Szél, nineteen years old, on the edge of brain death, but alive. You're the only one who can go in to him.","Nem kérdezi, hogy akarom-e. Az emlék-restaurátorok nem azért élnek, hogy kérdezzenek.":"He doesn't ask whether I want to. Memory restorers don't live to ask questions.","Elvállalom. Add a beteg aktáját.":"I'll take it. Give me the patient's file.","Ki fizet? A Cég sosem enged rendőrt az igazgatója fejébe.":"Who's paying? The Corp never lets a cop inside its director's head.","Varga egy pillanatra elfordítja a tekintetét. Ez elég válasz.":"Varga looks away for a moment. That's answer enough.","Átfuttatom az aktát az implantátumomon.":"I run the file through my implant.","Az implantátum halkan sípol. Az akta metaadatait nem a rendőrség írta át.":"The implant beeps softly. The file's metadata wasn't rewritten by the police.","Csatlakozás":"Connecting","Szent Imre-klinika · 4-es kórterem · 00:02":"Saint Emeric Clinic · Ward 4 · 00:02","A kórterem szagát az ózon és a régi izzadság adja. Szél Iván a falnak döntött ágyon fekszik, a halántékán a Synapse-tüske még mindig villog, mintha a fiú agya a lehalt test fölött is kapcsolatot keresne valakivel.":"The ward smells of ozone and old sweat. Iván Szél lies in a bed pushed against the wall, the Synapse spike on his temple still blinking, as if the boy's brain were still reaching out to someone, even from inside a dying body.","Felcsatolom a restaurátor-hevedert. A kezem magától megtalálja a zsebemben a csavart rézérmét, az egyetlen tárgyat, amit az első ébredésemkor magamnál találtam. Nem tudom, honnan van. Sosem tudtam.":"I strap on the restorer harness. My hand finds the twisted copper coin in my pocket on its own, the only object I had on me when I first woke up. I don't know where it came from. I never have.","A biztonsági protokoll három lehetőséget kínál. A csatlakozás visszafordíthatatlanul közelít.":"The safety protocol offers three options. The connection is approaching, and there is no turning back.","Megperdítem a rézérmét. Horgony-rituálé, mielőtt belépek.":"I spin the copper coin. An anchor ritual before I go in.","Gyors csatlakozás, védőprotokoll nélkül.":"Quick connection, no protective protocol.","Lehallgatásmentes alagút: a klinika monitorát hurokba teszem.":"Eavesdrop-proof tunnel: I put the clinic's monitor on a loop.","A Kollektív":"The Collective","Synapse · Rétegszint 0 · Rain Club":"Synapse · Layer 0 · Rain Club","Aztán zuhanok. Nem lefelé: befelé, minden irányban egyszerre. Amikor a világ újra összeáll, egy végtelen éjszakai klubban állok, ahol az eső fölfelé hullik, és minden csepp egy elfelejtett mondat.":"Then I fall. Not downward: inward, in every direction at once. When the world assembles itself again, I'm standing in an endless night club where the rain falls upward and every drop is a forgotten sentence.","A tömeg négyezer alakból áll. Mind ugyanabba az irányba fordul, mintha egyetlen test lenne, amelyet véletlenül sok emberre szabtak. Fényfonalak futnak a halántékaik között, és halkan zúgnak, mint egy távoli transzformátor.":"The crowd is made of four thousand figures. All of them turn the same way, as if a single body had been tailored, by mistake, to fit many people. Threads of light run between their temples and hum softly, like a distant transformer.","A színpadon, mozdulatlanul, Hegedűs Lőrinc teste lebeg. A mellkasán nincs seb. Csak egy fekete, kör alakú üresség, mintha kivágtak volna egy darabot a világból.":"On the stage, motionless, Lőrinc Hegedűs's body floats. There's no wound on his chest. Only a black, circular emptiness, as if a piece had been cut out of the world.","Belemegyek a tömegbe, és követem a fonalakat.":"I walk into the crowd and follow the threads.","Megnézem a holttestet a színpadon.":"I examine the corpse on the stage.","Megcsapolom a Synapse gerinchálózatát: valami rejtett csatorna zúg a padló alatt.":"I tap the Synapse's backbone network: some hidden channel is humming under the floor.","A pult végén egy csonka alak integet: Vak Mihály, a memória-kereskedő.":"At the end of the bar a maimed figure is waving: Blind Mihály, the memory dealer.","A Tömeg":"The Crowd","Synapse · Rétegszint 0 · A fonalak között":"Synapse · Layer 0 · Among the threads","A fonalak közé lépek, és a magam hangja azonnal elnémul. Négyezer ember gondolata zúg át rajtam: feszültség, vágy, valaki fél a holnaptól, valaki a tegnapot siratja. Nem tudom, melyik érzés az enyém.":"I step in among the threads and my own voice goes silent at once. The thoughts of four thousand people roar through me: tension, desire, someone afraid of tomorrow, someone mourning yesterday. I don't know which feeling is mine.","— Mi vagyunk. Mi vagyunk. Mi vagyunk — mondja a kórus, és a szó fáj, mintha vasat nyalnék.":"— We are. We are. We are — says the chorus, and the word hurts, as if I were licking iron.","Mélyen, a zaj alatt, egyetlen hang ismétli ugyanazt a két szót.":"Deep under the noise, a single voice repeats the same two words.","Kitépem magam a hálóból.":"I tear myself out of the web.","Hagyom, hogy a kórus beszéljen.":"I let the chorus speak.","A két szó: Fekete Nap.":"The two words: Black Sun.","Visszakövetem a fonalat a forrásig. Ki kötötte össze őket?":"I trace the thread back to its source. Who connected them?","A fonalak nem a pincéből jönnek, hanem a Mnemosyne-torony szerverterméből. Ezt a hálózatot nem elfedték. Megrendelték.":"The threads don't come from a cellar, but from the Mnemosyne Tower's server room. This network wasn't hidden. It was commissioned.","A Gyilkosság":"The Murder","Synapse · Rétegszint 0 · A színpad":"Synapse · Layer 0 · The stage","A színpad körül az idő sűrű, mint a szirup. Beillesztem a restaurátor-szondát az áldozat halálpillanatába, és újra lejátszom, amit a Synapse rögzített.":"Around the stage time is thick as syrup. I insert the restorer probe into the victim's moment of death and replay what the Synapse recorded.","A gyilkos szemével látok. Két kéz, ismeretlen, remegés nélküli kéz emelkedik Hegedűs mellkasa felé. Az egyik ujjai között egy csavart rézérme forog.":"I see through the killer's eyes. Two hands, unknown, unshaking hands rise toward Hegedűs's chest. Between the fingers of one a twisted copper coin is spinning.","A zsebemben a saját érmém hirtelen felmelegszik. Nem akarom megérinteni.":"In my pocket my own coin suddenly grows warm. I don't want to touch it.","Képkockáról képkockára végignézem.":"I watch it frame by frame.","A gyilkos arca helyett az áldozat arcába nézek.":"Instead of the killer's face, I look into the victim's.","Hegedűs mosolyog. A szája formálja a szót: Végre, Rex.":"Hegedűs is smiling. His mouth shapes the words: At last, Rex.","Visszatekerem az időbélyeget.":"I rewind the timestamp.","A felvétel nem három napja készült. Harmincegy iteráció óta ugyanaz a másodperc ismétlődik.":"The recording wasn't made three days ago. The same second has been repeating for thirty-one iterations.","A Fekete Nap":"The Black Sun","Synapse · Rétegszint 1 · A falfreskó":"Synapse · Layer 1 · The mural","A klub hátsó falán, a neonreklámok alatt, egy sötét kör ég, vékony, törött sugarakkal. Fekete Nap. Ez a szignó Ékes Nóráé, az Elhamvadó fény installáció alkotójáé, a médiaművészé, akit kilenc éve halottnak nyilvánítottak.":"On the back wall of the club, beneath the neon signs, a dark circle burns with thin, broken rays. Black Sun. The signature of Nóra Ékes, creator of the Ashen Light installation, the media artist declared dead nine years ago.","Ismertem. Ez az első mondat, amit magamnak ki merek mondani. Egy tetőterasz jut eszembe, eső, Nóra nevetése, a száján a dohány íze. Az emlék tökéletes. Túl tökéletes: minden részlete olyan, mintha egy rendező világította volna be.":"I knew her. It's the first sentence I dare say to myself. A rooftop terrace comes to mind, rain, Nóra's laughter, the taste of tobacco on her mouth. The memory is perfect. Too perfect: every detail looks lit by a director.","A szignó friss. A festék még nem száradt meg.":"The signature is fresh. The paint hasn't dried yet.","Követem a szignó nyomát a mélyebb rétegekbe.":"I follow the signature's trail into the deeper layers.","Nem lehet. Nóra halott.":"It can't be. Nóra is dead.","Megvizsgálom a saját emlékem: hol van a repedés?":"I examine my own memory: where is the crack?","Nincs benne eső. A tetőterasz emlékében sehol egy csepp, pedig mindig esett.":"There's no rain in it. In the memory of the rooftop terrace there's not a single drop, though it always rained.","Kiolvasom a szignó metaadatait: rejtett fájlcsatorna fut alatta.":"I read out the signature's metadata: a hidden file channel runs beneath it.","Léthé-archívum":"Lethe Archive","Synapse · Gerinchálózat · Titkosított szektor":"Synapse · Backbone network · Encrypted sector","A padló alatt fénylő szerverek sorakoznak, mint egy elsüllyedt város. A hozzáférésem egy pillanatra vörösre vált, majd a rendszer, mintha megkönyörülne rajtam, kinyit egy mappát.":"Under the floor, glowing servers stand in rows like a sunken city. My access flashes red for a moment, then the system, as if taking pity on me, opens a folder.","LÉTHÉ-PROTOKOLL. Alany-0. Kódnév: REX. Iteráció: 31. Állapot: amnéziás, együttműködő, újrahasznosítható.":"LETHE PROTOCOL. Subject-0. Codename: REX. Iteration: 31. Status: amnesiac, cooperative, recyclable.","A kurzor a nevem fölött villog. Egy fájl, ami rólam szól, és amit nem én írtam.":"The cursor blinks above my name. A file about me, one I didn't write.","Letöltöm a teljes archívumot.":"I download the entire archive.","A hozzáférési naplóból közvetlenül a Műtőbe ugrom.":"From the access log I jump straight into the Operating room.","Az utat a Cég elfelejtette lezárni. Vagy valaki szándékosan hagyta nyitva.":"The Corp forgot to seal this route. Or someone left it open on purpose.","Nem nyitom ki tovább. Visszamegyek a klubba.":"I don't open it any further. I go back to the club.","A Folytonosság Felügyelője":"The Continuity Supervisor","Synapse · Rétegszint 1 · Szervizfolyosó":"Synapse · Layer 1 · Service corridor","A szignó mögött szervizfolyosó nyílik, fehér LED-csíkokkal. A folyosó végén egy férfi áll fehér öltönyben. Az arca nem arc, hanem folyamatosan újraszámolt megfelelési-grafikon, mintha az emberi vonásokat valaki szabályzatra cserélte volna.":"Behind the signature a service corridor opens, lined with white LED strips. At the end of it stands a man in a white suit. His face is not a face but a compliance graph, endlessly recalculated, as if someone had swapped human features for a rulebook.","— Rex. Már megint itt vagyunk — mondja kedvesen, ahogy a halottkém szól az áldozathoz. — A Mnemosyne nevében köszönöm, hogy megint velünk dolgozik. Hozza el nekünk Ékes Nóra Kulcsát, a tudatmintáját, és minden folytatódik. Maga hazamehet. Megint.":"— Rex. Here we are again — he says kindly, the way a coroner speaks to the victim. — On behalf of Mnemosyne, thank you for working with us again. Bring us Nóra Ékes's Key, her mind-pattern, and everything goes on. You can go home. Again.","A tekintete lecsúszik a zsebemre, ahová az archívumot töltöttem. Nem szól róla. Ez rosszabb, mintha szólna.":"His gaze slides down to my pocket, where I stored the archive. He doesn't mention it. That's worse than if he did.","Tettetem, hogy elfogadom az ajánlatot.":"I pretend to accept the offer.","Rám mosolyog. Az arcgrafikon zöldre vált. Aki zöldre vált, az mindig hazudik.":"He smiles at me. The face-graph turns green. Whoever turns green is always lying.","Letépem a maszkját.":"I rip off his mask.","Az arca széttörik, mint egy elemzés, amit nem engedtek lefutni.":"His face shatters like an analysis that wasn't allowed to finish running.","Átveszem a felügyelő protokoll gyökérjogát.":"I take over the supervisor protocol's root access.","Elfutok a folyosón.":"I run down the corridor.","Vak Mihály":"Blind Mihály","Synapse · Rain Club · A pult":"Synapse · Rain Club · The bar","A pult végén egy csonka alak ül, a jobb karja hiányzik, a szeme helyén két lemezt visel. Vak Mihály emlékeket árul: tegnapi nevetést, használt gyászt, olcsó boldogságot, csomagolva.":"At the end of the bar sits a maimed figure, his right arm missing, two plates where his eyes should be. Blind Mihály sells memories: yesterday's laughter, used grief, cheap happiness, gift-wrapped.","— Rex — mondja, mielőtt megszólalnék. — Neked már háromszor adtam el ugyanezt a csomagot. Mindig azt hiszed, most jársz itt először.":"— Rex — he says before I can speak. — I've already sold you this same package three times. You always think this is your first visit.","A mosolya nem barátságos. Inkább igazolás.":"His smile isn't friendly. It's more like a certification.","Hamis hozzáférési kulcsot veszek.":"I buy a forged access key.","Megkérdezem Ékes Nóráról.":"I ask about Nóra Ékes.","— A holttestét sosem találták meg. A halálát a Cég jelentette be, nem a rendőrség.":"— They never found her body. Her death was announced by the Corp, not the police.","Nem veszek semmit.":"I buy nothing.","Befejezés":"Ending","Tudat-összeomlás":"Mind collapse","Kognitív Integritás: 0%":"Cognitive Integrity: 0%","A gondolataim szétesnek, mint a nedves papír. A klub, a tömeg, a fekete nap egyetlen sivító zajba olvad. Valahol messze egy gép kiáltja a nevemet, aztán egy másik, aztán már csak a statikus.":"My thoughts fall apart like wet paper. The club, the crowd, the black sun melt into a single shrieking noise. Somewhere far away a machine calls my name, then another, then only static.","A klinikán valaki leveszi rólam a restaurátor-hevedert. Az ágyam mellett két ápoló beszél. — Ez is lefutott. Cserélhetjük. A Cég keres egy új restaurátort.":"In the clinic someone takes the restorer harness off me. Two nurses are talking beside my bed. — This one's run its course too. We can swap him out. The Corp is looking for a new restorer.","A Felügyelet":"The Watch","Paranoia: 100":"Paranoia: 100","A Mnemosyne rám talált. A folyosó falai fehérre váltanak, a LED-csíkok egyenként kialszanak, és a Felügyelő arca, ezúttal megfelelési-grafikon nélkül, közelről néz rám.":"Mnemosyne has found me. The corridor walls turn white, the LED strips go out one by one, and the Supervisor, his face without the compliance graph this time, looks at me from close up.","— Rex — mondja szelíden. — Sajnáljuk. A szál túl sokat tudott. Újraindítjuk az iterációt. Harminckettedik alkalom. Ébredjen fel, és ne emlékezzen semmire.":"— Rex — he says gently. — We're sorry. The thread knew too much. We're restarting the iteration. Thirty-second time. Wake up, and remember nothing.","Valóság-vesztés":"Loss of reality","Valóság-Index: 0":"Reality Index: 0","Már nem tudom, melyik a saját emlékem. A tetőterasz, a konyha, az asszony, aki sosem létezett, a gyerek, aki a nevemen szólít: minden egyformán igaz, és egyformán hamis. Maradok. Maradok, és a hang, amely mindig azt kérdezi, ki vagyok, végre elhallgat.":"I no longer know which is my own memory. The rooftop terrace, the kitchen, the woman who never existed, the child who calls me by my name: everything is equally true, and equally false. I stay. I stay, and the voice that always asks who I am finally falls silent.","Odakint az ápolók a kórlapra jegyzik: restaurátor, nem reagál, a szeme nyitva. Valahol egy konyhában kávé gőzölög.":"Outside, the nurses write on the chart: restorer, unresponsive, eyes open. Somewhere in a kitchen, coffee is steaming.","Új-Budapest":"New Budapest","A kórterem":"The ward"," var AUX_CI={t:T('A falak suttogni kezdenek. Hagyom, hogy beszéljenek…'),to:16,ret:true,fx:{par:3}};
var AUX_RI={t:T('A szoba átrendeződik körülöttem, mintha ismerném…'),to:17,ret:true};

/* ---------- Segédek ---------- */
var $=function(s){return document.querySelector(s)};
var stage=$('#stage'), hud=$('#hud'), modal=$('#modal'), sheet=$('#sheet');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function pad(n){return n<10?'0'+n:''+n}
function distort(s,p){
  if(p<=0)return s;
  var g='▓░▒#';
  return s.replace(/[a-záéíóöőúüű]/gi,function(ch){return Math.random()<p?g.charAt(Math.floor(Math.random()*g.length)):ch});
}
function fmt(p,i,lvl){
  var cls='';
  if(p.indexOf('[SYS]')===0){cls='sys';p=p.slice(5).trim()}
  else{ if(p.indexOf('— ')===0)cls='dial'; p=distort(p,lvl) }
  return '<p class="'+cls+'" style="--i:'+i+'">'+esc(p)+'</p>';
}
function sceneText(s){return typeof s.text==='function'?s.text():s.text}

/* ---------- Feltételek ---------- */
function reqInfo(req){
  var out=[]; if(!req)return out;
  KEYS.forEach(function(k){
    var r=req[k]; if(!r)return;
    if(r[0]!=null)out.push({label:ABBR[k]+' ≥ '+r[0],ok:st[k]>=r[0]});
    if(r[1]!=null)out.push({label:ABBR[k]+' ≤ '+r[1],ok:st[k]<=r[1]});
  });
  if(req.loops){
    var l=st.v.loops;
    if(req.loops[0]!=null)out.push({label:T('Hurok ≥ ')+req.loops[0],ok:l>=req.loops[0]});
    if(req.loops[1]!=null)out.push({label:T('Hurok ≤ ')+req.loops[1],ok:l<=req.loops[1]});
  }
  if(req.calm){var cl=st.v.calm||0; if(req.calm[1]!=null)out.push({label:'',ok:cl<=req.calm[1]})}
  if(req.ev)out.push({label:T('Bizonyíték ≥ ')+req.ev[0],ok:evCount()>=req.ev[0]});
  (req.has||[]).forEach(function(f){out.push({label:'',ok:!!st.flags[f]})});
  (req.not||[]).forEach(function(f){out.push({label:'',ok:!st.flags[f]})});
  return out;
}
function buildChoices(s){
  var out=[];
  (s.choices||[]).forEach(function(c){
    var r=reqInfo(c.req), locked=r.some(function(x){return !x.ok});
    if(c.hide&&locked)return;
    if(c.vis&&c.vis.k3&&k3count()<c.vis.k3)return;
    if(c.vis&&((c.vis.has||[]).some(function(f){return !st.flags[f]})||(c.vis.not||[]).some(function(f){return st.flags[f]})))return;
    out.push({c:c,r:r,locked:locked});
  });
  if(s.aux){
    if(st.ci<=34)out.push({c:AUX_CI,r:[],locked:false,aux:true});
    if(st.ri<=34)out.push({c:AUX_RI,r:[],locked:false,aux:true});
  }
  return out;
}
function deathScene(){
  if(st.ci<=0)return 22;
  if(st.par>=100)return 23;
  if(st.ri<=0)return 24;
  return null;
}

/* ---------- Mentés ---------- */
function save(){
  lsSet(SAVE_KEY,JSON.stringify({v:1,st:st}));
  var el=$('#saveInd'); el.classList.add('on');
  clearTimeout(save.t); save.t=setTimeout(function(){el.classList.remove('on')},1400);
}
function loadSave(){
  try{
    var raw=lsGet(SAVE_KEY); if(!raw)return null;
    var o=JSON.parse(raw).st;
    if(!o||!SC[o.scene]||SC[o.scene].type)return null;
    KEYS.forEach(function(k){if(typeof o[k]!=='number')throw 0});
    o.flags=o.flags||{}; o.v=o.v||{loops:0}; if(typeof o.v.loops!=='number')o.v.loops=0;
    return o;
  }catch(e){return null}
}
function getEnds(){try{return JSON.parse(lsGet(END_KEY)||'[]')}catch(e){return[]}}
function addEnd(id){var e=getEnds(); if(e.indexOf(id)<0){e.push(id);lsSet(END_KEY,JSON.stringify(e))}}

/* ---------- Játékmenet ---------- */
function applyFx(fx){if(!fx)return;KEYS.forEach(function(k){if(fx[k])st[k]=clamp(st[k]+fx[k])})}
function setFlags(a){(a||[]).forEach(function(f){st.flags[f]=true})}

function goTo(id,noEnter){
  st.scene=id;
  var s=SC[id];
  if(!noEnter&&s.enter){applyFx(s.enter.fx);setFlags(s.enter.set)}
  var d=deathScene();
  if(d&&d!==id){id=d;st.scene=d;s=SC[d]}
  if(s.type==='end')addEnd(id);
  if(!s.type)save();
  render();
}

function choose(i,timedOut){
  if(mode!=='play')return;
  var s=SC[st.scene], list=buildChoices(s), it=list[i];
  if(!it||it.locked)return;
  var c=it.c, before={ci:st.ci,ri:st.ri,net:st.net,par:st.par};
  if(st.dls)delete st.dls[st.scene];
  if(c.ret)st.ret=st.scene;
  applyFx(c.fx); setFlags(c.set);
  if(c.inc)Object.keys(c.inc).forEach(function(k){st.v[k]=(st.v[k]||0)+c.inc[k]});
  st.echo=(timedOut?T('Az idő lejárt. A döntést a rendszer hozta meg helyettem. '):'')+(c.echo||''); st.steps++;
  var target=c.to==='ret'?(st.ret||3):c.to, noEnter=c.to==='ret';
  var d=deathScene(); if(d){target=d;noEnter=true}
  goTo(target,noEnter);
  var deltas={}; KEYS.forEach(function(k){deltas[k]=st[k]-before[k]});
  updateHud(deltas);
}

/* ---------- HUD ---------- */
function buildHud(){
  hud.innerHTML=STATS.map(function(s){
    return '<div class="meter m-'+s.k+'" data-k="'+s.k+'" data-act="stat" role="button" tabindex="0" title="'+esc(s.d)+'"><div class="mh"><span class="ab">'+s.ab+'</span><span class="nm">'+s.nm+
      '</span><span class="val"></span><span class="delta"></span></div><div class="bar"><i></i></div></div>';
  }).join('');
}

function sysTier(){
  if(!st||mode!=='play')return 0;
  var inPg=st.scene>=56&&st.scene<=65;
  var score=Math.max(st.par,Math.min(75,(st.v.loops||0)*25),inPg?70:0);
  if(score>=90||(inPg&&st.ci<=25))return 3;
  if(score>=70)return 2;
  if(score>=40)return 1;
  return 0;
}
function sysRefresh(){
  var bar=$('#sysbar'), cl=document.body.classList;
  ['sys-t0','sys-t1','sys-t2','sys-t3'].forEach(function(c){cl.remove(c)});
  var play=(mode==='play'&&st&&!SC[st.scene].type);
  if(!play){bar.hidden=true;cl.add('sys-t0');return}
  var t=sysTier(); cl.add('sys-t'+t); bar.hidden=false;
  var base=[T('[SYS] kapcsolat stabil · restaurátor-szál aktív'),T('[SYS] külső monitor csatlakozott a szálhoz'),T('[SYS] külső irányítás átveszi a szálat'),T('[SYS] ▓▓▓ irányítás átvéve ▓▓▓ ne ellenkezz')][t];
  bar.textContent=base+T(' · PAR ')+st.par+(st.v.loops?T(' · hurok #')+st.v.loops:'')+((st.scene>=56&&st.scene<=65)?T(' · belső réteg'):'');
}

function glitchSetup(){

function pickTimeout(){
  if(mode!=='play'||!st)return;
  var s=SC[st.scene]; if(!s||!s.timer)return;
  var list=buildChoices(s), idx=-1, i;
  for(i=0;i<list.length;i++){if(list[i].c.onTimeout&&!list[i].locked){idx=i;break}}
  if(idx<0)for(i=0;i<list.length;i++){if(list[i].aux){idx=i;break}}
  if(idx<0)for(i=list.length-1;i>=0;i--){if(!list[i].locked){idx=i;break}}
  if(idx>=0)choose(idx,true);
}
function tickTimer(){
  var el=stage.querySelector('.timer'); if(!el||mode!=='play'||!st){stopTimer();return}
  var dl=st.dls&&st.dls[st.scene]; if(!dl){stopTimer();return}
  var now=Date.now();
  if(now>=dl.end){stopTimer();pickTimeout();return}
  var span=Math.max(1,dl.end-(dl.t0||dl.start)), rem=dl.end-now, f=Math.max(0,Math.min(1,rem/span));
  el.querySelector('i').style.width=(f*100)+'%';
  el.classList.toggle('mid',f<.5); el.classList.toggle('low',f<.25);
  el.querySelector('.ts').textContent=Math.ceil(rem/1000)+T(' mp');
}
function setupTimer(){
  stopTimer();
  var old=stage.querySelector('.timer'); if(old)old.remove();
  if(mode!=='play'||!st)return;
  var s=SC[st.scene]; if(!s||s.type||!s.timer||cfg.timer==='off')return;
  if(!st.dls)st.dls={};

    var txt=sceneText(s).join(' ').length, now=Date.now(), read=Math.min(12000,txt*14+1000);
    st.dls[st.scene]={t0:now,end:now+read+s.timer.sec*1000*(cfg.timer==='long'?2:1)};
    save();
  }
  if(Date.now()>=st.dls[st.scene].end){pickTimeout();return}
  var box=stage.querySelector('.choices'); if(!box)return;

  el.innerHTML=T('<div class="tl"><span>Döntési idő</span><span class="ts"></span></div><div class="tbar"><i></i></div>');

var AU={ctx:null,n:null};
function audioStart(){
  if(AU.ctx||!cfg.sound)return;
  var C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  try{
    var ctx=new C(); AU.ctx=ctx;
    var master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
    var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=180; lp.connect(master);
    var o1=ctx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=48;
    var o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=72.5;
    var g1=ctx.createGain(); g1.gain.value=.5; var g2=ctx.createGain(); g2.gain.value=.35;
    o1.connect(g1); g1.connect(lp); o2.connect(g2); g2.connect(lp);
    var buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    var ns=ctx.createBufferSource(); ns.buffer=buf; ns.loop=true;
    var nf=ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=900; nf.Q.value=.8;
    var ng=ctx.createGain(); ng.gain.value=0; ns.connect(nf); nf.connect(ng); ng.connect(master);
    o1.start(); o2.start(); ns.start();
    AU.n={master:master,lp:lp,o2:o2,ng:ng};
  }catch(e){AU.ctx=null;AU.n=null}
}
function audioUpdate(){
  if(!AU.ctx||!AU.n)return;
  var on=cfg.sound&&mode==='play'&&!document.hidden, t=sysTier(), n=AU.n, now=AU.ctx.currentTime;
  n.master.gain.setTargetAtTime(on?0.05+t*0.02:0,now,.4);
  n.lp.frequency.setTargetAtTime(160+t*140,now,.5);
  n.o2.frequency.setTargetAtTime(72.5+t*9,now,.8);
  n.ng.gain.setTargetAtTime(on&&t>=2?0.04*(t-1):0,now,.6);
  if(on&&AU.ctx.state==='suspended')AU.ctx.resume();
}

function render(){
  stopTimer(); glitchStop();
  renderInner();
  var play=(mode==='play'&&st&&SC[st.scene]&&!SC[st.scene].type);
  if(play){glitchSetup();setupTimer()}
  sysRefresh(); audioUpdate();
}

  glitchSetup(); setupTimer(); sysRefresh(); audioUpdate();
}

/* ---------- Eső (háttér) ---------- */
(function(){
  var cv=$('#rain'),cx=cv.getContext('2d'),W=0,H=0,drops=[],raf=0;
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var col=getComputedStyle(document.documentElement).getPropertyValue('--cyan').trim()||'#27e6ff';
  function size(){
    W=cv.width=innerWidth;H=cv.height=innerHeight;
    var n=Math.min(150,Math.floor(W/8));
    drops=[];for(var i=0;i<n;i++)drops.push({x:Math.random()*W,y:Math.random()*H,l:8+Math.random()*18,v:6+Math.random()*9});
  }
  function frame(){
    cx.clearRect(0,0,W,H);cx.globalAlpha=.16;cx.strokeStyle=col;cx.lineWidth=1;cx.beginPath();
    for(var i=0;i<drops.length;i++){
      var d=drops[i];cx.moveTo(d.x,d.y);cx.lineTo(d.x-d.l*.18,d.y+d.l);
      if(!still){d.y+=d.v;if(d.y>H){d.y=-20;d.x=Math.random()*W}}
    }
    cx.stroke();
    if(!still)raf=requestAnimationFrame(frame);
  }
  size();frame();
  addEventListener('resize',function(){size();if(still)frame()});
  document.addEventListener('visibilitychange',function(){
    if(still)return;
    if(document.hidden)cancelAnimationFrame(raf);else frame();
  });
})();
