/* ===== Chuck-ág: a bemártás (okt. 21–22.) ===== */
p('C1','Ismeretlen közreműködő',[
 'Délután Ostrander megjelenik a laborban a pilot jelentésével a kezében. A papír egyetlen sorát kopogtatja meg: *Ismeretlen közreműködő, részleges profil, nem azonosítható.*',
 '„Valaki a laborból. Vagy valaki, aki bármit kapott a laborból.” Négy nevet ír fel a táblára: Zeller, Wexler, Crowe, {{s}}.',
 {if:'flag:chuck_blamed',t:'Chuck neve alá kérdőjelet tesz. Szombati ügyelet, jegyzi mellé, és nem tudod eldönteni, hogy ez fenyegetés-e, vagy csak lejegyzés.'},
 'Chuck Wexler a sarokban issza a harmadik kávéját, és mindent megérint: a kilincseket, a mintatartókat, a bögréket, a pultot. Az ujjlenyomatai mindenhol ott vannak. A DNS-e is: a hajszálai, a nyála a bögrék peremén. A labor az ő nappalija.',
 '>> Valakinek felelnie kell. Chuck mindent megérint. Ez hiba? Vagy ajándék?',
 '>> A Kódex ezt nem engedi, mert Chuck ártatlan. Én viszont nem ismerem a Kódexet.'],
 [{label:'Vedd elő Chuck ujjlenyomatkártyáját, és igazítsd a mintához',tag:'Gyors · alacsony kockázat · Rend −3',do:['flag:c_print=true','flag:chuck_framed=true'],goto:'C2'},
  {label:'Írd át a DNS-profilt úgy, hogy Chuckra hasonlítson',tag:'Erősebb ügy · naplónyom marad · Rend −4',do:['flag:c_gel=true','flag:chuck_framed=true'],goto:'C2'},
  {label:'Mindkettő: ujjlenyomat és DNS',tag:'Biztos ügy · Rend −8 · Álca −5 · túl tiszta lehet',danger:1,do:['flag:c_print=true','flag:c_gel=true','flag:c_both=true','flag:chuck_framed=true'],goto:'C2'}],
 {at:'D21N',kh:'1998. október 21. · szerda · délután',ke:'October 21, 1998 · Wednesday · afternoon'});

p('C2','A munka',[
 'Este nyolc után a labor kiürül. Zeller már elment, Shane a könyvtárban van, Chuck a Sarkantyúban issza a sörét. A kulcs a zsebedben, a bizonyítéktár hűvös, és a monitor zöld betűi mögött valahol egy rendszer vár, amely semmit sem felejt.',
 {if:'flag:c_both',t:'Két munka, egy éjszaka. Az egyik a szemnek, a másik a rendszernek.'},
 {if:'flag:c_print and !flag:c_both',t:'Egy tárgylemez a kikötői raktár mintájával, Chuck kártyája az asztalon, két ujjlenyomat egymás mellett.'},
 {if:'flag:c_gel and !flag:c_both',t:'A gél, a csíkok, és Chuck profiljának nyomtatványa az asztalon.'},
 '>> A világ nem ítél. Csak összehasonlít.'],
 [],
 {at:'D21E',kh:'1998. október 21. · szerda · késő este',ke:'October 21, 1998 · Wednesday · late evening',mini:true});

p('C3','Chuck',[
 {if:'flag:chuck_jail',t:'Reggel két egyenruhás áll a labor ajtajában. Ostrander nem néz körül, egyenesen Chuck asztalához megy. „Chuck Wexler, jöjjön velünk.” Chuck felnevet, mert azt hiszi, vicc. Aztán meglátja a lapot. Zeller a falnak dől, Shane nem szól semmit. Chuck visszanéz rád, és te nem fordítod el a tekintetedet.'},
 {if:'flag:chuck_fired',t:'Zeller csukott ajtók mögött beszél Chuckkal, és tíz perc múlva Chuck egy kartondobozzal jön ki. Felfüggesztették, amíg a vizsgálat tart. „Nem értem. Én sosem nyúltam semmihez, ami nem az enyém.” A mondat igaz.'},
 {if:'flag:chuck_none',t:'Ostrander félrevon a folyosón. „Valaki rendet rakott Chuck körül. Nem tudom, ki. Egyelőre.” Chuck a háttérben a bögréjével babrál, és tudomást sem vesz róla. Nincs letartóztatás, de a kérdőjel nem tűnt el a tábláról.'},
 {if:'flag:chuck_known and flag:chuck_jail',t:'Az ajtóban még egyszer visszanéz, mintha arra a sörözésre gondolna a Sarkantyúban, amikor nevettetek.'},
  '>> Egy ártatlan neve a te kezeddel van aláírva. Ez nem a Kódex. Ez a lánc legrégebbi szabálya: valaki mindig fizet.'],
 [{label:'Menj oda Chuckhoz, és mondd, hogy ez tévedés',tag:'Rend +1 · Álca +2 · Gyanú +1',show:'flag:chuck_jail or flag:chuck_fired',do:['rend+1','alca+2','gyanu+1'],goto:'D22E'},
  {label:'Maradj a helyeden, és dolgozz tovább',tag:'Álca −1 · Gyanú −1',show:'flag:chuck_jail or flag:chuck_fired',do:['alca-1','gyanu-1'],goto:'D22E'},
  {label:'Kérdezd meg Ostrandert, mire gondol',tag:'Gyanú +2 · Álca +1',show:'flag:chuck_none',do:['gyanu+2','alca+1'],goto:'D22E'},
  {label:'Tegyél úgy, mintha mi sem történt volna',tag:'Gyanú −1',show:'flag:chuck_none',do:['gyanu-1'],goto:'D22E'}],
 {at:'D22N',kh:'1998. október 22. · csütörtök · délután',ke:'October 22, 1998 · Thursday · afternoon'});

p('E_HAM','Lebukás: a hamisítás',[
 'Ostrander két papírt tesz le a konyhaasztalra: a lenyomatot és a gélt. Mellettük a laborjegyzőkönyv, kétszer aláhúzva.',
 '„Ugyanaz a hiba van mindkettőben. Egy véletlen lehet egybeesés, két véletlen már kézjegy.” Ostrander nem emeli fel a hangját. „Valaki Chuck Wexlert akarta elém tenni. Valaki, aki ismeri a labort.”',
 'Ránézel a papírokra. A saját munkád, minden sarkában a saját fegyelmed.',
 '>> Két tökéletlen hamisítás egy túl rendezett ember kezében. Én megmondtam volna, de te úgyis elintézted volna magadban.',
 '**Lebukás.** Egy ártatlanra tereltél, és a bizonyíték a te nevedet mondja.'],
 [],{end:'fail',legacy:['leg_ham']});

inf('leg_ham','A hamisítás nyoma','Két hamisítás ugyanazt a hibát hagyja. Aki egymás mellé teszi őket, a kézjegyet látja.','i');

/* ===== Az 1974-es doboz és a Castellano-dilemma ===== */
p('B1','A doboz',[
 'A doboz az íróasztal alsó fiókjában van, kulcsra zárva. Castellano szobája üres, csak az asztali lámpa ég. A házvezetőnő a konyhában alszik, a kamera villogása ritmust ad a csendnek.',
 'A tetején egy 1974-es lap: *Iratbetekintési kérelem, elutasítva.* Alatta három dosszié. Az elsőn Neil keze: *H. – tévedés.*',
 'Az első dosszié Henry {{s}} ügye, 1973. október. Bizonyíték hiányában felmentették, de a gyanú nem múlt el, és két nappal később meghalt. Az alibi levele az ügyész asztalán feküdt a tárgyalás előtt. Egy éjszakai benzinkút pénztárosa írta: a gyilkosság idején Henry nála tankolt, tizennégy mérföldre a helyszíntől, a keltezett nyugta is megvan hozzá. A margón Castellano kézírása, akkor még helyettes ügyészé: *Nem szükséges. Az ügy erős.* A levél sosem jutott el a bíróságig.',
 'A második lapon Tobin gépelt sorai: *A lista nem téved. A gyereket a rendszer úgyis elnyeli. Jessup vegye magához, ha akarja.* Mellette Neil kézírása, remegő betűkkel: *Elviszem.*',
 'A harmadik dossziéban két magán-polaroid: egy-egy lány, ugyanabban a fapaneles szobában, ugyanaz a lámpa látszik, mint Castellano asztalán. A hátoldalukon az ő kézírásával egy-egy dátum, mindkettő hónapokkal a lány eltűnése után. Mellettük a jegyzet, bírói kézírással: *nem bizonyított.* Egyetlen szó, többször aláhúzva.',
 '>> Az apád nem bűnös volt, aki megúszta. Tévedés volt. És a tévedést felnevelték.',
 '>> A szabályok tisztasága nem az igazságé. Csak a fegyelemé.'],
 [{label:'Vidd magaddal az egész dobozt',tag:'Bizonyíték +1 · Gyanú +3 · Rend −2 · a bizonyíték nálad marad',danger:1,do:['flag:box_taken=true','flag:box_read=true','ev3+1','gyanu+3','rend-2','info+:in_apa','info+:in_castellano2'],goto:'D26N'},
  {label:'Fotózd le a lapokat, és tedd vissza a dobozt',tag:'Megfigyelés ≥ 5 · Bizonyíték +1 · Gyanú +1',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['flag:box_read=true','ev3+1','gyanu+1','info+:in_apa','info+:in_castellano2'],goto:'D26N'},
  {label:'Olvasd végig, és tedd vissza',tag:'Rend +1',do:['flag:box_read=true','rend+1','info+:in_apa','info+:in_castellano2'],goto:'D26N'},
  {label:'Égesd el a dobozt',tag:'Rend −3 · Gyanú −1 · a bizonyíték megsemmisül',danger:1,do:['flag:box_burned=true','flag:box_read=true','rend-3','gyanu-1','info+:in_apa','info+:in_castellano2'],goto:'D26N'}],
 {at:'D25J'});

inf('in_apa','Az apád aktája','Az apád nem volt bűnös. A lánc tévedésből jelölte ki, és Neil ezért vette magához a gyereket.','i');
inf('in_castellano2','Castellano titka','Castellano 1973-ban helyettes ügyészként visszatartotta az apád alibijét, ami sosem jutott el a bíróságig. A lányok ügyében a polaroidok szerint hónapokkal az eltűnésük után is találkozott velük, de ez nem bizonyítható.','i');

/* ===== 2. szakasz: Kim a kórházban, sörözés a Sarkantyúban ===== */
p('S1','Munka után',[
 'Hat óra után Chuck az ajtóban áll a kabátjával. „Pilot-sör. Aki szereti a rendszert, jöjjön. Aki gyűlöli, az is.” A Sarkantyú ma tele van, de Chuck asztala mindig szabad.',
 'Shane pár lépéssel mögöttük jön, és úgy néz körül, mint aki először lép be egy templomba. Tizenkilenc éves, ezért Chuck kólát rendel neki, és kacsint a pultosra.',
 '„Huszonkét éve vagyok a laborban. Nyomozó akartam lenni. Megbuktam a vizsgán, és azt mondtam magamnak, hogy a labor csak átmeneti.” Chuck felnevet. „Átmeneti. A feleségem ezen a szón ment el.”',
 '„Tíz év múlva egy gép csinálja, amit én, és jobban. Azért nem csukom be az ajtót rendesen: ha valaki bejön, az azt jelenti, hogy kellek valakinek.”',
 'Shane a kólája fölött rád néz. „Maga sosem téved. Hogyan lehet ezt megtanulni?” A kérdés ártatlan. Chuck nevet. „Úgy, hogy nincs élete.”',
 '>> Egy kocsmaasztal, három ember. A legveszélyesebb dolog, amit tehetsz, hogy megszereted őket.'],
 [{label:'Taníts: mutasd meg Shane-nek, hogyan lehet pontosan dolgozni',tag:'Álca +3',do:['alca+3','flag:shane_taught=true','flag:shane_close=true','flag:chuck_known=true'],goto:'D14E'},
  {label:'Kérdezd Chuckot a régi esetekről',tag:'Megfigyelés ≥ 5',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['info+:in_chuck2','alca+1','flag:chuck_known=true'],goto:'D14E'},
  {label:'Fizess egy kört, és hagyd, hogy ők beszéljenek',tag:'Álca +4',do:['alca+4','flag:chuck_friend=true','flag:chuck_known=true'],goto:'D14E'},
  {label:'Köszönj el korán',tag:'Álca −1',do:['alca-1','flag:chuck_known=true'],goto:'D14E'}],
 {at:'D14N',kh:'1998. október 14. · szerda · késő délután',ke:'October 14, 1998 · Wednesday · late afternoon'});

p('K1','A kórház folyosója',[
 'Vacsora után Kim a táskáját keresi. „Kilenckor kezdem az éjszakásat. Elkísérsz? Nem kell bejönnöd, csak a bejáratig.” A St. Brennan éjjel más: a folyosók hosszabbak, a neon sárgább, és mindenhol fertőtlenítő szaga van.',
 'Kim a liftig hallgat. A negyedik emeleten megáll egy ajtó előtt. „Ő a legrégebbi betegem. Walter Hollis, hetvenegy éves, szívelégtelenség. Minden éjjel ugyanazt kérdezi tőlem.”',
 '„Hogy megtalálták-e az unokáját. Két éve tűnt el. A rendőrök azt mondják, hogy a lány már nem él, de Walter nem hiszi el. Nem tudom, mit mondjak neki.”',
 'Tudod, ki Tammy Hollis. A doboz, a hajszál, a szürke teherautó. Kim nem tudja, hogy te tudod.',
 '>> A szeretteid köre és a nyomozásod ugyanazon a folyosón áll. Vigyázz, melyik ajtó nyílik.'],
 [{label:'Kérdezd meg Kimet, mit szokott mondani neki',tag:'Álca +2',do:['alca+2','flag:kim_hollis=true'],goto:'K2'},
  {label:'Mondd el neki, hogy a laborban te is dolgozol az ügyön',tag:'Álca +3 · Gyanú +2',do:['alca+3','gyanu+2','flag:kim_knows_lab=true'],goto:'K2'},
  {label:'Mondd, hogy nem tudsz róla semmit',tag:'Álca −1',do:['alca-1','flag:kim_lied=true'],goto:'K2'},
  {label:'Tereld másra: kérdezd meg, hogy bírja az éjszakázást',tag:'Meggyőzés ≥ 5 · Gyanú −1',req:'meg>=5',why:'Meggyőzés ≥ 5 kell',do:['gyanu-1','alca+2'],goto:'K2'}],
 {at:'D16E',kh:'1998. október 16. · péntek · este',ke:'October 16, 1998 · Friday · evening'});

p('K2','Az öreg',[
 'A szoba félhomályos. Az ágyon egy sovány, fehér hajú férfi ül, a kezében egy bekeretezett fénykép: egy lány, tizenhét évesen, nevet. A kép sarka megsárgult.',
 '„Maga is a rendőrségtől jön?” Walter Hollis hangja olyan, mint a zsebben tartott papír. „Mindenki azt mondja, hogy dolgoznak az ügyön. Én csak annyit tudok, hogy Tammy az utolsó este egy szürke teherautóról beszélt. Azt mondta, megint ott áll az utcánk végén.”',
 'Kim a háttérben áll, és a kezét a mellkasához szorítja. Walter ezt a mondatot a kórházban még senkinek nem mondta el.',
 {if:'flag:l_lead',t:'A rendszám, a kerékmintázat, Wesley Lindqvist. A szürke teherautó.'},
 '>> Egy öreg ember kimondott egy mondatot, amelyet két éve senki sem hallott meg. Most te hallottad.'],
 [{label:'Hallgasd végig, és jegyezz fel mindent',tag:'Bizonyíték +1 · Gyanú +1',do:['ev2+1','gyanu+1','info+:ny_walter'],goto:'D16J'},
  {label:'Mondd, hogy mindent megtesznek érte',tag:'Álca +2 · Rend +1',do:['alca+2','rend+1'],goto:'D16J'},
  {label:'Fogd meg a kezét',tag:'Álca +3',do:['alca+3','flag:kim_bond=true'],goto:'D16J'},
  {label:'Figyeld Kim arcát, miközben Walter beszél',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['info+:in_kim3'],goto:'D16J'}],
 {at:'D16E',kh:'1998. október 16. · péntek · késő este',ke:'October 16, 1998 · Friday · late evening'});

inf('in_chuck2','Chuck félelme','Chuck attól fél, hogy a gépek egyszer az ő nyomait találják meg: a labor tele van velük.','i');
inf('ny_walter','Nyom: Walter Hollis szava','Walter szerint Tammy az utolsó este egy szürke teherautóról beszélt.');
inf('in_kim3','Kim hallgatása','Kim többet tud az ügyről, mint amennyit mond. Vagy csak fél tőle.','i');

/* ===== 3. szakasz: Ostrander macska-egér jelenetei ===== */
p('O1','A nyitott mappa',[
 'Ostrander a tárgyalóban hagy, a kávé még gőzöl a csészében. „Egy pillanat, telefon.” Az ajtó becsukódik mögötte, és az üvegen át látod a hátát a folyosón.',
 'Az asztalon egy mappa fekszik nyitva. Egy lista, nevekkel, mellettük apró pipákkal. A legfelső név alatt áthúzás.',
 {if:'flag:t1_done',t:'A legfelső név Eugene Novak. Mellette nincs pipa.'},
 '>> Egy nyitott mappa és egy üvegfal. Vagy hanyagság, vagy csapda.'],
 [{label:'Nézd meg a mappát',tag:'Gyanú +2 · új információ',do:['gyanu+2','info+:in_ostrander5',{if:'flag:t1_done',do:['gyanu+2']}],goto:'D13E'},
  {label:'Ne nyúlj hozzá, nézz ki az ablakon',tag:'Gyanú −2',do:['gyanu-2'],goto:'D13E'},
  {label:'Csukd be a mappát, és told vissza a helyére',tag:'Gyanú +1 · Rend +1 · túl rendes',do:['gyanu+1','rend+1'],goto:'D13E'},
  {label:'Kérdezd meg, amikor visszajön: „Szándékosan hagyta nyitva?”',tag:'Meggyőzés ≥ 6 · Gyanú −3 · Álca +2',req:'meg>=6',why:'Meggyőzés ≥ 6 kell',do:['gyanu-3','alca+2'],goto:'D13E'}],
 {at:'D13N',kh:'1998. október 13. · kedd · délután',ke:'October 13, 1998 · Tuesday · afternoon'});

p('O2','Ebéd',[
 'Délben Ostrander az ajtóban áll a kabátjával. „Ebéd. Én fizetek. Ez nem kihallgatás.” A Fulton és a Harmadik sarkán álló étkezdében a pincérnő kávét tölt, mielőtt bárki kérne.',
 'Ostrander kihúzza a székét, és megvárja, amíg leülsz. Nem néz a jegyzettömbre. „Tudja, miért nem szeretem a fegyelmezett embereket?”',
 '„A bátyám huszonhat éves volt, amikor megtalálták egy ellopott autóban. Tiszta helyszín. Se szál, se ujjlenyomat, se dulakodás. A gyilkosa soha nem lett meg.” Megkeveri a kávéját. „Azóta nem bízom a tökéletes helyszínekben.”',
 {if:'flag:t1_done',t:'Ostrander nem néz rád, de a mondatot lassan mondja ki, mintha azt akarná, hogy jól hallgasd.'},
 '>> Ostrander a bátyja halálát úgy adta át neked, mint egy bizonyítékot. Aki ilyet tesz, az valamit cserébe vár.'],
 [{label:'Mondd, hogy sajnálod, és kérdezz a bátyjáról',tag:'Álca +3 · Gyanú −2',do:['alca+3','gyanu-2','flag:ost_rapport=true','info+:in_ostrander6'],goto:'D19E'},
  {label:'Mondd, hogy te is vesztettél valakit',tag:'Álca +2 · Gyanú −1 · Rend −1',do:['alca+2','gyanu-1','rend-1','flag:ost_rapport=true','info+:in_ostrander6'],goto:'D19E'},
  {label:'Hallgass, és egyél',tag:'Gyanú +2',do:['gyanu+2'],goto:'D19E'},
  {label:'Mondj egy okos mondatot a fegyelemről',tag:'Meggyőzés ≥ 6 · Gyanú −3 · Álca +1',req:'meg>=6',why:'Meggyőzés ≥ 6 kell',do:['gyanu-3','alca+1'],goto:'D19E'}],
 {at:'D19N',kh:'1998. október 19. · hétfő · dél',ke:'October 19, 1998 · Monday · noon'});

p('O3','Ostrander a lépcsőházban',[
 'Vasárnap este a lépcsőházban valaki vár. Ostrander a lift mellett áll, kabátban, mintha csak éppen erre járna. „Beszéltem Kimmel. Kedves hölgy. Süteményt is adott.”',
 {if:'flag:kim_knows_lab',t:'„Azt mondta, tudja, hogy maga a Hollis-ügyön is dolgozik a laborban. Nem említette, hogy maga is érintett.”'},
 {if:'flag:kim_lied',t:'„Azt mondta, maga kijelentette, hogy semmit sem tud a Hollis-ügyről. Kíváncsi vagyok, miért.”'},
 {if:'!flag:kim_knows_lab and !flag:kim_lied',t:'„Azt mondta, maga mindig a hétköznapi órákban jön haza. Érdekes, hogy a labor éjszakai belépései mást mutatnak.”'},
 'Ostrander mosolyog. Ez az első alkalom, hogy mosolyog.',
 '>> A szomszéd a legjobb tanú: nem is tudja, hogy az.'],
 [{label:'Mondd, hogy Kim kedves, de nem látja, mikor dolgozol éjjel',tag:'Gyanú +2 · Álca +1',do:['gyanu+2','alca+1'],goto:'D25J'},
  {label:'Kérdezd meg, mit szeretne tudni',tag:'Gyanú −1',do:['gyanu-1'],goto:'D25J'},
  {label:'Hívd be egy kávéra',tag:'Gyanú +3 · Álca +3 · kockázatos',danger:1,do:['gyanu+3','alca+3','flag:ost_inside=true'],goto:'D25J'},
  {label:'Győzd meg, hogy Kim félreértett valamit',tag:'Meggyőzés ≥ 7 · Gyanú −4 · Álca −1',req:'meg>=7',why:'Meggyőzés ≥ 7 kell',do:['gyanu-4','alca-1'],goto:'D25J'}],
 {at:'D25E',kh:'1998. október 25. · vasárnap · késő este',ke:'October 25, 1998 · Sunday · late evening'});

inf('in_ostrander5','Ostrander nyitott mappája','A lista rövid, a pipák mellett apró dátumok. Ostrander nem hanyag: ez csapda volt.','i');
inf('in_ostrander6','Ostrander bátyja','Ostrander bátyját tiszta helyszínen találták meg, és a gyilkos soha nem lett meg. Ezért gyanakszik a fegyelemre.','i');

/* ===== 4. szakasz: „halott idő” – rövid, hétköznapi jelenetek (Álca-építés) ===== */
p('R1','Az utolsó busz',[
 'A tizenegy ötvenes busz üres, csak hátul ül egy idős férfi egy összehajtott újsággal. A lámpák szakaszosan villognak, a vezető rádiójából pedig halkan Keith Yates hangja szűrődik ki.',
 'A hirdetőtáblán a DNS-pilot plakátja: egy nagyított spirál és egy mosolygó laboráns. Az öreg észreveszi, hogy nézed. „Mindenki ilyen lesz, mondják. Egy sorszám.”',
 '>> Egy hétköznapi utas. Senki sem figyeli, ki melyik megállóban szállt le.'],
 [{label:'Válaszolj neki, és beszélgess a megállóig',tag:'Álca +2',do:['alca+2'],goto:'D03N'},
  {label:'Nézz ki az ablakon',tag:'Álca +1',do:['alca+1'],goto:'D03N'},
  {label:'Szállj le egy megállóval előbb, és sétálj haza',tag:'Gyanú −1',do:['gyanu-1'],goto:'D03N'}],
 {at:'D02J'});

p('R2','A mosoda',[
 'A Maple Street-i mosodában ilyenkor már csak a gépek zúgnak. Egy fiatal nő a sarokban a vasalnivalóját hajtogatja, és a kosarad fölé hajol. „A nyolcas gép a legjobb. A többi megeszi a zoknit.”',
 'A forgó dob monoton, szinte altató. Nem tudod, mikor érezted magad utoljára ilyen békésnek.',
 '>> Tiszta ruha, csendes éjszaka. Aki ilyet csinál, annak nincs mit rejtegetnie. Ez a hétköznapi élet legjobb álcája.'],
 [{label:'Köszönd meg a tippet, és tedd be a ruhát a nyolcasba',tag:'Álca +2',do:['alca+2'],goto:'D06N'},
  {label:'Hagyd, hogy a gép dolgozzon, és olvass',tag:'Álca +1 · Rend +1',do:['alca+1','rend+1'],goto:'D06N'},
  {label:'Kérdezd meg, hol dolgozik',tag:'Álca +3 · Gyanú +1',do:['alca+3','gyanu+1'],goto:'D06N'}],
 {at:'D05J'});

p('R3','A késői étkezde',[
 'Az éjszakás étkezdében a pincérnő már tudja, mit rendelsz: egy kávét és egy szelet almás pitét. „Mint mindig.” Régen volt, hogy valaki rád nézett, és nem kellett magyarázkodnod.',
 'A tévé a pult fölött hangtalanul a híreket mutatja. A felirat: DNS-adatbázis, országos indulás, október 15.',
 '>> A rutin a legjobb álruha. Amíg ugyanabban az órában ülsz ugyanazon a széken, nem is létezel.'],
 [{label:'Hagyj borravalót, és beszélgess vele pár percet',tag:'Álca +2',do:['alca+2'],goto:'D07N'},
  {label:'Fizess, és menj',tag:'Álca +1',do:['alca+1'],goto:'D07N'}],
 {at:'D06J'});

p('R4','A tévé',[
 'A kanapén ülsz, a tévé hangtalan. A híradóban egy szakértő biztosítja a nézőket, hogy a DNS-rendszer megbízható, és hogy csak a bűnösöknek kell félniük.',
 'Egy pillanatra mosolyogsz. Aztán lehalkítod a gondolataidat is.',
 '>> A világ azt hiszi, hogy a technológia megvédi. Néha igaza van.'],
 [{label:'Kapcsold ki, és aludj',tag:'Álca +2',do:['alca+2'],goto:'D19N'},
  {label:'Nézd végig, és jegyezd meg, mit mond',tag:'Szakértelem ≥ 5 · Gyanú −1',req:'szak>=5',why:'Szakértelem ≥ 5 kell',do:['gyanu-1'],goto:'D19N'}],
 {at:'D18J'});

p('R5','A szomszéd kutyája',[
 'Hajnalban a lépcsőházban Mr. Dalton kutyája, egy öreg beagle, a lábadnak támaszkodik. A gazdája mentegetőzik: „Tetszik neki. Idegent egyébként sosem szeret.”',
 '>> Egy kutya, aki megbízik benned. Az állatok jobban éreznek, mint az emberek. Vagy rosszabbul.'],
 [{label:'Simogasd meg, és beszélgess a gazdájával',tag:'Álca +2',do:['alca+2'],goto:'D21N'},
  {label:'Köszönj, és menj tovább',tag:'Álca +1',do:['alca+1'],goto:'D21N'}],
 {at:'D20J'});

p('R6','Hajnali sétány',[
 'Hajnali négykor a Fulton Avenue üres, a kirakatok sötétek. A pék már világít a sarkon, és friss kenyér illata árad ki. „Korán kelő, vagy későn fekvő?” – kérdezi mosolyogva.',
 '„Későn fekvő.”',
 '>> Az éjszaka egy másik város. Néha jó benne sétálni anélkül, hogy bármit akarnál.'],
 [{label:'Vegyél egy kiflit, és beszélgess a pékkel',tag:'Álca +2',do:['alca+2'],goto:'D25N'},
  {label:'Köszönj, és nézd a kirakatokat',tag:'Álca +1',do:['alca+1'],goto:'D25N'}],
 {at:'D24J'});

p('R7','Az ablak',[
 'Az ablakban a város fényei halványak. A szemközti házban valaki zongorázik, ügyetlenül, ugyanazt a három ütemet ismételve.',
 'Hallgatod, és hirtelen elmosolyodsz. Nem tudod, miért.',
 '>> Néhány pillanat nem a láncé és nem a Kódexé. Csak a tiéd.'],
 [{label:'Hallgasd végig',tag:'Álca +2 · Rend +1',do:['alca+2','rend+1'],goto:'D28N'},
  {label:'Csukd be az ablakot, és feküdj le',tag:'Álca +1',do:['alca+1'],goto:'D28N'}],
 {at:'D27J'});

/* ===== 4. ív: A lánc (okt. 22–31) ===== */
p('D22N','A vendég',[
 'Dr. Zeller egy idős férfit vezet be a laborba. Vékony, szemüveges, a kabátja régi szabású. A mozdulatai pontosak, mint egy gépé, amelyet már nem koptat semmi.',
 '„Lester Tobin. Negyvenkét évig dolgozott itt asszisztensként, még mielőtt én megérkeztem. Ő ajánlotta Shane-t is. Régi barát. Néha még benéz hozzánk, és az újoncokról kérdez.”',
 {if:'info:ny_foto or info:leg_tobin',t:'A fénykép. Ugyanaz az arc. L.T., 1972.'},
 {if:'!info:ny_foto and !info:leg_tobin',t:'Az arca valahonnan ismerős, de nem tudod, honnan.'},
 'Tobin feléd nyújtja a kezét, és a mosolya soha nem ér el a szeméig.',
 '>> Ez az az ember, aki már azelőtt ismerte a szabályokat, hogy te megtanultad volna őket.'],
 [{label:'Fogj kezet, és mutatkozz be',tag:'Álca +2',do:['alca+2','flag:tobin_met=true'],goto:'C3'},
  {label:'Kerüld, és menj a dolgodra',tag:'Gyanú +1',do:['gyanu+1','flag:tobin_met=true'],goto:'C3'},
  {label:'Kérdezz Zellertől Tobinról, amikor kettesben vagytok',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['info+:ny_tobin_zeller','flag:tobin_met=true'],goto:'C3'}]);

p('D22E','Kávé',[
 'Tobin a labor előtt vár, a járdán, egy öreg esernyő alatt. „Egy kávé? Nem tart sokáig.”',
 'A mondat udvarias. Tobin hangja nem az.',
 {if:'info:ny_foto',t:'A fényképet a zsebedben érzed. Tudod, hogy előbb vagy utóbb meg kell kérdezned.'},
 '>> Tobin nem kávéra hív. Azt akarja látni, hogyan ülsz le valakivel, aki ismeri a láncot.'],
 [{label:'Menj el vele',tag:'Álca +1',do:['alca+1','flag:tobin_coffee=true']},
  {label:'Hárítsd el: sürgős munkád van',do:['alca-1']},
  {label:'Mondd: „Szívesen, de nálam, holnap”',tag:'Rend −1',do:['flag:tobin_coffee=true','rend-1']}]);

p('D22J','Tobin',[
 'Éjszaka a rendőrségi archívumban ülsz, és a nyugdíjazott laboros személyi lapját olvassa. Lester Tobin, született 1926-ban, laborasszisztens 1949-től 1991-ig.',

 'Az aktában egyetlen említésre méltó dolog van: Neil Jessup 1972-ben kezdett nála.',

  {label:'Jegyezd meg, mit nem mond az akta',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['info+:ny_tobin_hiany'],show:'!flag:witnessed'}]);

p('D23N','Tobin otthon',[
 'Tobin lakása egy kis, tiszta téglaház, régi tapétával. A falon fényképek, mind ugyanabból az évszázadból, mind ugyanolyan komoly.',
 'Az egyik fénykép mellett, címke nélkül, egy újságkivágás lóg: egy 1991-es felmentő ítélet, két hasáb. A szélét valaki gondosan levágta.',
 'Tobin kávét tölt, és amikor leül, halkan beszél. „Nem tudom, mit tudsz. De azt tudom, hogy Neil nem mondott el mindent.”',
 '„Mielőtt kérdeznél: a Kódexet nem én írtam. Én is csak megkaptam, egy férfitól, akit Tanárnak hívtak. Ő is kapta valakitől.”',
 '>> Nem a gyilkos beszél, hanem egy futár. Az, aki viszi tovább a levelet.'],
 [{label:'Kérdezd: ki kapta először?',do:['info+:ny_tobin_lanc','rend-1']},
  {label:'Kérdezd: miért Neil, miért én?',tag:'Álca −1',do:['info+:ny_tobin_miert','alca-1']},

 {enter:['info+:kx_hatlap']});

p('D23E','Neil hívása',[
 'Este nyolckor cseng a telefon. Nincs köszönés. „Lester ott volt nálad.” Nem kérdés.',
 'Neil hangja zihál, mintha fel akarna állni, és nem tudna.',
 '„Gyere ide. Most.”',
 '>> Ez az első alkalom, hogy parancs helyett kérés.'],

p('D23J','Neil igazsága',[
 'Neil a konyhaasztalnál ül, a kezében két kávé, de egyiket sem issza. A szekrény ajtaja nyitva, először, amióta emlékszel.',
 '„Kilenc éves voltál. Az apád halála után én szedtelek fel az utcáról. Lester azt mondta: a gyereket jól lehet nevelni. Én hittem neki. Aztán szerettelek. Ezt nem terveztem.”',
 {if:'info:ny_tobin_lanc',t:'„Tudom, mit mondott. Hogy a lánc régebbi nálam. Igaz. De én hagytam, hogy te legyél az, aki továbbviszi.”'},
 'Neil megáll, mintha még egy mondat várna a nyelve hegyén. Aztán csak a kávéra néz.',
 '„Nem akartam, hogy te legyél. De már az első napon tudtam, hogy az leszel.”',
 '>> A legrosszabb mondat az, amelyik igaz és szeretetből jön.'],
 [{label:'Fogd meg a kezét: „Tudom”',tag:'Álca +4',do:['alca+4','flag:neil_truth=true','flag:neil_close=true','rend+2']},
  {label:'Mondd: „Miért nem hagytál ki ebből?”',do:['flag:neil_truth=true','rend-2','alca-3']},
  {label:'Hallgass, és nézz a kezére',do:['flag:neil_truth=true']},{label:'Maradj higgadt, és hallgasd végig',tag:'Hidegvér ≥ 6 · Álca +3 · Rend +2',req:'hid>=6',why:'Hidegvér ≥ 6 kell',do:['flag:neil_truth=true','alca+3','rend+2']}],
 {enter:['info+:in_neil_igaz']});

p('D24N','A szekrény',[
 'Neil engedi, hogy kinyisd a szekrényt. Benne dossziék sorakoznak, évtizedekre visszamenően, mind ugyanazzal a sárgult borítóval.',
 'Kinyitod a legfelsőt. Egy névsor. Nevek, dátumok, mindig ugyanabban a fegyelmezett fogalmazásban.',
 {if:'info:ny_kez',t:'A kézírás ugyanaz a hurkos g-vel, mint az aktában. Tobin keze.'},
 {if:'!info:ny_kez',t:'Három kézírás váltakozik: egy szögletes, egy hurkos, egy erősen dőlt. Három ember, több évtized.'},
 '>> A névsor hosszabb, mint gondoltad. És nincs lezárva.'],
 [{label:'Olvasd végig a névsort',tag:'Rend −2 · Álca −3',do:['rend-2','alca-3','info+:ny_lista2']},
  {label:'Keresd a saját neved a lapokon',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['info+:ny_sajat','alca-2']},
  {label:'Csukd be, és ne nézd',do:['rend+1','alca+1']},{label:'Olvasd végig hidegvérrel, és jegyezz meg mindent',tag:'Hidegvér ≥ 7 · új nyomok',req:'hid>=7',why:'Hidegvér ≥ 7 kell',do:['info+:ny_lista2','info+:ny_sajat']}],
 {enter:['info+:kx_lista']});

p('D24E','Új név',[
 'Este Tobin egy borítékot hoz, személyesen. „A lánc kéri.” Nincs más mondat.',
 'A boríték egyetlen nevet tartalmaz: Craig Castellano. Egykor ügyész, később bíró, ma ingatlanfejlesztő. Két fiatal nő eltűnése miatt kétszer vádolták, kétszer nem bizonyították be.',
 '„Van nála valami, ami a láncot fenyegeti. Egy doboz, 1974-ből. Neil neve is rajta van. A tiéd is rákerülhet.”',
 '>> Egy kérés, ami nem kérés. Egy név, ami nem a tied.'],
 [{label:'Vedd át a borítékot, és hallgasd végig',do:['flag:t3_known=true','info+:in_castellano','rend-1']},
  {label:'Utasítsd vissza: ez nem a Kódex',tag:'Rend +3 · Gyanú +2',do:['flag:t3_skip=true','rend+3','gyanu+2']},

p('D24J','Castellano',[
 {if:'flag:t3_known and !flag:t3_skip',t:'Craig Castellano egy hatalmas, hideg házban él a Hillcrest-dombon, kerítéssel, kamerával, házvezetőnővel. Azt hiszi, hogy a világ az övé.'},

 {if:'flag:t3_known and !flag:t3_skip',t:'A kerítésen kívül állsz, és a tekinteted a házon siklik.'},

p('D25N','Utolsó vasárnap',[
 'Neil kimerült, de felöltözött, mint aki elmegy valahová. A nap hideg és világos.',
 'Megteríted az asztalt, és Neil végre megszólal: „Egy dolgot kérek. Ne add tovább.”',
 {if:'flag:neil_truth',t:'A hangja nem utasítás, hanem könyörgés. „A lánc ott ér véget, ahol te úgy döntesz.”'},

p('D25E','Shane',[
 'A labor szomszédos asztalánál Shane Crowe a protokollt másolja. Mozdulatai pontosak, szinte türelmesek, mintha valaki időközben megtanította volna.',

p('D25J','Castellano, másodszor',[

p('D26N','Az egyezés',[
 'Dr. Zeller az irodájában ül, a monitoron egy lista. Az arca komoly.',

p('D26E','Késői kihallgatás',[
 'Ostrander az ajtóban áll, a kabátja a karján. „Egy pillanat, {{s}}. Egy kávé, öt perc.”',
 'A tárgyalóban sötét, két szék, egy lámpa. Ostrander nem ül le.',
 '„Mondja el, mit csinált az elmúlt két hétvégén. Nem vádolom. Csak rendet szeretnék tenni.”',
 '>> A „rend” a legveszélyesebb szó, amit egy nyomozó használhat.'],
 [{label:'Mondj igazat, amennyit lehet',tag:'Gyanú −3 · Álca −2',do:['gyanu-3','alca-2'],goto:'H3'},

p('D26J','Harmadik munka',[
 {if:'flag:t3_known and !flag:t3_skip and !flag:t3_done',t:'A Hillcrest-dombon csend. A ház ugyanúgy áll, a kamera ugyanúgy villog. A Kódex nem szól, de a lánc igen.'},

p('D27N','Hivatalos',[
 'Ostrander reggel nyolckor az ajtóban áll, két egyenruhással. „Hivatalos beszélgetés, {{s}}. Nem letartóztatás.”',

 {if:'flag:witnessed and !flag:paid_wayne and !flag:t4_done',t:'Ostrander lapoz a papírjai között. „Valaki látta magát a Lindqvist-háznál. Egy zálogos. Nem biztos, hogy hiteles.”'},

 {if:'flag:t4_done',t:'Ostrander lapoz a papírjai között. „Egy zálogos azt állította, hogy látta magát a Lindqvist-háznál. A zálogos meghalt. Nem szeretem a véletleneket.”'},
 {if:'flag:wayne_talks and !flag:t4_done',t:'„Többet is mondott, mint amennyit szeretett volna. Hogy magát többször látta a környéken.” Ostrander a papírra néz. „Nem tudom, mennyit hihetek belőle.”'},

 '>> A hétköznapi világ sosem fenyeget. Csak kérdez.'],

  {label:'Támadj: „Mit akar bizonyítani?”',tag:'Gyanú +7',danger:1,do:['gyanu+7','alca-3']},{label:'Győzd meg, hogy a labor nyomai ártalmatlanok',tag:'Meggyőzés ≥ 8 · Gyanú −5',req:'meg>=8',why:'Meggyőzés ≥ 8 kell',do:['gyanu-5','alca-1']},{label:'Emlékeztesd az ebédre: „Maga mondta, hogy nem bízik a tökéletes helyszínekben.”',tag:'Gyanú −3 · Álca +1',show:'flag:ost_rapport',do:['gyanu-3','alca+1']},{label:'Maradj higgadt, és ismételd el ugyanazt',tag:'Hidegvér ≥ 7 · Gyanú −4',req:'hid>=7',why:'Hidegvér ≥ 7 kell',do:['gyanu-4']}],

p('D27E','Kim látja',[
 'Este Kim a lépcsőházban vár. Vörös a szeme, remeg a keze. „Ma bejött egy rendőr a kórházba, és rólad kérdezett.”',

 'Éjszaka, a konyhában, a Kódex ott fekszik az asztalon. A sárga lap a lámpa alatt úgy ragyog, mintha világítana.',

p('D28N','Az óra',[
 'Neil a kórházi ágyon ül, ugyanabban a kardigánban, mint mindig. Egy kopott zsebóra van a kezében.',
 '„Ez Lestertől jött hozzám, tőlem hozzád. Mindenki hordta, aki vitte.”',
 {if:'megf>=5 or info:ny_foto',t:'Az óra hátoldalán apró vésetek: három monogram, és a negyedik helye még üres.'},
 {if:'!flag:box_read',t:'Neil hirtelen halkan megszólal. „Az apád nem volt bűnös. Tévedés volt. Lester azt mondta, a lista nem téved. Én kimondtam, hogy téved. Aztán felneveltelek.”'},
 {if:'flag:box_read',t:'Neil az arcodat nézi. „Elolvastad. Látom rajtad.” Nem kérdez semmit.'},
 '„Tudtam, hogy a lista tévedhet. Attól a naptól tudtam. De ha kimondom, hogy Lester tévedett, akkor minden, amit utána tettem, hiába volt. Inkább adtam tovább a szabályokat, mint hogy elfogadjam: egy tévedést szolgáltam.”',
 '>> Egy tárgy, ami nem tiltott, mégis mindent elmond. Az óra a lánc.'],
 [{label:'Vedd át az órát',tag:'Rend −1 · Álca +1',do:['info+:ny_ora','rend-1','alca+1']},
  {label:'Utasítsd vissza: „Én nem viszem tovább”',tag:'Rend +3 · Álca −1',do:['rend+3','alca-1','flag:watch_refused=true']},
  {label:'Tedd vissza az ágyra, és fogd a kezét',do:['alca+2','flag:neil_close=true']}],
 {enter:[{if:'!flag:box_read',do:['info+:in_apa']}]});

p('D28E','Éjjeli látogatás',[
 'Kim éjszakai műszakban dolgozik azon az osztályon, ahol Neilt fektették. A folyosón vársz, és Kim kijön.',
 {if:'flag:kim_bond',t:'„Nem tudom, mit tettél, de ő téged szeret. Ezt nem lehet megjátszani.”'},
 {if:'!flag:kim_bond',t:'„Ő nagyon gyenge. Nem tudom, meddig bírja.”'},
 '>> Egy ápolónő, aki látja, ki szereti a betegét. Nincs ennél pontosabb tanú.'],
 [{label:'Köszönd meg, és maradj Neil mellett',tag:'Álca +3',do:['alca+3','flag:neil_close=true']},
  {label:'Menj haza, és pihenj',do:['alca+1']},
  {label:'Kérdezd meg Kimet, mit mondott Neil',tag:'Megfigyelés ≥ 5',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['info+:in_neil_szava']}]);

p('D28J','Éjszaka a kórházban',[
 'Hajnali három, a kórházi folyosón csak a gépek hangja. Neil alszik. A légzése lassú, szabályos, a keze az óra mellett pihen.',
 {if:'flag:neil_close',t:'A keze ott van a tiéden, mintha valaki kérte volna, hogy maradj.'},
 'Egy órát ülsz, és nem gondolsz semmire. Egyszer az életben a Házigazda is hallgat.',
 {if:'flag:t4_done',t:'A Házigazda ma sem szól. Nem azért, mert nyugodt: azért, mert elégedett.'},
 '>> Egy csend, amiben mindenki önmaga. Ez az egyetlen éjszaka, amikor nem kell megjátszanod semmit.'],
 [{label:'Maradj reggelig',tag:'Álca +4 · Gyanú −1',do:['alca+4','gyanu-1','flag:neil_close=true']},
  {label:'Menj haza, mert holnap dolgod van',do:['alca+1']},
  {label:'Mondd el Neilnek hangosan, mi történt, és mit gondolsz',tag:'Rend +2 · Álca +2',do:['rend+2','alca+2']},{label:'Maradj reggelig, és ne engedj a gondolatoknak',tag:'Hidegvér ≥ 6 · Álca +3 · Rend +2',req:'hid>=6',why:'Hidegvér ≥ 6 kell',do:['alca+3','rend+2','flag:neil_close=true']}]);

p('D29N','Neil halála',[
 'A telefon reggel hatkor cseng. Kim hangja szelíd, de határozott. „{{n}}. Neil elment. Nem sokkal hajnal előtt.”',
 {if:'flag:neil_close',t:'A kezedben tartod az órát, és nem tudod, mikor vetted a kezedbe.'},
 {if:'!flag:neil_close',t:'Nem sírtál. Nem tudtad, hogy kell.'},
 'A világ lecsendesedik, mintha valaki levette volna az utolsó hangot.',
 '>> Egy ember meghalt, aki nem akarta, hogy te légy az, aki vagy. Te mégis az vagy.'],
 [{label:'Hívd fel Kimet, és kérd, hogy maradjon',tag:'Álca +3',do:['alca+3','flag:kim_bond=true']},
  {label:'Menj a laborba, és dolgozz',tag:'Álca +1 · Gyanú −1',do:['alca+1','gyanu-1']},
  {label:'Ülj le a padlóra, és ne csinálj semmit',do:['alca-2','rend-1']},{label:'Állj fel, és menj dolgozni, mintha mi sem történt volna',tag:'Hidegvér ≥ 7 · Álca +3 · Rend +1',req:'hid>=7',why:'Hidegvér ≥ 7 kell',do:['alca+3','rend+1','gyanu-1']}],
 {enter:['flag:neil_dead=true']});

p('D29E','Búcsú',[
 'A temető a város szélén van, a hideg, szürke reggelben. Kevesen jöttek: Kim, Chuck, egy-két régi rendőr, Tobin esernyővel.',
 'A pap rövid szavakat mond, és te nem hallasz belőlük semmit.',
 {if:'flag:tobin_met',t:'Tobin a sírgödör túloldaláról nézi őt, mintha azt kérdezné: és most?'},
 '>> A temetés után mindenki visszatér a hétköznapi életbe. Te is. De már másképp.'],
 [{label:'Maradj Kim mellett',tag:'Álca +3',do:['alca+3','flag:kim_bond=true'],goto:'H4'},
  {label:'Fordulj Tobinhoz, és mondd: „Ennek vége”',tag:'Rend +3 · Gyanú +2',do:['rend+3','gyanu+2','flag:tobin_confronted=true'],goto:'H4'},
  {label:'Hagyd ott a többieket, és sétálj egyet',do:['alca-1'],goto:'H4'}]);

p('D29J','Shane',[
 {if:'flag:shane_watch',t:'Éjjel Shane Crowe a laborban ül egyedül, a monitor fénye az arcán. Belépsz, és Shane nem ijed meg.'},
 {if:'!flag:shane_watch',t:'Shane éjjel a laborban dolgozik. Nem kell, de ott van.'},
 '„Szerintem tudom, mi folyik itt. Nem mindent. De eleget.”',
 'Leülsz mellé. Az órát a zsebedben érzed, a Kódexet a fiókodban, és valamit a mellkasodban, ami nem szokott lenni.',
 {if:'flag:shane_trauma',t:'Eszedbe jut, amit az anyjáról mondott. Ez a fiú nem kíváncsiságból kérdez. Azért kérdez, mert valaki cserben hagyta.'},
 {if:'flag:shane_defended',t:'Eszedbe jut a folyosó is: Shane Ostrander előtt hazudott érted, anélkül, hogy tudta volna, kit véd.'},
 {if:'flag:shane_honest',t:'Shane tudja, hogy nem hiszel a rendszerben. Mégis itt ül melletted.'},
 {if:'flag:shane_lied_to',t:'Shane azt hiszi, hogy hiszel a rendszerben. Ez a hazugság most nehéz.'},
 '>> Itt a döntés: ez a fiú, vagy senki. A lánc ennyire egyszerű.'],
 [{label:'Taníts: mondd el neki, mi a Kódex',tag:'Rend −3 · Álca −3',danger:1,do:['flag:shane_chosen=true','rend-3','alca-3']},
  {label:'Védd meg: küldd el, és mondd, hogy felejtse el',tag:'Rend +3 · Álca +2',do:['flag:shane_protected=true','rend+3','alca+2']},
  {label:'Mondd, hogy fáradt vagy, és holnap beszéltek',do:['alca-1']},{label:'Kérdezd ki Shane-t higgadtan, mielőtt döntesz',tag:'Hidegvér ≥ 6 · Rend +1',req:'hid>=6',why:'Hidegvér ≥ 6 kell',do:['info+:in_shane2','rend+1']}]);

p('D30N','Házkutatás',[
 'Reggel Ostrander a laborban áll, egy bírói engedéllyel a kezében. „Átnézzük a szekrényeket. Nem csak az önét.”',
 {if:'flag:dna_risk',t:'A DNS-egyezés, a kikötői minta, és két nyomozó, akik az imént kapták meg a bírói pecsétet.'},
 {if:'!flag:dna_risk',t:'Egy rutinellenőrzés, mondják. Senki sem hiszi.'},
 {if:'flag:box_taken',t:'A doboz a lakásodban van, a Kódex mellett. Ostrander ma még a szekrényeket vizsgálja. Holnap talán a lakást.'},
 {if:'flag:wayne_body',t:'Ostrander ma délelőtt a zálogház aktáit is magával hozta, és a labor naplójával együtt rakja az asztalra.'},
 {if:'flag:wayne_trace',t:'A banki kivonatokon két készpénzfelvétel szerepel, éppen azokon a napokon, amikor Wayne követelt.'},
 {if:'flag:wayne_talks and !flag:t4_done',t:'A zálogos aláírt nyilatkozata is az asztalon fekszik.'},
 '>> A Kódex nem a szekrényben van. De a szekrény mégis fontos.'],
 [{label:'Nyisd ki, és légy együttműködő',tag:'Gyanú −3 · Álca −1',do:['gyanu-3','alca-1']},
  {label:'Hívd Zellert, és kérj tanút',tag:'Gyanú +1 · Álca +1',do:['gyanu+1','alca+1']},
  {label:'Utasítsd vissza, és követelj ügyvédet',tag:'Gyanú +7',danger:1,do:['gyanu+7','alca-2']},{label:'Mondd el nyugodtan, hogy nincs mit rejtegetned',tag:'Meggyőzés ≥ 7 · Gyanú −4',req:'meg>=7',why:'Meggyőzés ≥ 7 kell',do:['gyanu-4']}],
 {enter:[{if:'flag:box_taken',do:['gyanu+2']},{if:'flag:wayne_body',do:['gyanu+3']},{if:'flag:wayne_trace',do:['gyanu+2']},{if:'flag:wayne_talks and !flag:t4_done',do:['gyanu+2']}]});

p('D30E','Az utolsó műsor',[
 'Keith Yates a mikrofonnál, a hangja fáradt. „Az Éjjeli műszak ma a hét utolsó adása. Kérek mindenkit: aki tud valamit, hívjon. De ne mondjon nevet. Mondjon dátumot, helyet.”',
 'A hívók sora megfogy. Aztán megszólal Marlene Okafor, és a hangja teljesen nyugodt.',
 '„Nem fogok nevet mondani. Csak azt, hogy egy halott férfi sírjánál ma láttam valakit, akit harminc éve is láttam.”',
 '>> Tobin. Ki más.'],
 [{label:'Hallgasd végig, és kapcsold le',do:['alca+0']},
  {label:'Jegyezd fel, mit mondott Marlene',tag:'Megfigyelés ≥ 5',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['info+:ny_marlene2']},
  {label:'Hívd fel Marlene-t, és kérd, hogy hallgasson',tag:'Gyanú +5 · veszélyes',danger:1,do:['gyanu+5','flag:radio_exposed=true']}]);

p('D30J','Az éjszaka előtt',[
 'Halloween előtti éjszaka. A város már lampionokat, műpókhálót, műanyag díszeket pakol ki, mintha a félelmet is meg lehetne vásárolni.',
 {if:'flag:neil_dead',t:'Neil szekrénye üres. A Kódex a te fiókodban. Az óra az asztalon.'},
 'Az ablaknál állsz, és kinézel a kikötői fényekre. Holnap este minden eldől, és nem tudod, hogyan.',
 '>> Egy utolsó éjszaka, hogy eldöntsd, ki akarsz lenni.'],
 [{label:'Pihenj le, és gyűjts erőt',tag:'Álca +4 · Gyanú −1',do:['alca+4','gyanu-1']},
  {label:'Olvasd el a naplót, és gondold végig a hónapot',do:['rend+2','alca+1']},
  {label:'Menj Kimhez, és beszélgess vele',tag:'Álca +3',show:'flag:kim_bond',do:['alca+3','gyanu-1']}]);

p('D31N','Halloween reggel',[
 'Október harmincegyedike. A város hangosabb, mint máskor: gyerekek jelmezben, boltok maszkokkal, a rádióban dobszó.',
 {if:'gyanu>=70',t:'A gyanú ott ül a vállodon, olyan közel, hogy már nem hallod, hol kezdődik a saját légzésed.'},
 {if:'gyanu<70',t:'Egy hétköznapi nap. Egy szokatlanul hétköznapi nap, ami talán az utolsó.'},
 '>> Ma mindenki jelmezben jár. Te is. Csak a tied nem látszik.'],
 [{label:'Menj be a laborba, mintha mi sem történt volna',tag:'Gyanú −2',do:['gyanu-2','alca+1']},
  {label:'Maradj otthon, és készülj',do:['alca+2']},
  {label:'Hívd Kimet, és beszéld meg, mit csináltok este',tag:'Álca +3',show:'flag:kim_bond',do:['alca+3','gyanu-1']}]);

p('D31E','Halloween este',[
 'A Fulton Avenue tele van gyerekekkel, rémes arcokkal és édességgel. A rendőrök mosolyognak, ami szokatlan.',
 {if:'flag:kim_bond',t:'Kim a sarkon vár, egy kabátban, és mosolyog. „Megígérted, hogy eljössz.”'},
 {if:'flag:shane_chosen',t:'Shane a szemközti járdán áll, és integet. A kezében egy kis papírdoboz: az első jegyzetei.'},
 {if:'gyanu>=70',t:'Ostrander járőrautója a Fulton és a Horgony sarkán áll, kikapcsolt fényszóróval.'},
 '>> Az utolsó szakasz. Nem kell megoldanod, csak választanod.'],
 [{label:'Menj Kimhez, és sétáljatok',tag:'Álca +3',show:'flag:kim_bond',do:['alca+3','gyanu-1']},
  {label:'Menj a laborba, és vedd magadhoz, ami kell',tag:'Gyanú +2',do:['gyanu+2']},
  {label:'Várj, és figyeld, mi történik',do:['alca+0']}]);

p('D31J','A végső éjszaka',[
 'Éjfél előtt. A kikötő felett köd, a város zaja elhal. Az asztalnál ülsz, előtted a Kódex, Neil órája, és egy üres papírlap.',
 {if:'flag:neil_truth',t:'Neil szava visszhangzik: „A lánc ott ér véget, ahol te úgy döntesz.”'},
 {if:'flag:shane_chosen',t:'Shane tudja. Ha te elmész, ő viszi tovább.'},
 {if:'flag:shane_protected',t:'Shane biztonságban van. Felejtett. Ha bármi történik, nem tudja.'},
 {if:'gyanu>=70',t:'A telefon cseng. Ostrander. Nem veszed fel.'},
 '>> Az utolsó mondat nem az enyém. Mondd ki te.'],
 [{label:'Add át a Kódexet és az órát Shane-nek',tag:'végleges · a lánc folytatódik',show:'flag:shane_chosen',danger:1,goto:'E_ATADAS'},
  {label:'Égesd el a Kódexet, és add fel magad Ostrandernek',tag:'végleges · a lánc megszakad',show:'flag:neil_truth and flag:shane_protected',danger:1,goto:'E_LANC'},
  {label:'Hagyd az egészet, és menj Kimhez',tag:'végleges · Rend ≥ 50 · Gyanú < 75',show:'flag:kim_bond',req:'rend>=50 and gyanu<75',why:'Rend ≥ 50 és Gyanú < 75 kell',danger:1,goto:'E_ELENGEDES'},
  {label:'Szállj fel az éjféli vonatra, egyedül',tag:'végleges · egyedül · a lánc nyitva marad',danger:1,goto:'E_VONAT'},
  {label:'Várd meg Ostrandert',tag:'végleges · lebukás',danger:1,do:['flag:waited_ost=true'],goto:'E_CAL'}]);

/* ===== Befejezések ===== */
p('E_CAL','Lebukás: Ostrander',[
 'Ostrander nem csenget. Az ajtó nyitva van, mert a kérdezők azt szeretik, ha az ember maga hívja be őket.',
 'Leül a konyhaasztalhoz, és egy mappát tesz le. „Szép, tiszta munka. Épp ez volt a hibája: senki sem ilyen rendezett.”',
 'Mosolyogsz, mert nem tudsz mást csinálni. A Kódex a fiókban, az óra az asztalon, a Házigazda hallgat.',
 {if:'flag:box_taken',t:'A doboz a lakásod egyik szekrényében van. Ostrander tudja, hova nézzen.'},
 {if:'flag:shane_defended',t:'Shane a nyomozók előtt ül, és megismétli a hazugságot. Ostrander egy szót sem hisz belőle.'},
  {if:'flag:t4_done',t:'Ostrander az asztalra teszi Wayne Sullivan aktáját is. „Ez a harmadik, ami nem illik a mintába.”'},
 {if:'flag:waited_ost',t:'*Mi vezetett ide:* az utolsó éjjel te döntöttél: megvártad Ostrandert. Más befejezés is nyitva állt.'},
 {if:'!flag:waited_ost',t:'*Mi vezetett ide:* a Gyanú anélkül ért 100%-ra, hogy a nyomod a rendszerbe vagy a rádióba került volna: a sok kis kockázat és a napi kopás összeadódott. Legközelebb: több visszafogott lépés, kevesebb nyomkeresés.'},
 '>> Nem szólok semmit. De a fegyelmed legalább megérdemelt egy tisztességes befejezést.',
 {if:'flag:waited_ost',t:'**Lebukás.** Megvártad őt. A lánc megszakad, de nem te törted el.'},
 {if:'!flag:waited_ost',t:'**Lebukás.** A lánc ezzel megszakad, de nem a te döntésedből.'}],
 [],{end:'fail',legacy:['leg_dna']});

p('E_DNS','Lebukás: az adatbázis',[
 'Reggel hétkor a labor monitorján zöld betűk jelennek meg. Egy találat, nem részleges, nem bizonytalan. Teljes.',
 'Dr. Zeller a kezét a szájára teszi. Chuck leteszi a kávéját. Shane nem néz a szemedbe, és ez a legrosszabb.',
 'Ostrander a folyosón áll, és nem siet. A rendszer mindent megtett helyette.',
 '*Mi vezetett ide:* a nyomod bekerült a DNS-rendszerbe, vagy a szokott módon beadott kikötői minta, vagy egy rosszul sikerült gélfuttatás miatt. Onnantól minden nappal közelebb hozta a találatot. Legközelebb: ne a szokott módon add be a mintát, és vigyázz a hamisítás gélfuttatásával.',
 '>> Egy adatbázis nem felejt, nem fárad el, nem gyűlöl. Csak megvan. Chuck azt mondta: tíz éven belül minden mintát tesztelnek. Tévedett: tíz hét sem kellett hozzá.',
 '**Lebukás.** A technológia, amelyet közelről láttál, végül utolért.'],
 [],{end:'fail',legacy:['leg_dna']});

p('E_RADIO','Lebukás: a műsor',[
 'Éjszaka a WMHR 101,3-on Keith Yates egy hívót vár. A vonal túlsó végén egy ismerős hang, amit egyszer már hallottál: a saját hangja, torzítva.',
 '„Mondd, kedves hívó, miért telefonáltál nekem?”',
 'Marlene Okafor is a vonalban van, és Keith lejátszik egy régi felvételt: két időpont, két mondat, egyetlen ember. Ostrander a konyhában áll, és hallgatja a rádiót, mint aki végre megkapta, amit várt.',
 '*Mi vezetett ide:* felhívtad a műsort, és túl sokat mondtál a hívónak. Keith Yates hallgatói mindent hallanak. Legközelebb: ne hívd a műsort, hagyd, hogy mások beszéljenek.',
 '>> Az éjszakai műsor mindent hall. Neked ezt nem kellett volna elfelejtened.',
 '**Lebukás.** Az Éjjeli műszak ezúttal rólad szólt.'],
 [],{end:'fail',legacy:['leg_tobin']});

p('E_TEV','Tévedés',[
 'Vernon Prescott a konzervgyárban dolgozott, amikor megérkeztél. Nem védekezett, mert nem értette. Az utolsó mondata egy kérdés volt, amire nem lett válasz.',
 'Két nap múlva Ostrander egy új bizonyítékot kapott: egy hajszálat, amelyet a DNS-pilot Wesley Lindqvisttel párosított. A hírek szerint az igazi tettes elmenekült.',
 'A Házigazda nem szól. Most először nem a nyugalomból hallgat, hanem a gyönyörűségtől.',
 '>> Az ötödik szabály: ha kétséged van, hagyd. Nem hagytad. Szóltam volna, de úgysem hallgattál volna rám.',
 '**Tévedés.** Az igazságot nem lehet visszacsinálni.'],
 [],{end:'fail',legacy:['leg_prescott']});

p('E_HAZ','A Házigazda',[
 'Nem érzed, mikor történik. Egyszer csak a tekinteted a saját kezedre téved, és a kéz nem a tiéd. A mozdulatok ismerősek, a döntések nem.',
 'Egy ablakban látod magad: valakit, aki mosolyog, kezet fog, felszolgálja a kávét. A szemei olyan nyugodtak, mint egy gépé.',
 'A Kódex szabályai nem számítanak. A Házigazda sosem ismerte el őket.',
 '>> Végre. Annyi éven át te hordtad az én mosolyomat. Most én hordom a tiédet.',
 '**A Házigazda.** Tovább dolgozol, de már nem te vagy az.'],
 [],{end:'fail',legacy:['leg_haz']});

p('E_ELENGEDES','Elengedés',[
 'Éjfél előtt kilépsz a lakásból. A Kódex az asztalon marad, az óra mellette. Egyiket sem viszed magaddal.',
 'Kim a sarkon vár, a kabátjában, és nem kérdez semmit. „Menjünk valahova, ahol kávét adnak.”',
 'Az utcán gyerekek jelmezben, a világ hangos és ostoba. Mellette mész, és a mellkasodban valami lassan lazul.',
 {if:'flag:chuck_jail',t:'Valahol egy zárkában Chuck Wexler azt magyarázza az őrnek, hogy ő sosem nyúlt semmihez, ami nem az övé. Igaza van.'},
 {if:'flag:chuck_fired',t:'Chuck Wexler azóta egy autószerelő-műhelyben dolgozik. Néha még a laborra gondol, és arra, hogy a bögréi mindig máshol voltak, mint ahová tette.'},
 {if:'info:in_apa and !flag:box_burned',t:'Henry {{s}} aktáját nem viszed magaddal, és nem is felejted el. A név ott marad az asztalon a Kódex mellett.'},
 {if:'flag:box_burned',t:'A doboz hamu. A tévedés vele együtt tűnt el, és ez az utolsó dolog, amit a Kódexnek köszönhetsz.'},
 {if:'flag:castellano_tip',t:'Két hónappal később Craig Castellanót letartóztatják. Az ügyvédje szerint a tipp túl pontos volt. Senki sem keresi, ki adta.'},
