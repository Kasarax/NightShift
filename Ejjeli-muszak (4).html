body::after{content:'';position:fixed;inset:0;z-index:49;pointer-events:none;box-shadow:inset 0 0 0 rgba(255,40,60,0);transition:box-shadow .6s}
body.warn::after{box-shadow:inset 0 0 110px rgba(255,40,60,.32);animation:wpulse 2.2s ease-in-out infinite}
body.calm.warn::after{animation:none}
@keyframes wpulse{0%,100%{box-shadow:inset 0 0 70px rgba(255,40,60,.2)}50%{box-shadow:inset 0 0 130px rgba(255,40,60,.42)}}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:.07}
#bg pre{margin:0;font-size:12px;line-height:15px;color:var(--acc);white-space:pre;animation:bgs 90s linear infinite}
body.calm #bg pre{animation:none}
@keyframes bgs{from{transform:translateY(0)}to{transform:translateY(-50%)}}
#app{position:relative;z-index:2;max-width:800px;margin:0 auto;padding:0 16px 40px}
#hud{position:sticky;top:0;z-index:5;padding:12px 0 12px;isolation:isolate}
#hud::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:linear-gradient(var(--bg) 78%,transparent);z-index:-1}
.hudrow{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:10px 14px;align-items:center}
.date{font-size:12px;letter-spacing:.08em;color:var(--acc);border:1px solid var(--acc);padding:5px 9px;border-radius:4px;white-space:nowrap;line-height:1.35;text-shadow:0 0 6px rgba(var(--acc-rgb),.45)}
.date small{display:block;color:var(--mute);letter-spacing:.14em;font-size:10.5px}
.bar{min-width:0;position:relative;border-radius:6px}
.bar .t{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;color:var(--mute);margin-bottom:4px}
.bar .t b{color:var(--ink);font-weight:500}
.trk{height:6px;background:#0c1c13;border-radius:99px;overflow:hidden;border:1px solid #12301f}
.fill{height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1),background .5s}
.bar.fp,.bar.fn{animation-duration:.9s;animation-timing-function:ease-out}
.bar.fp{animation-name:flp}.bar.fn{animation-name:fln}
.bar.fp .t b{animation:npop .7s ease-out;color:var(--good)}.bar.fn .t b{animation:npop .7s ease-out;color:var(--bad)}
.bar .dl{position:absolute;right:0;top:-15px;font-size:12px;opacity:0;animation:dlf 1.4s ease-out}
.bar.fp .dl{color:var(--good)}.bar.fn .dl{color:var(--bad)}
@keyframes flp{0%{background:rgba(var(--good-rgb),0)}20%{box-shadow:0 0 14px 2px rgba(var(--good-rgb),.5);background:rgba(var(--good-rgb),.14)}100%{box-shadow:0 0 0 0 rgba(var(--good-rgb),0);background:transparent}}
@keyframes fln{0%{background:rgba(255,59,78,0)}20%{box-shadow:0 0 14px 2px rgba(255,59,78,.6);background:rgba(255,59,78,.2)}100%{box-shadow:0 0 0 0 rgba(255,59,78,0);background:transparent}}
@keyframes npop{0%{transform:scale(1)}30%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes dlf{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.bar.fp,.bar.fn,.bar .dl,.bar.fp .t b,.bar.fn .t b{animation:none}.bar .dl{opacity:1}.fill{transition:none}#bg pre{animation:none}body.warn::after{animation:none}}
.hbtn{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.hbtn button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:12px;letter-spacing:.06em}
.hbtn button:hover{border-color:var(--acc);color:var(--acc)}
.hbtn button.has{border-color:var(--acc)}
.hbtn button.off{opacity:.55;text-decoration:line-through}
.sub{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:11px;letter-spacing:.12em;color:var(--mute)}
.sub b{color:var(--ink);font-weight:500}
@media(max-width:640px){#hud{position:static}#hud::before{display:none}.hudrow{grid-template-columns:1fr 1fr 1fr}.date{grid-column:1/-1}.hbtn button{flex:1 1 30%}}
.stage{background:rgba(var(--panel-rgb),.92);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 18px;margin-top:6px;box-shadow:0 0 24px rgba(var(--acc-rgb),.04)}
.kick{font-size:11.5px;letter-spacing:.18em;color:var(--acc);text-transform:uppercase}
h2{margin:6px 0 14px;font-size:24px;line-height:1.2;font-weight:500;letter-spacing:.02em;text-shadow:0 0 8px rgba(var(--acc-rgb),.25)}
.txt p{font-size:16px;line-height:1.72;margin:0 0 .9em;color:var(--ink)}
.txt i{color:#e9ffe8}
.txt b{color:#fff;font-weight:500}
.txt s{color:var(--bad);text-decoration-thickness:2px;opacity:.85}
.txt p.hz{font-family:'Spectral',Georgia,serif;font-style:italic;font-size:17.5px;color:var(--amber);border-left:2px solid rgba(var(--amber-rgb),.5);padding-left:12px}
.loud .txt p.hz{text-transform:uppercase;letter-spacing:.04em;color:#ff6b3b;border-left-color:#ff6b3b;text-shadow:0 0 8px rgba(255,80,40,.5)}
.gl{color:var(--bad);text-shadow:1.5px 0 rgba(var(--amber-rgb),.6),-1.5px 0 rgba(var(--acc-rgb),.5);letter-spacing:.03em;white-space:pre-wrap}
.chg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{font-size:11.5px;letter-spacing:.06em;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--mute)}
.chip.neg{color:var(--bad);border-color:rgba(255,59,78,.4)}
.chip.pos{color:var(--good);border-color:rgba(var(--good-rgb),.4)}
.chip.inf{color:var(--acc);border-color:var(--acc)}
.chip.note{color:var(--amber);border-color:rgba(var(--amber-rgb),.5)}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.ch{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:11px 14px;transition:border-color .15s,background .15s}
.ch:hover:not(:disabled){border-color:var(--acc);background:rgba(var(--acc-rgb),.1)}
.ch .k{grid-row:1/3;display:flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid var(--line);font-size:12px;color:var(--mute);align-self:center}
.ch .l{font-size:15px;line-height:1.35}
.ch .m{font-size:11.5px;color:var(--mute);letter-spacing:.05em}
.ch.danger .m{color:var(--amber)}
.ch:disabled{opacity:.5;cursor:not-allowed}
.ch:disabled .m{color:var(--amber)}
.ch:focus-visible,.hbtn button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;color:#3d5f4c;font-size:11px;letter-spacing:.12em}
@media(prefers-reduced-motion:no-preference){
 body:not(.calm) .sj .txt p:nth-of-type(3n+1){animation:jit 3.2s infinite}
 @keyframes jit{0%,92%,100%{transform:none}93%{transform:translateX(2px)}95%{transform:translateX(-2px)}97%{transform:translateX(1px)}}
}
#ov{position:fixed;inset:0;background:rgba(2,5,3,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
#ov.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--acc);border-radius:6px;max-width:580px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 0 30px rgba(var(--acc-rgb),.12)}
.modal h3{margin:0 0 6px;font-size:19px;font-weight:500;letter-spacing:.06em;color:var(--acc)}
.modal p{color:var(--mute);margin:.2em 0 1em;font-size:13.5px;line-height:1.55}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:4px;padding:10px 18px;font-weight:500;letter-spacing:.06em;font-size:14px}
#dna{display:none;border:1px solid var(--line);background:#050c08;border-radius:6px;padding:8px 6px 6px;text-align:center;margin:0 0 10px;opacity:0;transition:opacity .9s,border-color .6s}
@keyframes dnf{0%{box-shadow:0 0 0 0 rgba(255,59,78,0);filter:brightness(1)}18%{box-shadow:0 0 28px 6px rgba(255,59,78,.75);filter:brightness(2.2)}45%{filter:brightness(1.4)}100%{box-shadow:0 0 0 0 rgba(255,59,78,0);filter:brightness(1)}}
#dna.flash{animation:dnf 1.3s ease-out 1}body.calm #dna.flash{animation:none}
#dna.vis{display:block}#dna.on{opacity:1}
#dna small{display:block;font-size:10px;letter-spacing:.2em;color:var(--mute);margin-bottom:2px}

#dna canvas{display:block;margin:0 auto;width:100%;height:74px}
@media(min-width:1120px){#dna{position:fixed;top:120px;left:calc(50% + 412px);width:140px;margin:0;z-index:4}#dna canvas{height:400px}}
#stage .mgbox{margin-top:10px}
.mgi{color:var(--mute);font-size:12.5px;margin:0 0 10px}
.mghud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mghud .mgh{border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:var(--panel2);font-size:10.5px;letter-spacing:.1em;color:var(--mute)}
.mghud .mgh b{display:block;font-size:16px;color:var(--ink);letter-spacing:0;font-weight:500}
.mghud .mgh.warn b{color:var(--bad)}
.mgtb{height:4px;background:var(--panel2);border-radius:2px;margin:8px 0 14px;overflow:hidden}.mgtb i{display:block;height:100%;background:var(--acc);transform-origin:left}
.mggw{display:flex;justify-content:center;padding-top:44px}
.mggel{position:relative;width:300px;height:352px;border:1px solid var(--acc);background:linear-gradient(var(--bg),var(--panel));box-shadow:0 0 22px rgba(var(--acc-rgb),.14),inset 0 0 40px rgba(var(--acc-rgb),.05);touch-action:none;max-width:100%}
.mgruler{position:absolute;left:0;top:0;width:40px;height:100%;border-right:1px solid var(--line)}.mgruler span{position:absolute;right:6px;font-size:9.5px;color:var(--mute);transform:translateY(-50%)}
.mggrid{position:absolute;left:40px;right:0;height:1px;background:rgba(var(--acc-rgb),.06)}
.mglane{position:absolute;top:0;height:100%;width:100px}.mglane.ref{left:54px}.mglane.smp{left:172px;cursor:ns-resize;touch-action:none}
.mglab{position:absolute;top:-40px;font-size:10px;letter-spacing:.06em;color:var(--mute);width:120px;left:-10px;text-align:center;line-height:1.25}
.mgband{position:absolute;height:8px;background:var(--acc);box-shadow:0 0 9px rgba(var(--acc-rgb),.75);border-radius:1px}
.mglane.smp .mgband{background:var(--acc)}.mglane.smp .mgband.mod{background:var(--amber);box-shadow:0 0 10px rgba(var(--amber-rgb),.8)}.mglane.smp .mgband.drag{filter:brightness(1.6)}.mglane.smp .mgband.nope{animation:mgn .3s}
@keyframes mgn{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mgprints{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mgpc{text-align:center}.mgpc .mglab{position:static;width:auto;height:28px;left:0}
.mgpc canvas{width:100%;aspect-ratio:170/230;display:block;border:1px solid var(--acc);background:var(--bg);box-shadow:0 0 18px rgba(var(--acc-rgb),.12);touch-action:none;border-radius:3px}.mgpc:last-child canvas{cursor:crosshair}
.mgctl.row{justify-content:center;margin-top:14px}

.mgn{font-family:Georgia,'Spectral',serif;font-size:15.5px;color:#d9e8dc;margin:6px 0 10px}
.mgres{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel2)}.mgres p{margin:0 0 4px;font-size:13.5px}
.hbtn button{position:relative}
.nb{font-style:normal;font-size:9px;letter-spacing:.08em;background:var(--acc);color:var(--accink);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px;font-weight:500}
.jtabs{display:flex;gap:6px;margin:0 0 10px}.jtabs button{background:transparent;color:var(--mute);border:1px solid rgba(var(--acc-rgb),.35);border-radius:4px;padding:5px 12px;font-size:12px;letter-spacing:.08em;cursor:pointer}.jtabs button.on{color:var(--acc);border-color:var(--acc);background:rgba(var(--acc-rgb),.1)}
.jlist{max-height:min(52vh,400px);overflow:auto;padding:0 4px 8px 0;scrollbar-width:thin;scrollbar-color:var(--mute) transparent}

.jc li.nw{color:var(--acc)}
.btn.red{background:#c4122f;color:#fff;border:1px solid #ff3b4e;box-shadow:0 0 14px rgba(255,59,78,.35)}
.btn.red:hover{background:#d8183a}
.lang{display:flex;gap:6px;justify-content:center;margin:0 0 14px}

/* Kódex: sárga dosszié */
html{color-scheme:dark}
.paper,.paper *{forced-color-adjust:none}
.paper p,.paper p b{-webkit-text-fill-color:#3a2a0a}.paper h4{-webkit-text-fill-color:#6b1a10}.paper.add p{-webkit-text-fill-color:#1c2a5a}
.paper{background:#d9c680;background-image:repeating-linear-gradient(0deg,rgba(90,60,10,.06) 0 1px,transparent 1px 26px),radial-gradient(circle at 20% 10%,rgba(255,255,255,.25),transparent 55%);color:#3a2a0a;border:1px solid #8a7430;box-shadow:0 4px 18px rgba(0,0,0,.6),inset 0 0 40px rgba(110,80,10,.25);padding:20px 22px;margin:12px 0;transform:rotate(-.4deg);position:relative}
.paper:nth-of-type(even){transform:rotate(.5deg);background-color:#cfb96f}
.paper h4{margin:0 0 8px;font-size:13px;letter-spacing:.2em;color:#6b1a10;font-weight:500;border-bottom:1px solid rgba(90,40,10,.4);padding-bottom:4px}
.paper p{margin:.4em 0;font-size:14.5px;line-height:1.55;color:#3a2a0a}
.paper .stamp{position:absolute;right:14px;top:10px;border:2px solid #8b1a10;color:#8b1a10;padding:1px 8px;font-size:11px;letter-spacing:.16em;transform:rotate(7deg);opacity:.75}
.paper.add{font-family:'Spectral',Georgia,serif;font-style:italic;color:#1c2a5a}
.paper.add p{font-family:'Spectral',Georgia,serif;color:#1c2a5a;font-size:16px}
.paper.add h4{font-family:'IBM Plex Mono',monospace;font-style:normal}
/* napló */
.term{width:100%;max-width:620px;border:1px solid var(--acc);background:var(--bg);padding:16px 18px 14px;box-shadow:0 0 28px rgba(var(--acc-rgb),.2),inset 0 0 40px rgba(var(--acc-rgb),.06)}
.term h3{margin:0 0 2px;font-size:14px;letter-spacing:.2em;color:var(--acc);font-weight:500}
.term .st{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;color:var(--mute);margin-bottom:8px}
.term .st b{color:var(--acc);font-weight:400}
.term textarea{display:block;width:100%;height:min(46vh,340px);resize:none;border:0;outline:0;background:transparent;color:var(--ink);caret-color:var(--acc);font:400 15px/26px 'IBM Plex Mono',monospace;padding:0 2px;background-image:repeating-linear-gradient(transparent 0 25px,rgba(var(--acc-rgb),.14) 25px 26px);background-attachment:local}

.term .hrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.term .hb:hover{background:rgba(var(--acc-rgb),.12)}
.term .hb.dng{margin-left:auto}
/* kezdő és kapu */

.recap{margin:22px 0 4px;padding-top:12px;border-top:1px dashed var(--mute);font-size:13px;color:var(--mute)}.recap b{color:var(--ink);letter-spacing:.14em;text-transform:uppercase;font-size:12px}.recap ul{margin:6px 0 0;padding-left:18px}.recap li{margin:3px 0}.cardbtn{margin-top:12px;background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:4px;padding:8px 12px;font:inherit;font-size:13px;letter-spacing:.06em;cursor:pointer}.cardbtn.alt{color:var(--mute);border-color:var(--mute)}.cardbtn:hover,.cardbtn:focus-visible{background:var(--acc);color:var(--accink)}

.pf{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:11px 13px}

.cc{max-width:640px;margin:18px auto 0;text-align:left}

.seg{display:flex;gap:8px}

function L(h,e){return LANG==='en'?e:h}
var THEMES=['green','amber','cyan','white'],THN={green:['ZÖLD','GREEN'],amber:['BOROSTYÁN','AMBER'],cyan:['CIÁN','CYAN'],white:['FEHÉR','WHITE']},THEME=lsGet(LS_THEME);

/* ====== adatok ====== */
var P={},INFO={},TARGETS=[],CHARS=[],DATA={},jtab='note';

var WDS={hu:['Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat','Vasárnap'],en:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']},SLS={hu:{N:'Nappal',E:'Este',J:'Éjjel'},en:{N:'Day',E:'Evening',J:'Night'}};

DATA.hu=function(){
/* ===== 1. ív: Hétköznapok (okt. 1–7) ===== */
p('D01N','Reggeli műszak',[
 'A Morgan Hills-i Kriminalisztikai Labor a Fulton Avenue sarkán áll, és úgy néz ki, mint amit valaki megtervezett, aztán megbánt. Hét negyvenöt van, a kávé kihűlt, te pedig a bizonyítéktár ajtajában lélegzel egyet, mielőtt belépsz.',
 'A fal mellett Chuck Wexler a faxot szidja. Dr. Lynn Zeller, a laborvezető, egy mappával a hóna alatt lép be, és elcsendesedik a terem.',
 '„Október tizenötödikétől élesben megy a DNS-feldolgozás. Országos adatbázis. Mindenki kap egy tanfolyamot, és senki nem fog panaszkodni.”',
 '>> Egy adatbázis. Tíz év múlva ez lesz a hétköznapi világ. Most még csak egy dátum a naptárban, amelyet magadban pirossal karikáztál be.'],
 [{label:'Jegyzeteld le a dátumot, és kérdezz a rendszer részleteiről',tag:'Szakértelem ≥ 6',req:'szak>=6',why:'Szakértelem ≥ 6 kell',do:['gyanu-2','info+:in_dna']},
  {label:'Viccelődj Chuckkal a faxról',do:['alca+3']},
  {label:'Hallgass, és figyeld a többiek arcát',do:['flag:read_room=true']}]);

p('D01E','Négyes C',[
 'A lakás az Ashgrove negyedben van, egy olyan házban, ahol a lift mindig a harmadikon áll, és mindenki úgy tesz, mintha ez természetes lenne. A folyosón Kim Ingram, a 4D-s szomszéd áll egy zacskó paradicsommal. Éjszakai ápolónő a St. Brennan kórházban.',
 '„Az anyámtól. Kerti. Mondtam, hogy beviszem a kórházba, aztán hazahoztam. Te sosem alszol, igaz?”',
 '>> Vigyázz vele: ő az a szomszéd, aki észreveszi, mikor érsz haza. Kellemes, de kockázatos is: a Kódex második szabálya szerint a szeretteid körében soha.'],
 [{label:'Fogadd el a paradicsomot, és beszélgess vele pár percet',do:['alca+4','gyanu-1','flag:kim_talk=true']},
  {label:'Köszönj, és menj be',do:['alca-1']},
  {label:'Kérdezz rá a műszakjára, és figyeld a válaszait',tag:'Megfigyelés ≥ 5',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['alca+2','info+:in_kim']},{label:'Beszélgess úgy Kimmel, hogy megnyerd a bizalmát',tag:'Meggyőzés ≥ 5 · Álca +4',req:'meg>=5',why:'Meggyőzés ≥ 5 kell',do:['alca+4','gyanu-2','flag:kim_talk=true']}]);

p('D01J','Az első akta',[
 'Éjfél után van, a lakásban csend honol. A konyhaasztalon egy barna boríték fekszik, amelyet valaki reggel a küszöb alá csúsztatott. Nem kell kinyitnod, hogy tudd, kitől jön: Neiltől, aki évekkel ezelőtt a Kódexet is adta neked. Ő nem kér, és nem parancsol. Csak megnevezi, ki az, akit a rendszer elengedett, és vár.',
 'A fiókban a sárga dossziélap, a Kódex, gépelve, aláhúzva. Öt szabály, és egy nyugodt hang a fejedben: **Olvasd el!**',
 'I. Csak bizonyított bűnös, akit a hatóságok elengedtek. II. Soha a szeretteid körében. III. Soha ugyanaz a módszer kétszer. IV. A hétköznapi élet előbbre való. V. Ha kétséged van, hagyd.',
 {if:'megf>=5',t:'A lap alján apró, alig látható évszám áll: *1961.* Neil ekkor még nem volt rendőr.'},
 'Az akta első oldalán Eugene Novak neve áll. Két éve felmentették Louise Hartman megölése miatt, mert a labor elrontotta a mintát. A te laborod.',
 '>> Szóval a labor hibája a te hibád is. Nem könnyű ügy, de legalább ismerős.'],
 [{label:'Olvasd át az aktát alaposan',tag:'Bizonyíték +1',do:['flag:t1_known=true','ev1+1','rend+2','info+:in_novak']},
  {label:'Csak lapozd végig, a többit holnapra hagyd',do:['flag:t1_known=true','alca+2']}],
 {enter:[{if:'megf>=5',do:['info+:ny_evszam']},{if:'info:leg_neil',do:['info+:ny_evszam']}]});

p('D02N','A gyakornok',[
 'Dr. Zeller egy vékony, szemüveges fiút vezet be a bizonyítéktárba. Shane Crowe tizenkilenc éves, a gimnázium után egy félévet főiskolára járt, és úgy néz körül, mint aki mindent látni akar, csak azt nem akarja, hogy észrevegyék.',
 '„{{n}}, ő a tiéd. Egy hónapig mutasd meg neki, mi hol van.”',
 'Shane az első öt percben megkérdezi, miért írsz mindent kétszer, és miért zárod a dobozokat balról jobbra.',
 '>> Okos. Ezért veszélyes. A fiatalokat nem lehet becsapni a rutinnal.'],
 [{label:'Magyarázd el türelmesen, miért van így',do:['alca+2','rend+1','flag:shane_taught=true']},
  {label:'Mondd neki, hogy ne kérdezzen annyit',do:['alca-2','gyanu+1']},
  {label:'Add át Chucknak, és menj a dolgodra',do:['alca+1']}]);

p('D02E','Éjjeli műszak',[
 'A WMHR 101,3-on éjfélkor kezdődik a város leghangosabb magánya. Keith Yates a mikrofonnál, a hangja olyan, mint egy kopott bőrkabát. A műsor neve: **Éjjeli műszak**.',
 '„Mielőtt belecsapunk: Louise Hartman. Pontosan két éve, és Eugene Novak még mindig szabadlábon van. Mondjatok valamit, Morgan Hills, mondjátok, hogy emlékeztek.”',
 'A telefonok felvillannak. Egy asszony sírva szól bele, egy férfi káromkodik. Te a konyhában ülsz, és egy pohár vizet tartasz a kezedben.',
 '>> A város haragszik. Ez jó: legalább nem vagy egyedül ezzel a hanggal.'],
 [{label:'Hallgasd végig a műsort',do:['alca+0','info+:in_keith']},
  {label:'Kapcsold le, és menj aludni',do:['alca+3']},
  {label:'Írd fel, mit mondanak a hívók Novakról',tag:'Bizonyíték +1',do:['ev1+1','gyanu+1']}]);

p('D02J','Kikötő',[
 'A rádió után nem tudsz aludni. A Kódex szerint a tényekkel kell dolgozni, nem a haraggal. Ezért lemész a kikötőbe, hogy kiderítsd, ki is valójában Eugene Novak.',
 'Novak a Dockside negyedben él, egy háromszintes bérház második emeletén. Esténként a Horgony nevű italmérésbe jár, ahol háttal ül az ajtónak. Ez vagy hiba, vagy hanyagság.',
 'A kikötőnek nedves kötél és olaj szaga van. Egy ködlámpa pislog a sarkon.',
 '>> Nem kell sietni. A türelem nincs rajta a Kódexen, mégis az a legfontosabb szabály.'],
 [{label:'Menj be a Horgonyba, és ülj a pult sarkába',tag:'Bizonyíték +1 · Gyanú +2',do:['ev1+1','gyanu+2']},
  {label:'Figyeld a lakását az utca túloldaláról',tag:'Megfigyelés ≥ 5',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['ev1+1']},
  {label:'Menj haza, és aludj',do:['alca+3'],goto:'R1'}]);

p('D03N','Szombati ügyelet',[
 'A labor szombaton üres és hangosabb: a klíma zúg, a hűtők kattognak. Egyedül vagy, Chuckot leszámítva, aki a sarokban alszik.',
 'Az irattár ajtaja nincs bezárva. A hátsó polcon, a leselejtezett ügyek között ott áll a Hartman-ügy doboza. A kulcs a kezedben van.',
 '>> Ha nem nyitod ki, nincs bizonyíték. Ha kinyitod, a te neved is ott lesz benne.'],
 [{label:'Húzd ki a dobozt, és nézd át a minta jegyzőkönyvét',tag:'Bizonyíték +1 · Gyanú +3',do:['ev1+1','gyanu+3','flag:box_opened=true']},
  {label:'Hagyd, és csinálj valami hétköznapit a laborban',do:['alca+2','rend+1']}]);

p('D03E','A tetőn',[
 'Kim cetlit tűz a kilincsre: **Tető, hét óra, hozz bármit.** Fent nyolc-tíz ember áll egy műanyag grill körül, és mindenki kicsit szomorú, mint akik tudják, hogy a jó idő már nem tart sokáig.',
 'Kim megfogja a karod. „Mondtam, hogy gyere.” A mosolya ismerős, és ebből még baj lehet.',
 '>> A szeretteid köre. Ezt a kört nem szabad megérinteni. A Kódex a szeretetet nem tiltja, de kényelmetlenné teszi.'],
 [{label:'Maradj egy órát, és légy kedves',tag:'Álca +5',do:['alca+5','gyanu-2','flag:kim_bond=true']},
  {label:'Köszönj, és menj le korán',do:['alca+1']},
  {label:'Mondd, hogy dolgozol, és nem tudsz menni',do:['alca-3']}]);

p('D03J','Novak szokásai',[
 'Szombat éjjel Novak a Horgonyban ül tizenegyig, aztán gyalog megy haza. Három sarok után elfogynak a lámpák, és mindig ugyanazon a mellékutcán vág át.',
 'Nem egyedül ül, de a társaságából senki nem kérdezi, ki ő.',
 '>> Szokás. A szokás a nyomozó barátja. És a tiéd.'],
 [{label:'Kövesd haza, és jegyezd fel az útvonalat',tag:'Bizonyíték +1 · Gyanú +2',do:['ev1+1','gyanu+2']},
  {label:'Figyeld csak a mellékutcát, a távolból',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['ev1+1']},
  {label:'Hagyd, nem érdemes ma',do:['alca+2']}]);

p('D04N','Vasárnapi ebéd',[
 'Neil Jessup háza az Eastgate negyed végén áll, egy kis téglaépület, amelynek lépcsőjét mindig frissen felsöprik. Neil hatvannyolc éves, nyugdíjas rendőr, és a pecsenyét úgy tálalja, mintha jegyzőkönyvet vezetne.',
 'A nappaliban egy zárt ajtajú szekrény áll, amelyet gyerekkorod óta senki sem látott nyitva.',
 {if:'megf>=6 or info:leg_neil',t:'A zár új, de körülötte a fa régi és kopott: évtizedek óta ugyanaz a kéz nyitja.'},
 '„Egyél, gyerekem. Úgy nézel ki, mint aki nem alszik.”',
 'Sosem szólítottad Neilt másképp, mint Neilnek.'],
 [{label:'Segíts a konyhában, és beszélgess vele',do:['alca+3','rend+1']},
  {label:'Nézd meg közelebbről a szekrényt',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['info+:ny_szekreny']},
  {label:'Ülj le, és egyél csendben',do:['alca+1']}]);

p('D04E','A Kódex',[
 'Vacsora után Neil leteszi a kávét, és ugyanolyan hangon szólal meg, mint amikor jegyzőkönyvet diktál.',
 '„Mi van az aktával?”',
 'A kérdésben nincs név, de tudod, hogy az akta Novakról szól, és Neil is tudja, hogy tudod. A Kódex csendben ott fekszik köztük, mint a só a tálban.',
 '>> Nem mond ki semmit, mégis mindent tud. Ebben a házban ez az egyetlen közös nyelv.'],
 [{label:'Mondd el, hol tartasz',tag:'Rend +3',do:['rend+3']},
  {label:'Kérdezd meg, honnan kapta a szabályokat',tag:'Megfigyelés ≥ 5',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['info+:ny_valasz','alca-1']},
  {label:'Hallgass, és nézz el',do:[]}]);

p('D04J','Döntés',[
 'Éjjel egy óra. Az akta a konyhaasztalon, a Kódex mellette, a falióra ketyegése hangosabb, mint kellene.',
 {if:'ev1>=3',t:'Mindent tudsz, amit tudni kell. Három független nyom, ugyanaz a név. Nem maradt kétség.'},
 {if:'ev1<3',t:'Nincs minden meg. Két nyom van, a harmadik hiányzik. A Kódex ötödik szabálya világos: ha kétséged van, hagyd.'},
 '>> Ma éjjel még nem kötelező. Van még holnap és holnapután is. A feltűnésmentes munkához idő kell.'],
 [{label:'Hajtsd végre a Kódex szerinti munkát: Novak',tag:'Bizonyíték ≥ 3',show:'flag:t1_known and !flag:t1_done',req:'ev1>=3',why:'Nincs elég bizonyíték (3 kell)',danger:1,do:['flag:t1_done=true','rend+4','gyanu+4','alca-3'],goto:'>'},
  {label:'Siess: nincs minden bizonyíték, de most kell',tag:'Rend −10 · Gyanú +5',show:'flag:t1_known and !flag:t1_done and ev1<3',danger:1,do:['flag:t1_done=true','rend-10','gyanu+5','alca-3'],goto:'>'},
  {label:'Várj, még nem most',do:['alca+1']}]);

p('D05N','Az új nyomozó',[
 'Hétfő reggel Bonnie Ostrander a labor ajtajában áll, és úgy néz végig a termen, mintha mindenkit külön kellene kikérdezni. Negyvenöt év körüli, rövid hajú nő szürke blézerben, egy jegyzettömbbel, amelyet sosem tesz le.',
 'Dr. Zeller bemutatja őt a kollégáknak. „Ostrander főnyomozó, az új gyilkossági osztály vezetője. Neki dolgozunk, ha kell.”',
 {if:'flag:t1_done',t:'Ostrander ránéz, aztán a polcra, aztán megint rá. Egy mosoly nélküli pillanat.'},
 '>> Olyan, aki kérdezés előtt hallgat. Hallgass te is.'],
 [{label:'Segíts készségesen, ha a minták miatt jött',tag:'Gyanú −3',do:['gyanu-3','alca+2']},
  {label:'Maradj távol, és csináld a dolgod',do:['alca-1']},
  {label:'Próbáld kitapogatni, mit akar',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['info+:in_ostrander']},{label:'Beszélj magabiztosan, és vond el a figyelmét a mintákról',tag:'Meggyőzés ≥ 6 · Gyanú −4',req:'meg>=6',why:'Meggyőzés ≥ 6 kell',do:['gyanu-4','alca+1']}]);

p('D05E','Telefon',[
 'Este nyolckor cseng a telefon. A vonal túlsó végén egy ismerős, száraz hang. Neil, akinél vasárnap ebédeltél, és aki a Kódexet adta.',
 '„Csak ellenőrzöm, hogy beszéltél-e valakivel.”',
 'Nem akar semmit, és ez a legrosszabb: mindig így kezdődik.',
 '>> Nem a szavai számítanak, hanem a hallgatás közöttük.'],
 [{label:'Beszélj nyíltan: mondd el, hogy új nyomozó érkezett a rendőrségre',do:['rend+2','alca+0']},
  {label:'Rövidre zárd: „minden rendben”',do:['alca-1']},
  {label:'Kérdezz vissza: miért érdekli ez',do:['alca-1','rend-1']}]);

p('D05J','Második lehetőség',[
 'A város nedves, a járdák csillognak. A Horgony előtt egy autó áll, amelynek az ablakai bepárásodtak.',
 {if:'flag:t1_done',t:'Ennek vége. Senki nem látott semmit, te pedig hazamentél. Ez a döntés nem a tiéd volt, hanem a Kódexé.'},
 {if:'!flag:t1_done',t:'Novak ma is ugyanott ül, ugyanúgy háttal az ajtónak.'}],
 [{label:'Hajtsd végre a Kódex szerinti munkát: Novak',tag:'Bizonyíték ≥ 3',show:'flag:t1_known and !flag:t1_done',req:'ev1>=3',why:'Nincs elég bizonyíték (3 kell)',danger:1,do:['flag:t1_done=true','rend+4','gyanu+4','alca-3']},
  {label:'Siess: nincs minden bizonyíték, de most kell',tag:'Rend −10 · Gyanú +5',show:'flag:t1_known and !flag:t1_done and ev1<3',danger:1,do:['flag:t1_done=true','rend-10','gyanu+5','alca-3']},
  {label:'Menj haza, és tedd el az aktát',show:'flag:t1_known and !flag:t1_done',do:['alca+2']},
  {label:'Maradj még egy órát a sarkon, és figyeld, ki néz vissza a Horgonyból',tag:'Gyanú +2 · új információ',show:'!flag:t1_known or flag:t1_done',do:['gyanu+2','info+:in_horgony'],goto:'R2'},
  {label:'Menj haza, és aludj',show:'!flag:t1_known or flag:t1_done',do:['alca+3'],goto:'R2'}]);

p('D06N','Hírek',[
 {if:'flag:t1_done',t:'A reggeli rádió szinte csak erről szól: Eugene Novak holttestét egy kikötői raktárban találták meg. Ostrander a laborban áll, és Kessler őrmesterrel nézi a minták listáját. Chuck mosolyog: „Hát, valaki tett valamit.”'},
 {if:'!flag:t1_done',t:'Nyugodt nap. Ostrander a harmadik emeleten fogadja a bejelentéseket, Kessler őrmester kávét hoz, Chuck pedig vicceket mesél a DNS-rendszerről.'},
 'Letörlöd a pultot, érzed az ujjlenyomat-por szagát, és felveszed a szokásos mosolyodat.',
 '>> A mosoly nem hazugság. Az álca.'],
 [{label:'Mosolyogj, és viccelődj Chuckkal',do:['alca+3','gyanu-1']},
  {label:'Dolgozz csendben, és kerüld a nyomozót',do:['alca-1','gyanu-1']},
  {label:'Puhatolózz Kessler őrmesternél, mit tudnak',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['info+:in_kessler']}]);

p('D06E','Késői műszak',[
 'Hat óra, a labor kiürül. Shane még mindig a pultnál áll, és fejben lefényképez egy mintatartót.',
 '„Miért maradsz mindig tovább?”',
 {if:'flag:shane_taught',t:'Ez nem vád, hanem tisztelet. Vagy az is lehet, hogy figyel.'},
 '>> A kíváncsiság veszélyes. De a kíváncsiságból tanítvány is lehet.'],
 [{label:'Mondd, hogy a papírmunka sosem fogy el',do:['alca+2']},
  {label:'Hívd meg, hogy maradjon, és mutass neki valamit',tag:'Álca +2 · Gyanú +1',do:['alca+2','gyanu+1','flag:shane_close=true']},
  {label:'Küldd haza, és mondd, hogy pihenjen',do:['alca+0']}]);

p('D06J','Harmadik lehetőség',[
 {if:'flag:t1_done',t:'Hazaérsz, és a lakás csendjében hirtelen fáradtnak érzed magad. A Házigazda szokatlanul csendes, mintha pihenne.'},
 {if:'!flag:t1_done',t:'Éjjel tizenegy, és a döntés még mindig ott fekszik az asztalon. A Kódex szabályai nem ismernek határidőt, de a gyanú igen.'}],
 [{label:'Hajtsd végre a Kódex szerinti munkát: Novak',tag:'Bizonyíték ≥ 3',show:'flag:t1_known and !flag:t1_done',req:'ev1>=3',why:'Nincs elég bizonyíték (3 kell)',danger:1,do:['flag:t1_done=true','rend+4','gyanu+4','alca-3']},
  {label:'Siess: nincs minden bizonyíték, de most kell',tag:'Rend −10 · Gyanú +5',show:'flag:t1_known and !flag:t1_done and ev1<3',danger:1,do:['flag:t1_done=true','rend-10','gyanu+5','alca-3']},
  {label:'Hagyd, az ajánlat lejárt',show:'flag:t1_known and !flag:t1_done',do:['flag:t1_skip=true','alca+2']},
  {label:'Sétálj egyet a háztömb körül, mielőtt lefekszel',tag:'Álca +2 · Gyanú +1',show:'!flag:t1_known or flag:t1_done',do:['alca+2','gyanu+1'],goto:'R3'},
  {label:'Pihenj le',show:'!flag:t1_known or flag:t1_done',do:['alca+3'],goto:'R3'}]);

p('D07N','Szerda reggel',[
 {if:'flag:t1_skip',t:'A reggeli kávé ízetlen. A Kódex még a fiókban van, Novak pedig él, és valahol egy bárban iszik.'},
 {if:'flag:t1_done',t:'A labor ugyanúgy zúg, de Ostrander jegyzettömbjében már van egy új oldal. Ezt megérzed.'},
 'Dr. Zeller összehív mindenkit. „Jövő szerdán tanfolyam lesz a DNS-protokollról. Három kollégám már felmentést kért. Ti ne tegyétek.”',
 'Chuck visszasúgja: „Ha jól számolom, tíz éven belül minden mintát tesztelnek.”',
 '>> Tíz év. A Kódex régebbi, de az adatbázis türelmesebb.'],
 [{label:'Vállald, hogy részt veszel, és tanulj',tag:'Szakértelem ≥ 6 · Gyanú −2',req:'szak>=6',why:'Szakértelem ≥ 6 kell',do:['gyanu-2','alca+2']},
  {label:'Vállald, de ne mutass túl sok érdeklődést',do:['alca+1']},
  {label:'Hagyd, hogy Chuck beszéljen helyetted',do:['alca-1']}]);

p('D07E','A rádió',[
 'A rádióban Keith Yates tovább feszegeti a témát.',
 {if:'flag:t1_done',t:'„A város hangosan sóhajt, hallgatók. Eugene Novak nincs többé. Nem tudjuk, ki tette, de valaki igazságot szolgáltatott. Kérdezem: köszönettel tartozunk-e neki?”'},
 {if:'!flag:t1_done',t:'„Louise Hartman ügye továbbra is nyitott seb. Vajon mit nem tud a rendőrség, hogy Novak még mindig szabadlábon van?”'},
 'A hívók sorban érkeznek. Egy férfi azt mondja: „Valaki végre kitakarította a várost.”',
 '>> Az igazság kedves a rádióban. A laborban a bizonyíték számít.'],
 [{label:'Hallgasd végig, és figyeld a szavait',do:['info+:in_keith2']},
  {label:'Kapcsold le',do:['alca+2']},
  {label:'Jegyezd fel Yates műsorának idejét, hátha később kell',do:['flag:keith_noted=true']}]);

p('D07J','A második boríték',[
 'Éjszaka hallod a lépéseket a lépcsőházban, aztán a boríték lecsúszik a küszöb alatt. Ugyanaz a kéz, ugyanaz a papír.',
 {if:'flag:t1_done',t:'A Kódex szerint, ha elvégezted a feladatot, jön a következő. Nem gratulál, nem kérdez: csak ad.'},
 {if:'!flag:t1_done',t:'Az első akta még nyitva, de a következő már itt van. Nem vár.'},
 'A második akta Vernon Prescotté. Két éve felmentették egy tizenhét éves lány halála miatt. A bíróság nem talált elég bizonyítékot, a közvélemény viszont talált.',
 '>> A lista a Kódex lelke. Neil adja a nevet, te végrehajtod. Ez a kapcsolat egyszerű, és épp ezért nem szabad belegondolni.'],
 [{label:'Olvasd át az aktát alaposan',tag:'Rend +2',do:['flag:t2_known=true','rend+2','info+:in_prescott']},
  {label:'Csak nézd át, a többit holnapra hagyd',do:['flag:t2_known=true','alca+1']}],
 {enter:[{if:'flag:t1_known and !flag:t1_done',do:['flag:t1_skip=true']}]});

/* ===== 2. ív: Repedések (okt. 8–14) ===== */
p('D08N','Kérdések',[
 'Ostrander a harmadik emeleti tárgyalóban rendezte be a főhadiszállását: térkép, kávé, három telefon. A délelőtt folyamán minden laboros bemegy hozzá, és tíz percig mesél arról, mit csinált a hétvégén.',
 {if:'flag:t1_done',t:'Te következel. Ostrander nem Novakról kérdez, hanem arról, mit csinált szombat este. Hétköznapi hang, hétköznapi kérdés.'},
 {if:'!flag:t1_done',t:'Te következel. Ostrander a kikötői tűzről kérdez, ahol egy raktár leégett, és két munkás eltűnt.'},
 '>> Kérdéseket kaptál, nem vádat. A különbség vékony, mint az alibi.'],
 [{label:'Válaszolj röviden és nyugodtan',tag:'Gyanú −2',do:['gyanu-2','alca+1']},
  {label:'Légy közlékeny, és mesélj a hétköznapjaidról',tag:'Álca +3 · Gyanú +1',do:['alca+3','gyanu+1']},
  {label:'Kérdezz vissza: miben segíthetsz?',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['gyanu-3','info+:in_ostrander2']},{label:'Győzd meg, hogy hasznos tanú vagy',tag:'Meggyőzés ≥ 7 · Gyanú −4',req:'meg>=7',why:'Meggyőzés ≥ 7 kell',do:['gyanu-4','alca+1']}]);

p('D08E','Egy sör Chuckkal',[
 'Chuck Wexler péntek óta mondogatja, hogy mindenkinek kell egy törzshely. A Sarkantyú a labor mögötti sarkon áll, tele öreg rendőrökkel és fiatal nyomozókkal, akik szeretnének öregebbnek látszani.',
 'Chuck két korsót rendel, és úgy néz rá, mintha a meghívás nem is kérdés lenne.',
 '„Egy tanács: ne dolgozz túl sokat. A kihagyott alvás egyszer visszajön.”',
 '>> A legjobb álca az, ha igazat mondasz valamiről, ami nem fontos.'],
 [{label:'Maradj, és igyál egyet',tag:'Álca +4 · Gyanú −1',do:['alca+4','gyanu-1','flag:chuck_friend=true']},
  {label:'Köszönd meg, és menj haza',do:['alca-1']},
  {label:'Kérdezgesd Chuckot az öreg esetekről',tag:'Megfigyelés ≥ 5',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['info+:in_chuck','alca+1']}]);

p('D08J','Prescott',[
 'Vernon Prescott a Dockside konzervgyárban dolgozik, éjszakás darukezelőként. A gyár fénye narancssárga, a gép zúgása pedig olyan, mint egy hosszú, egyhangú sóhaj.',
 'A kerítés mellett állsz, és kétszer is ellenőrzöd az órát, mert amit lát, nem egyezik azzal, amit az akta mond.',
 'Az aktában az áll, hogy Prescott a gyilkosság éjszakáján magányosan otthon volt. A műszaklap szerint viszont aznap éjjel dolgozott.',
 '>> Egy apró eltérés. Az ötödik szabály ilyenkor szólal meg: ha kétséged van.'],
 [{label:'Jegyezd fel az időpontokat, és próbáld ellenőrizni',tag:'Bizonyíték +1',do:['ev2+1','flag:prescott_doubt=true','info+:in_alibi','gyanu+2']},
  {label:'Hagyd, az aktában szereplő adat a döntő',do:['rend-2']},
  {label:'Menj haza, és gondold át',do:['alca+2']}]);

p('D09N','Régi minták',[
 'A bizonyítéktár hátsó polcsorán a Hollis-ügy doboza áll, amelyről két éve mindenki elfeledkezett. Tammy Hollis tizenhét éves volt.',
 'A tárgylapon egy hajszál szerepel, amelyet Prescott házában találtak. A jegyzőkönyv szerint egyezik.',
 {if:'szak>=6',t:'A mikroszkóp alatt a hajszál színe és keresztmetszete nem egyezik Prescottéval. Egy hibás összehasonlítás, két éve.'},
 {if:'szak<6',t:'Nem vagy biztos benne, hogy jól látsz. A hajszál színe kicsit eltér, de lehet, hogy csak a fény.'},
 '>> A labor két éve is hibázott. Neked ez ismerős.'],
 [{label:'Vizsgáld meg a hajszálat mikroszkóp alatt',tag:'Szakértelem ≥ 6 · Bizonyíték +1 · Gyanú +2',show:'szak>=6',do:['ev2+1','gyanu+2','info+:in_haj']},
  {label:'Fotózd le, és hasonlítsd össze otthon',tag:'Gyanú +1',show:'szak<6',do:['gyanu+1','info+:in_haj_foto']},
  {label:'Tedd vissza a dobozt, és hagyd',do:['alca+1']}]);

p('D09E','Gyakorló',[
 'Dr. Zeller négy órakor gyakorlatot tart a DNS-protokollról. Egy hosszú asztal, műanyag tálcák, üres mintatartók. Chuck horkol, Shane jegyzetel, és Zeller azt mondja: „Aki nem érti, kérdezzen.”',
 'Érted. Annyira, hogy az már zavaró.',
 '>> Ne légy túl jó. De ne is legyél gyanúsan rossz.'],
 [{label:'Mutasd meg, hogy jól értesz a rendszerhez',tag:'Szakértelem ≥ 6 · Gyanú −3',req:'szak>=6',why:'Szakértelem ≥ 6 kell',do:['gyanu-3','alca+2','flag:zeller_trust=true']},
  {label:'Maradj a háttérben, jegyzetelj',do:['alca+1']},
  {label:'Kérdezz egy okos kérdést a bizonyítékláncról',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['gyanu-2','flag:zeller_trust=true']}]);

p('D09J','A kézírás',[
 'Kiteríted az asztalon az akta lapjait, és hosszú ideig nézed őket. Valami nem stimmel a betűkkel: Neil kézírása szögletes, hegyes. Az aktában a g betűk hurkosak, a t-k vonása lassú és tétova.',
 {if:'megf>=6 or info:leg_tobin',t:'A Kódex lapján is ott a második kézírás. Ugyanaz, mint az aktában, és nem Neilé.'},
 {if:'megf<6 and !info:leg_tobin',t:'A hurkos g-k és a lassú, tétova t-k nem Neil keze. Hogy kié, azt még nem tudod.'}],
 [{label:'Rögzítsd a különbséget, és tedd el a lapokat',tag:'Megfigyelés ≥ 6',show:'megf>=6 or info:leg_tobin',do:['info+:ny_kez','rend+0']},
  {label:'Másold le a hurkos g-t és a tétova t-t egy cetlire, és tedd el',tag:'Gyanú +1 · új információ',show:'megf<6 and !info:leg_tobin',do:['gyanu+1','info+:ny_kez']},
  {label:'Tedd el a lapokat, és aludj',do:['alca+2']}]);

p('D10N','Szombati ügyelet',[
 'Szombaton Shane önként bejön. Egyedül nyitja a labort, kávét főz, és a pultnál ülve olvassa a protokollt.',
 {if:'flag:box_opened',t:'Egy ponton megáll, és feléd fordul: „A Hartman-dobozon kevesebb a por, mint a többin. Valaki kihúzta.”'},
 {if:'!info:in_novak',t:'Shane sokat kérdez, de a kérdései ártalmatlanok: hova teszik a lemezeket, miért nincsenek számítógépek az irattárban.'},
 '>> Egy apróság, amit senki sem tart hibának. Amíg valaki ki nem mondja.'],
 [{label:'Mondd, hogy te voltál: leltárat csináltál',tag:'Gyanú −2 · Álca −1',show:'flag:box_opened',do:['gyanu-2','alca-1','flag:shane_lied=true']},
  {label:'Mondd, hogy Chuck volt az',tag:'Gyanú −3 · Rend −2 · Álca −2',show:'flag:box_opened',do:['gyanu-3','rend-2','alca-2','flag:chuck_blamed=true']},
  {label:'Engedd el a megjegyzést, és mondj mást',do:['alca+1']},{label:'Győzd meg Shane-t, hogy félreértette a dolgot',tag:'Meggyőzés ≥ 6 · Gyanú −3',req:'meg>=6',why:'Meggyőzés ≥ 6 kell',show:'flag:box_opened',do:['gyanu-3','alca+1']}]);

p('D10E','Hívó a rádióban',[
 'A WMHR műsorában egy idősebb nő telefonál be Keithhez, aki kérdőn felnevet: „Marlene, kezdjük, mi a baj?”',
 'Marlene Okafor lassan beszél, mintha minden szót külön mérlegelne. „Én láttam már ilyet. Nem a gyilkosságokat. Azt a… tisztaságot. Nem volt mintázat, csak fegyelem. Hatvannyolcban. Harminc éve.”',
 'Keith elhallgat, majd megköszöni, és a következő hívóra vált.',
 '>> Harminc év. Ez nem véletlen szám, ugye?'],
 [{label:'Írd fel Marlene nevét, és emlékezz rá',do:['info+:ny_hivo','gyanu+1']},
  {label:'Kapcsold le a rádiót',do:['alca+2']},
  {label:'Hallgasd tovább, és jegyezd Keith reakcióját',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['flag:keith_noticed=true','gyanu+1']}]);

p('D10J','Egy teherautó',[
 'Prescott kerítése mellett egy rozsdás, szürke teherautó áll. A hátsó kereke lekopott, a pocsolyában hagyott lenyomat pedig ugyanolyan, mint a bizonyítékfotón: olyan nyom, amelyet a bírósági jegyzőkönyv nem említ.',
 'A teherautó tulajdonosa Wesley Lindqvist, Prescott unokatestvére, aki a lány eltűnésekor átköltözött Prescotthoz.',
 {if:'megf>=5',t:'A rendszám alapján pár perc alatt kiderül: a jármű Lindqvist nevén fut, aki többször is feltűnt a Hollis-környéken.'},
 '>> Nem Prescott. A kérdés most, hogy mit kezdesz vele.'],
 [{label:'Jegyezd fel a rendszámot, és kérdezz a környéken',tag:'Bizonyíték +1 · Gyanú +2',do:['ev2+1','gyanu+2','flag:l_lead=true','info+:in_lindqvist']},
  {label:'Fotózd le a kerék nyomát, és menj haza',tag:'Megfigyelés ≥ 5 · Bizonyíték +1',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['ev2+1','flag:l_lead=true','info+:in_lindqvist']},
  {label:'Hagyd, nem kell ennyit foglalkozni vele',do:['rend-1']}]);

p('D11N','Vasárnapi ebéd',[
 'Neil kézremegése kicsit erősebb a szokottnál. A kanál zörög a tányérban. Egyik kezével eltakarja a másikat, mintha szégyellné.',
 'A konyhai fiókban, a kenyérvágó kések mellett egy keretezett fénykép fekszik lefelé fordítva.',
 {if:'megf>=6 or info:leg_tobin',t:'A fotó két férfit ábrázol, egy fiatal Neilt, és egy idősebb, szemüveges alakot. A hátoldalon: *L.T. és N.J., 1972.*'},
 {if:'megf<6 and !info:leg_tobin',t:'A fotó lefelé fekszik, és Neil olyan gyorsan csukja be a fiókot, hogy nem látsz mást, csak egy sárgult sarkot.'},
 '>> Egy férfi, aki fényképet rejt a saját házában. Érdekes, mit szeret megőrizni.'],
 [{label:'Vedd ki a fotót, és nézd meg',tag:'Megfigyelés ≥ 6',show:'megf>=6 or info:leg_tobin',do:['info+:ny_foto','gyanu+0']},
  {label:'Segíts Neilnek leülni, és kérdezd, jól van-e',tag:'Álca +2',do:['alca+2','rend+1']},
  {label:'Hagyd, és egyél tovább',do:[]}]);

p('D11E','Kétség',[
 'Vacsora után Neil újra előhozza az akta témáját. Azt kérdezi, mi a helyzet Prescott-tal.',
 {if:'flag:prescott_doubt',t:'A kétség nem hagy nyugodni. Egyszer kimondod, és nem lehet visszavenni.'},
 {if:'!flag:prescott_doubt',t:'Nem mondasz semmit. Nincs mit mondani, csak amit az akta tartalmaz.'},
 '>> Neil válaszából kiderül, hogy még tanítvány vagy-e, vagy már csak eszköz.'],
 [{label:'Mondd el a kétségeidet: az alibi nem stimmel',tag:'Rend +2 · Gyanú +1',show:'flag:prescott_doubt',do:['rend+2','gyanu+1','flag:neil_doubt=true']},
  {label:'Mondd, hogy minden rendben, és folytatod',do:['alca+0','rend-1']},
  {label:'Kérdezd meg, ki állítja össze a listát',tag:'Megfigyelés ≥ 5',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['info+:ny_lista','alca-1']}]);

p('D11J','Három akta',[
 'Éjjel az asztalon három akta: Prescott, a Hollis-ügy bizonyítékai, és a Lindqvistre vonatkozó feljegyzések, amelyeket a rendszámból és két éjszakai sétából raktál össze.',
 {if:'flag:l_lead and info:in_haj',t:'A két lap összeér. Lindqvist járműve, a hajszál színe, az alibi. Három független jel, ugyanaz az irány.'},
 {if:'flag:l_lead and !info:in_haj',t:'A járműnyilvántartás és az alibi egy irányba mutat. A hajszál még hiányzik.'},
 {if:'!flag:l_lead',t:'Nem találod a fonalat. Prescott neve az egyetlen, ami következetesen szerepel.'},
 '>> Három akta, egy lista. A lista Neilé, az igazság viszont nem vitatható.'],
 [{label:'Foglald egy listába a három aktát',tag:'Bizonyíték +1 · Szakértelem ≥ 5',show:'flag:l_lead',req:'szak>=5',why:'Szakértelem ≥ 5 kell',do:['ev2+1','rend+2','alca-1']},
  {label:'Hagyd, még nincs elég bizonyíték',do:['alca+2']},
  {label:'Szundíts egy órát, és kezdd újra',do:['alca+3','gyanu+0']}]);

p('D12N','Kérdező',[
 'Shane a pult mellett áll, és nem néz a szemedbe. „Szerintem nem hiszek neked. De nem is akarok.”',
 {if:'flag:shane_lied',t:'Megérted: ez azt jelenti, hogy Shane tud valamit.'},
 {if:'flag:chuck_blamed',t:'Chuck is odalép: „Furcsa. Szombaton nem is voltam bent.”'},
 {if:'!flag:shane_lied and !flag:chuck_blamed',t:'Nem derül ki, miről beszél, de a hangja komoly.'},
 '>> Egy tizenkilenc éves még nem veszélyes. De ha rosszul kezeled, olyan tanítványt kapsz, akit nem akarsz.'],
 [{label:'Légy őszinte: valamit titkolsz, de nem rosszat',tag:'Gyanú −2 · Álca +1',do:['gyanu-2','alca+1','flag:shane_half=true']},
  {label:'Rázd le: túl sokat gondolkodik',do:['alca-2','gyanu+2']},
  {label:'Hívd meg kávéra, és beszélgessetek',tag:'Álca +3',do:['alca+3','flag:shane_close=true']}]);

p('D12E','Zárt ajtó',[
 'Hazaérsz, és Kim az ajtóban áll, a lépcsőház fénye kicsit sárgává teszi a haját.',
 {if:'flag:t1_done',t:'Megfogja a kezed. „Mi történt az ujjperceiddel? Karcolás?”'},
 {if:'!flag:t1_done',t:'„Rosszul nézel ki.” Nem kérdés, hanem megállapítás.'},
 '>> Kim az egyetlen a házban, aki észreveszi a hazugságot. Nem mondja ki, de tudja.'],
 [{label:'Mondd, hogy egy dobozba ütötted a kezed',tag:'Gyanú −1 · Álca −1',do:['gyanu-1','alca-1']},
  {label:'Mondd el neki, hogy fáradt vagy, és köszönd meg a figyelmét',tag:'Álca +3',do:['alca+3','flag:kim_bond=true']},
  {label:'Kerüld a tekintetét, és menj be',do:['alca-2','rend-1']},{label:'Nyugtasd meg Kimet, és terelj másra',tag:'Meggyőzés ≥ 6 · Álca +3',req:'meg>=6',why:'Meggyőzés ≥ 6 kell',do:['alca+3','gyanu-2','flag:kim_bond=true']}]);

p('D12J','A Házigazda',[
 'Éjszaka van, a lakás nesztelen. A fejedben a Házigazda szólal meg, nem hangosan, de a csend átrendeződik körülötte.',
 '>> Neil szerint mindig a szabály az első. Szerintem az, hogy nyugodtak legyünk. Nézd, mennyit gondolkodsz. Mintha arra várnál, hogy a helyes dolog megmondja, mit tegyél.',
 {if:'rend<=60',t:'>> **Nem kell várni.** Egy mozdulat, és vége a kétségnek.'},
 {if:'rend>60',t:'>> De persze, a szabály megvéd. Ma még.'}],
 [{label:'Hallgass rá, és mondd ki hangosan, amit gondolsz',tag:'Rend −3 · Álca −2',do:['rend-3','alca-2'],danger:1},
  {label:'Nyisd ki a Kódexet, és olvasd el a szabályokat',tag:'Rend +3',do:['rend+3']},
  {label:'Menj ki a levegőre, és hagyd, hogy elmúljon',do:['alca+1','rend+1']},{label:'Mondd ki határozottan: nem',tag:'Hidegvér ≥ 6 · Rend +4',req:'hid>=6',why:'Hidegvér ≥ 6 kell',do:['rend+4']}]);

p('D13N','A minta',[
 {if:'flag:t1_done',t:'Ostrander bejön, és a tárgyalóasztalra tesz egy fotót: Novak, a raktárban. „Nem látok mintát. Egyetlen sebet, tisztán. Mintha valaki hónapokig gyakorolt volna.” Ostrander a szemedbe néz. „Nem szeretem a fegyelmezett embereket.”'},
 {if:'!flag:t1_done',t:'Ostrander a kikötői tűz ügyében kérdez, és közben megjegyzi, hogy a labor olyan rendezett, mintha valaki mindent kétszer ellenőrizne. „Nem szeretem a fegyelmezett embereket.”'},
 'Bólintasz, de nem jut eszedbe megfelelő válasz.',
 '>> Az ötödik szabály megvéd tőle. A harmadik is. Mindkettőt betartottad?'],
 [{label:'Mosolyogj, és viccelődj a fegyelemről',tag:'Gyanú −2',do:['gyanu-2','alca+1'],goto:'O1'},
  {label:'Kérdezz vissza: honnan érzi?',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['gyanu-3','info+:in_ostrander3'],goto:'O1'},
  {label:'Hallgass, és add vissza a fotót',do:['gyanu+2','alca-1'],goto:'O1'},{label:'Fordítsd tréfára a fegyelmet',tag:'Meggyőzés ≥ 7 · Gyanú −4',req:'meg>=7',why:'Meggyőzés ≥ 7 kell',do:['gyanu-4','alca+2'],goto:'O1'}],
 {enter:[{if:'flag:t1_done',do:['gyanu+3']},{if:'!flag:t1_done',do:['gyanu+1']}]});

p('D13E','Gyakorlatok',[
 'Késő este, a labor üres, te és Shane pedig a DNS-mintavételt gyakoroljátok. Shane keze ügyesebb, mint amire számítottál, és minden mozdulat után megkérdezi: „Így jó? Így helyes?”',
 {if:'flag:shane_close',t:'Shane egyre közelebb ül, mintha a közelségből lehetne tanulni. Érzed, hogy ezt nem akartad, de már nem lehet visszacsinálni.'},
 '>> Egy jó tanítvány a legnagyobb ajándék. És a legnagyobb veszély.'],
 [{label:'Taníts türelmesen, és dicsérd',tag:'Álca +2',do:['alca+2','flag:shane_taught=true']},
  {label:'Szabj határt: csak a munka számít',do:['alca+0','gyanu-1']},
  {label:'Figyeld, hogyan néz rád, amikor azt hiszi, nem látod',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['info+:in_shane']}]);

p('D13J','Hívás',[
 'Neil hív éjfél után. Nincs köszönés.',
 '„Prescott. Mi a helyzet?”',
 {if:'flag:neil_doubt',t:'A hangja hideg és határozott. „Mondtam: a lista nem téved. Nem te döntöd el.”'},
 {if:'!flag:neil_doubt',t:'A hangja nyugodt, de a mögötte lévő csend hosszabb a szokottnál.'},
 {if:'flag:neil_doubt',t:'>> Neil most nem kérdez, hanem védekezik. Aki ennyire védi a szabályt, annak már kétsége van.'},
 {if:'!flag:neil_doubt',t:'>> Az első alkalom, hogy Neil nem utasít, hanem kérdez. Mintha ő is bizonytalan lenne.'}],
 [{label:'Mondd meg neki, hogy ellenőrizni akarod a bizonyítékokat',tag:'Rend +2',do:['rend+2','flag:neil_pressed=true']},
  {label:'Mondd, hogy minden rendben, és hagyd rá',do:['rend-2']},
  {label:'Kérdezd meg: neked is vannak kétségeid?',tag:'Megfigyelés ≥ 5',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['flag:neil_unsure=true','alca-1']}]);

p('D14N','A pilot felelőse',[
 'Dr. Zeller behívja őt az irodájába. „Te leszel a pilot felelőse. A mintaátvételt, a bizonyítékláncot, az első adatbázis-feltöltést. Chuck túl lassú, Shane túl friss. Te pontos vagy.”',
 'A mondat dicséret, és csapda egyszerre. Tudod, hogy a felelősség a láthatóság másik neve.',
 '>> A legjobb búvóhely a központ. De a központ látható.'],
 [{label:'Fogadd el, és mondd: köszönöm a bizalmat',tag:'Gyanú +3 · Álca +3',do:['gyanu+3','alca+3','flag:pilot_lead=true'],goto:'S1'},
  {label:'Mondd, hogy Chuck tapasztaltabb',tag:'Gyanú −1 · Álca −2',do:['gyanu-1','alca-2'],goto:'S1'},
  {label:'Vállald, de kérd Shane segítségét',tag:'Álca +2',do:['alca+2','flag:pilot_lead=true','flag:shane_close=true'],goto:'S1'}]);

p('D14E','A DNS-ről',[
 'A rádióban Keith Yates egy volt vegyészt hív meg, aki a DNS-technológiáról magyaráz. A hangja száraz, szinte unalmas.',
 '„Október tizenötödike után a bűnözőknek számolniuk kell vele: onnantól minden test őrzi a nyomát.”',
 'Keith nevet: „Hallgatók, a jövő ilyen. Mindenki vigyázzon, mit hagy hátra.”',
 '>> Egyetlen hajszál, egyetlen bőrsejt. A világ egy hordozható archívum.'],
 [{label:'Hallgasd végig, és tanulj belőle',tag:'Szakértelem ≥ 5',req:'szak>=5',why:'Szakértelem ≥ 5 kell',do:['info+:in_dna_tech','gyanu-1']},
  {label:'Kapcsold le',do:['alca+2']},
  {label:'Hívd fel a műsort, és kérdezz valamit',tag:'Gyanú +4 · veszélyes',danger:1,do:['gyanu+4','flag:radio_exposed=true','alca-1']}]);

p('D14J','Előestéje',[
 'Az utolsó nyugodt éjszaka. A DNS-pilot holnap indul, és az adatbázis a labor minden rejtett zugát megvilágítja.',
 {if:'ev2<3 and flag:l_lead',t:'Prescott és Lindqvist ügye még nincs lezárva. Ha mélyebbre ásnál, találnál még egy darabot.'},
 {if:'ev2>=3',t:'Az akták összeálltak. Lindqvist az, nem Prescott. A kérdés csak az, mit kezdesz vele.'},
 '>> A hónap fele elmúlt. A másik fele nem lesz ilyen nyugodt.'],
 [{label:'Áss mélyebbre Lindqvist ügyében',tag:'Bizonyíték +1 · Gyanú +2',show:'flag:l_lead and ev2<3',do:['ev2+1','gyanu+2']},
  {label:'Pihenj, és hagyd a holnapot',do:['alca+4','gyanu-1']},
  {label:'Írj a naplóba mindent, amit tudsz',do:['rend+2']},{label:'Hidegvérrel gondold át a hónapot',tag:'Hidegvér ≥ 6 · Rend +3',req:'hid>=6',why:'Hidegvér ≥ 6 kell',do:['rend+3']}]);

/* ===== 3. ív: A szorítás (okt. 15–21) ===== */
p('D15N','Éles indítás',[
 'Október tizenötödike. A DNS-pilot az első reggeltől kezdve nem a laboré, hanem a városé: Zeller ünnepélyes rendben tálalja a mintákat, a kamera villog, valaki pezsgőt hozott, amit senki nem mer kinyitni.',
 {if:'flag:t1_done',t:'Az első adagban ott a kikötői raktár egyik mintája is. Látod a számát a tálcán, és a kezed megáll a levegőben.'},
 {if:'!flag:t1_done',t:'Az első adag a kikötői tűz mintáiból áll. A te feladatod, hogy mindet naplózd és továbbítsd.'},
 'Zeller int. „{{n}}, te vagy a felelős.”',
 '>> Ez az a pillanat, amikor a hétköznapi világ szembenéz veled. Nem kell félned. Elég, ha jelen vagy.'],
 [{label:'Add be a mintát a szokott módon',tag:'Rend +2 · veszélyes',show:'flag:t1_done',danger:1,do:['flag:dna_risk=true','gyanu+6','rend+2']},
  {label:'Csúsztasd a következő adagba, ügyes adminisztrációval',tag:'Szakértelem ≥ 6 · Rend −2 · Gyanú +2',show:'flag:t1_done',req:'szak>=6',why:'Szakértelem ≥ 6 kell',do:['gyanu+2','rend-2']},
  {label:'Kérd meg Shane-t, hogy ő intézze',tag:'Gyanú +3 · Shane belelát',show:'flag:t1_done',do:['gyanu+3','flag:shane_involved=true']},
  {label:'Naplózz mindent szabályosan, és légy nyugodt',show:'!flag:t1_done',do:['alca+3','gyanu-2']}]);

p('D15E','Pezsgő',[
 'A nap végén Zeller kinyitja azt a pezsgőt. Papírpoharak, Chuck pohárköszöntője, Shane lelkesedése, és Ostrander, aki a falnak dőlve áll, és nem iszik.',
 'Te is kapsz egy poharat, amely hideg az ujjaid között.',
 {if:'flag:t1_done',t:'Ostrander odalép, és olyan halkan kérdez, hogy csak te hallod: „Mondja, {{s}}, mit gondol, mennyi idő múlva találunk meg mindenkit?”'},
 {if:'!flag:t1_done',t:'Ostrander odalép, és kedvesen megkérdezi, mit gondol a rendszerről.'},
 '>> Egy pohár italnál nincs veszélyesebb helyzet. Mindenki őszinte, és mindenki figyel.'],
 [{label:'Mondd: „Idővel mindenkit, de nem mindig azt, akit gondolunk”',tag:'Álca −1 · Gyanú +2',do:['alca-1','gyanu+2']},
  {label:'Mondd: „Ha a rendszer jó, hamar”',tag:'Gyanú −1',do:['gyanu-1','alca+1']},
  {label:'Hárítsd el: „Az én dolgom csak a minták”',tag:'Álca +1',do:['alca+1']}]);

p('D15J','Éjszakai műszak',[
 'Éjfél után a labor lámpáinak fele le van oltva. A számítógépen zöld betűk pörögnek: az adatbázis első napja, kifogástalanul.',
 'Egyedül vagy a monitor villogásával és a hűtők kattogásával.',
 {if:'szak>=6',t:'A hozzáférési napló megnyílik: mindenki, aki rákeresett valamire, ott van névvel és időponttal. Ostrander nyolc lekérdezést indított, ebből hármat a kikötői ügy mintáira.'},
 {if:'szak<6',t:'A rendszer minden kérdést naplóz, de a naplót még nem tudod olvasni. Nem biztos, hogy ez jobb.'},
 '>> Ami egyszer bekerül a rendszerbe, azt a rendszer sosem felejti el. A világ innentől nem lesz ugyanaz.'],
 [{label:'Olvasd el a naplót, és tanulj belőle',tag:'Szakértelem ≥ 6 · Gyanú +1',show:'szak>=6',do:['gyanu+1','info+:in_naplo']},
  {label:'Zárd be a gépet, és menj haza',do:['alca+2']},
  {label:'Várj, és figyeld, ki kérdez még',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['info+:in_naplo2','gyanu+1']}]);

p('D16N','Az első eredmények',[
 {if:'flag:dna_risk',t:'Reggel Zeller az irodájában áll, a monitoron egy részleges profil. „Furcsa. Egy ismeretlen közreműködő, de nem tudom, honnan származik.” A hangja nyugodt, de te hallod mögötte az izgalmat.'},
 {if:'!flag:dna_risk',t:'Reggel Zeller az irodájában áll, és mosolyog. „Tisztán dolgozik a rendszer. Az első adag tökéletes.”'},
 'Ostrander már ott van, egy széken ül, és a térdén tart egy jegyzettömböt.',
 '>> Ma mindenki egy szóra vár. Neked azt kell eldöntened, kimondod-e.'],
 [{label:'Magyarázd el, hogy az ilyen részleges profil gyakori hibaforrás',tag:'Szakértelem ≥ 6 · Gyanú −3',show:'flag:dna_risk',req:'szak>=6',why:'Szakértelem ≥ 6 kell',do:['gyanu-3','rend-1'],goto:'H1'},
  {label:'Hallgass, és hagyd, hogy Zeller értelmezze',tag:'Gyanú +2',show:'flag:dna_risk',do:['gyanu+2'],goto:'H1'},
  {label:'Gratulálj Zellernek a sikerhez',show:'!flag:dna_risk',do:['alca+2','gyanu-1'],goto:'H1'},{label:'Maradj hűvös, és hagyd, hogy az eredmény beszéljen',tag:'Hidegvér ≥ 7 · Gyanú −3',req:'hid>=7',why:'Hidegvér ≥ 7 kell',show:'flag:dna_risk',do:['gyanu-3'],goto:'H1'}]);

p('D16E','Vacsora Kimmel',[
 'Kim a konyhájában főz, és a fűszer illata kiszökik a folyosóra. Becsöngetsz, és kicsit meglepődsz, hogy már nem idegennek érzed magad.',
 'Az asztalnál Kim mesél a kórházról: egy idős férfi, aki minden éjjel ugyanazt a történetet meséli egy eltűnt lányról.',
 {if:'flag:kim_bond',t:'Kim megérinti a kezedet. „Te jó ember vagy. Ha egyszer nem hinnéd, szólj, és elmondom.”'},
 '>> A Kódex második szabálya: soha a szeretteid körében. Kim nem kérte, hogy szeressék. Mégis így lett.'],
 [{label:'Maradj, és légy kedves',tag:'Álca +5 · Gyanú −2',do:['alca+5','gyanu-2','flag:kim_bond=true'],goto:'K1'},
  {label:'Köszönd meg, és menj korán',do:['alca+1'],goto:'K1'},
  {label:'Figyeld, mit mond a kórházról',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['info+:in_kim2'],goto:'K1'}]);

p('D16J','Hajszál',[
 'A Hollis-ügy hajszála alig látszik a mikroszkóp alatt. A fény elé tartod, és a pilot DNS-futtatása most az egyetlen lehetőség: megpróbálni.',
 {if:'flag:l_lead and ev2<3',t:'Ha a hajszál egyezik Lindqvisttel, a bizonyíték teljes. Ha nem, vissza az elejére.'},
 {if:'ev2>=3',t:'A bizonyíték már megvan. A futtatás csak a végső pecsét, és a kockázat több, mint a haszon.'},
 {if:'!flag:l_lead',t:'Nem tudod, kivel kellene összevetni. A futtatás értelmetlen.'},
 '>> Egy hajszál. Csak annyi kell, hogy a világ ne tévedjen.'],
 [{label:'Futtasd át a hajszálat, és vesd össze Lindqvist régi mintájával',tag:'Szakértelem ≥ 6 · Bizonyíték +1 · Gyanú +3',show:'flag:l_lead and ev2<3',req:'szak>=6',why:'Szakértelem ≥ 6 kell',do:['ev2+1','gyanu+3','info+:in_dna_match']},
  {label:'Kérd meg Shane-t, hogy futtassa le',tag:'Bizonyíték +1 · Gyanú +4',show:'flag:l_lead and ev2<3',do:['ev2+1','gyanu+4','flag:shane_involved=true']},
  {label:'Jegyezd fel a hajszál adatait a naplóba, és zárd el',tag:'Rend +2',show:'!flag:l_lead or ev2>=3',do:['rend+2']},
  {label:'Hagyd, és maradj óvatos',do:['alca+2']}]);

p('D17N','A napló',[
 'Szombat. A labor csendes, a hűtők kattognak. A monitor előtt ülsz, és megnézed a hozzáférési naplót.',
 {if:'flag:dna_risk',t:'A kikötői mintát kétszer is lekérdezte valaki, aki nem Zeller, nem Chuck és nem te: Ostrander.'},
 {if:'!flag:dna_risk',t:'Ostrander kérdezgeti a rendszert. Minden kérdés más, de mindegyik ugyanabba az irányba mutat.'},
 '>> Nem bújhatsz el egy rendszer elől. De helyezkedhetsz benne.'],
 [{label:'Írd fel, mit keres, és számolj ezzel',tag:'Szakértelem ≥ 5',req:'szak>=5',why:'Szakértelem ≥ 5 kell',do:['info+:in_ostrander4','gyanu-1']},
  {label:'Hagyd, és menj haza',do:['alca+2']},
  {label:'Légy gyanútlan: kérdezz rá Ostranderre',tag:'Álca +1 · Gyanú +2',do:['alca+1','gyanu+2']}]);

p('D17E','A levél',[
 'Este hatkor sárga boríték van a postaládában, a címzés Neil kézírása. Benne egyetlen lap, tintával írva, remegő vonalakkal.',
 '*„Kedves gyerekem. Nem tudom, mennyi időm van. Amit adtam neked, nem az enyém volt. Ne higgy el mindent, amit írtam. A lánc régebbi, mint én, és régebbi, mint te. Vigyázz a fiúra.”*',
 '>> Egy levél, ami nem mondja ki, amit kell. Neil ilyen. Mindig csak a felét mondta.'],
 [{label:'Olvasd el újra, és tedd el',do:['info+:ny_level']},
  {label:'Hívd fel Neilt azonnal',do:['alca-1','info+:ny_level','flag:neil_called=true']},
  {label:'Tépd szét, és felejtsd el',do:['rend-2','alca-2']}]);

p('D17J','Döntés: Hollis-ügy',[
 'Éjjel egy óra. Két akta fekszik az asztalon: a Kódex-lista szerinti Vernon Prescott, és a saját aktád Wesley Lindqvistról.',
 {if:'ev2>=3',t:'Mindent tudsz: a hajszál, a rendszám, az alibi. Lindqvist, nem Prescott.'},
 {if:'ev2<3 and flag:prescott_doubt',t:'Prescott alibije kétséges, de Lindqvist ügye még nincs kész.'},
 {if:'ev2<3 and !flag:prescott_doubt',t:'Nem dolgoztál eleget. Prescott neve az egyetlen, ami következetesen szerepel.'},
 '>> A lista Neilé. Az igazság a tiéd. Ez a kettő sosem volt ugyanaz.'],
 [{label:'Hajtsd végre a munkát Wesley Lindqvisttel',tag:'Bizonyíték ≥ 3',show:'flag:t2_known and !flag:t2_done and !flag:t2_skip',req:'ev2>=3',why:'Nincs elég bizonyíték (3 kell)',danger:1,do:['flag:t2_done=true','rend+5','gyanu+5','alca-3']},
  {label:'Hajtsd végre a munkát Vernon Prescott-tal, a lista szerint',tag:'A bizonyítékok ellentmondanak',show:'flag:t2_known and !flag:t2_done and !flag:t2_skip',danger:1,goto:'E_TEV'},
  {label:'Várj, még nem most',show:'flag:t2_known and !flag:t2_done and !flag:t2_skip',do:['alca+1']},
  {label:'Pihenj le',show:'!flag:t2_known or flag:t2_done or flag:t2_skip',do:['alca+3']}]);

p('D18N','Vasárnap',[
 'Neil kertjét az ősz színei borítják. A kerti széken ül, és a levélről egy szót sem szól. Leülsz mellé.',
 {if:'flag:neil_called',t:'„Miért hívtál fel? Nem akartam, hogy felhívj.” A mondat nem harag, hanem szégyen.'},
 {if:'!flag:neil_called',t:'Neil sokáig nem mond semmit. Aztán azt kérdezi: „Elolvastad?”'},
 '>> A kérdés másik felét te adod hozzá: ki ír egy ilyen levelet annak, akit felnevelt?'],
 [{label:'Kérdezd meg, mit jelent a „lánc”',tag:'Rend −1 · Megfigyelés ≥ 5',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['info+:in_lanc','rend-1']},
  {label:'Mondd, hogy érted, és ne beszéljetek róla',do:['alca+1']},
  {label:'Fogd meg a kezét, és ülj mellette csendben',tag:'Álca +3',do:['alca+3','flag:neil_close=true']}]);

p('D18E','Valaki követ',[
 'Este a lépcsőházban azt hiszed, hogy lépteket hallasz. Megállsz, a léptek elhallgatnak. Nincs senki, csak a lift ajtaja, ami lassan becsukódik.',
 {if:'flag:shane_involved or flag:shane_close',t:'Valaki a fal mögött egy percig nem mozdul. Biztos vagy benne, hogy ismered azt a légzést.'},
 {if:'!flag:shane_involved and !flag:shane_close',t:'Nem tudod, ki volt. De a lépcsőház kicsit hidegebb, mint előtte.'},
 '>> A gyanú másik neve figyelem. Valaki most nem a szokásos rutint figyeli.'],
 [{label:'Menj vissza, és nézd meg, ki volt',tag:'Gyanú +2',danger:1,do:['gyanu+2','info+:in_kovetes']},
  {label:'Menj be, és zárd be az ajtót',do:['alca+1']},
  {label:'Várj a sötétben, és figyelj',tag:'Megfigyelés ≥ 6',req:'megf>=6',why:'Megfigyelés ≥ 6 kell',do:['info+:in_kovetes2']}]);

p('D18J','Utolsó esély',[
 {if:'flag:t2_done',t:'A Hollis-ügy lezárult. A kamera elfordult, a város pedig semmit sem tud.'},

p('H4','Shane kérdése',[
 'A temető kapujában valaki áll, kezében egy összehajtott újsággal. Shane Crowe. „Nem akartam zavarni. Csak… sajnálom.” Nem kérdezi, ki volt Neil neked.',

 '>> A fiú nem vádol. Kérdez. Ez a legnehezebb eset.'],

/* ===== 3. pont: Shane mélyebb szerepe ===== */
p('H1','Az újságkivágások',[
 'A kávéautomata mellett Shane egy összehajtott újságlapot tart a kezében. „Nézze meg ezt.” Néhány kivágás: Louise Hartman ügye, a Hollis-ügy, két felmentő ítélet.',
 {if:'flag:t1_done',t:'„Eugene Novakot megtalálták a raktárban. Őt két éve felmentették. Prescottot ugyanabból az évből szintén. Mintha valaki listát vezetne.”'},
 {if:'!flag:t1_done',t:'„Novakot felmentették, Prescottot is. Mind a kettő ugyanabból a két évből. Furcsa egybeesés, nem?”'},
 'Shane nem vádol. Úgy néz, mint aki egy képletet lát. „Nem akarom, hogy bárkinek baja essen. Csak azt akarom érteni, miért.”',
 '>> A fiú észrevesz valamit, amit te nem akarsz, hogy észrevegyen. És nem rosszindulatból.'],
 [{label:'Mondd, hogy ez csak egybeesés, az újságok szeretnek mintát látni',tag:'Gyanú −1 · Álca +1',do:['gyanu-1','alca+1','flag:shane_noticed=true'],goto:'D16E'},
  {label:'Hallgasd meg, és kérdezd meg, miért érdekli ennyire',tag:'Megfigyelés ≥ 5 · új információ',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['info+:in_shane3','flag:shane_noticed=true'],goto:'D16E'},
  {label:'Vedd el tőle a lapot: „Ezt hagyd, a laborban nincs rá idő”',tag:'Gyanú +2 · Álca −1',do:['gyanu+2','alca-1','flag:shane_noticed=true'],goto:'D16E'}],
 {at:'D16N',kh:'1998. október 16. · péntek · délelőtt',ke:'October 16, 1998 · Friday · morning'});

p('H2','Shane anyja',[
 'A nap végére a labor kiürül, Shane viszont a pultnál ül, és nem megy haza. „Rosszul néz ki. Nehéz napja volt?”',
 'Kávét tölt, és leteszi eléd. „Anyám mindig azt mondta: aki hallgat, az teher alatt van.” Egy percig a pultot nézi. „Pincérnő volt egy dockside-i étkezdében. Kilencvenegyben egy törzsvendég megölte. Én tizenkét éves voltam.”',
 '„A nyomozók két hét alatt lezárták az ügyet. Az alibit nem ellenőrizték, két szemtanút nem hallgattak ki, és egy véres kesztyűt, amit a kuka mellett találtak, soha nem vittek be a laborba. A férfit felmentették. A bíró azt mondta: kétség esetén a vádlott javára.”',
 {if:'flag:t1_done',t:'Nem mozdulsz. A „kétség esetén a vádlott javára” pontosan az a mondat, amelyet Novaknál is mondtak.'},
 'Shane felnéz. „Azért jöttem ide dolgozni. Hogy ami egyszer bekerül a laborba, azt soha ne veszítsék el. És hogy legyen valaki, aki végigcsinálja. Mint Ostrander.” Aztán megvonja a vállát. „Egy hónapja egy Tobin nevű úr hívott, hogy van hely a laborban. Nem is ismertem. Azt is tudta, hogyan hívták az anyámat. Szerencsém volt.”',
 '>> A rendszer minden hibája nevel valakit. Ő most itt ül, és rád néz.'],
 [{label:'Mondd, hogy sajnálod, és hallgasd végig',tag:'Álca +3 · Rend +1',do:['alca+3','rend+1','flag:shane_trauma=true','flag:shane_close=true','info+:in_shane4','info+:ny_shane_tobin'],goto:'D20E'},
  {label:'Mondd, hogy a rendszer néha tényleg cserben hagy',tag:'Álca +2 · Rend −2 · Shane közelebb kerül',do:['alca+2','rend-2','flag:shane_trauma=true','flag:shane_close=true','info+:in_shane4','info+:ny_shane_tobin'],goto:'D20E'},
  {label:'Tereld másra, mert nem akarod, hogy ennyire közel kerüljön',tag:'Álca −1 · Gyanú −1',do:['alca-1','gyanu-1','flag:shane_trauma=true','info+:in_shane4','info+:ny_shane_tobin'],goto:'D20E'}],
 {at:'D20N',kh:'1998. október 20. · kedd · késő délután',ke:'October 20, 1998 · Tuesday · late afternoon'});

p('H3','A folyosón',[
 'Ostrander a tárgyaló ajtajában áll, a kabátja a karján. Amikor elmegy melletted, nem szól. Az üvegen át látod, hogy Shane egyedül ül bent, és a térdét nézi.',
 'Shane kijön, amikor a lépések elhalnak. „Engem is kikérdezett. Ugyanazt kérdezte: hol volt maga azokon az éjszakákon.”',
 {if:'flag:shane_noticed',t:'„A kivágásokról is kérdezett. Mondtam, hogy az az én ötletem volt, nem a magáé.”'},
 '„Azt mondtam neki, hogy a múlt hétvégén együtt dolgoztunk az irattárban. Nem tudom, miért. Nem hiszem, hogy maga bármit tett volna. De ha valaki ilyen pontosan dolgozik, annak nem kell bizonygatnia.”',
 {if:'flag:shane_involved',t:'Shane nem említi, hogy ő futtatta le a mintát. Ez a legnagyobb hazugsága, és te tudod, hogy az.'},
 '>> Egy fiú, aki ártatlannak hisz, hazudott érted. Neked kell eldöntened, mit kezdesz vele.'],
 [{label:'Köszönd meg csendben, és ne beszéljetek róla többet',tag:'Gyanú −4 · Álca +2 · Rend −2',do:['gyanu-4','alca+2','rend-2','flag:shane_defended=true'],goto:'D26J'},
  {label:'Mondd, hogy ne hazudjon helyetted',tag:'Gyanú +2 · Rend +3',do:['gyanu+2','rend+3','flag:shane_defended=true'],goto:'D26J'},
  {label:'Kérdezd meg, miért tette',tag:'Megfigyelés ≥ 5 · Álca +1',req:'megf>=5',why:'Megfigyelés ≥ 5 kell',do:['alca+1','info+:in_shane5','flag:shane_defended=true'],goto:'D26J'}],
 {at:'D26E',kh:'1998. október 26. · hétfő · késő este',ke:'October 26, 1998 · Monday · late evening'});

inf('in_shane3','Shane kivágásai','Shane észrevette, hogy a két felmentett férfi ugyanabból az évből való. Mintát lát, de nem vádol.','i');
inf('in_shane4','Shane anyja','Shane anyját 1991-ben megölte egy törzsvendég. A nyomozók elkapkodták az ügyet, egy alibit sem ellenőriztek, ezért bizonyíték hiányában felmentették. Shane azért ment a laborba, hogy ami bekerül, azt soha ne veszítsék el.','i');
inf('in_shane5','Shane hazugsága','Shane hazudott érted Ostrandernek. Nem tudja, kit véd, csak azt hiszi, hogy ártatlan vagy.','i');
inf('ny_shane_tobin','Nyom: Shane és Tobin','Shane szerint egy Tobin nevű úr hívta fel, hogy van hely a laborban. Nem ismerte, a férfi mégis tudta az édesanyja nevét.');

p('W1','Wayne után',[
 {if:'flag:t4_done',t:'A rádióban Wayne Sullivan neve hangzik el: tegnap este a Dockside-i zálogházban találták meg. Rablás nyoma nincs, betörés sincs. Ostrander a labor ajtajában áll, és nem szól semmit. A tekintete pár másodpercig a kezeden marad.'},

 {if:'flag:paid_wayne and !flag:t4_done',t:'Wayne a labor kapuja előtt vár egy összehajtott újsággal. Nem integet, csak megmutatja az üres borítékot, amelyet a múltkor átadtál. „Ezer”, mondja, és nem mosolyog.'},

 {if:'!flag:paid_wayne and !flag:t4_done',t:'A Dockside-on valaki látta Wayne-t Ostrander egyik emberével kávézni. Nem biztos a hír, de eljutott hozzád: Wayne nem vár tovább.'},
 {if:'!flag:paid_wayne and !flag:t4_done',t:'>> Aki életben marad, az beszél. Ez nem fenyegetés, hanem statisztika.'}],
 [{label:'Mondd, hogy sajnálod: a Dockside veszélyes hely',tag:'Gyanú +1 · Álca +1',show:'flag:t4_done',do:['gyanu+1','alca+1','flag:wayne_body=true'],goto:'D23N'},

p('W2','Wayne a kapuban',[
 {if:'flag:t4_done',t:'Este a lépcsőház kapujában senki nem áll. Mégis megállsz, mert az eszed megbotlik egy lehetőségben: valaki mégis ott lehetne. Wayne hiánya hangosabb, mint a jelenléte volt.'},
 {if:'flag:t4_done',t:'>> Nem a Kódex ölte meg. Mi. Ezt akartam, hogy tudd.'},
 {if:'flag:wayne_backoff and !flag:t4_done',t:'Wayne messze áll a kaputól, és nem jön közelebb. Egy biccentés, aztán elfordul. Valami megváltozott benne, és nem tudod, mi.'},

 {if:'!flag:paid_wayne and !flag:wayne_backoff and !flag:t4_done',t:'Wayne a kapuban áll. Nem kér semmit. „Nem hívtam. De Ostrander tudja a nevem, én meg a magáét.” Egy hosszú pillanatig az ablakodat nézi.'}],
