/* ===== The Chuck branch: the frame-up (Oct 21–22) ===== */
p('C1','Unknown Contributor',[
 'In the afternoon, Ostrander walks into the lab holding your draft report. She taps one line with her finger: *Unidentified contributor, partial marker profile, origin unconfirmed.*',
 '“Someone from the lab,” she says quietly. “Or someone who got anything out of the lab.” She writes four names on the whiteboard: *Zeller, Wexler, Crowe, {{s}}.*',
 {if:'flag:chuck_blamed',t:'Under Chuck’s name, she draws a bold question mark. *Saturday duty*, she writes beside it. You can’t tell if it’s an accusation or just a note.'},
 'Chuck Wexler sits in the corner sipping his third coffee, leaving his prints on everything: door handles, test tube racks, mugs, countertops. His skin cells are everywhere. His DNA is baked into the room: stray hairs, saliva on coffee cup rims. The lab is his living room.',
 '>> Someone has to answer for it. Chuck leaves traces on everything. Is that a flaw? Or a gift?',
 '>> The Codex doesn’t allow this, because Chuck is innocent. I, however, don’t know the Codex.'],
 [{label:'Take Chuck’s fingerprint card and forge a match to the crime scene print',tag:'Quick · low risk · Order −3',do:['flag:c_print=true','flag:chuck_framed=true'],goto:'C2'},
  {label:'Alter the digital DNA profile to mirror Chuck’s marker band sequence',tag:'Stronger case · leaves a log trace · Order −4',do:['flag:c_gel=true','flag:chuck_framed=true'],goto:'C2'},
  {label:'Both: fingerprint and DNA',tag:'A sure case · Order −8 · Cover −5 · may look too clean',danger:1,do:['flag:c_print=true','flag:c_gel=true','flag:c_both=true','flag:chuck_framed=true'],goto:'C2'}],
 {at:'D21N',kh:'1998. október 21. · szerda · délután',ke:'October 21, 1998 · Wednesday · afternoon'});

p('C2','The Job',[
 'After eight PM, the building clears out. Zeller has gone home; Shane is in the library; Chuck is nursing a beer at the Spur. The key is in your pocket, the evidence vault is icy cold, and behind the blinking green cursor on your terminal screen sits a database that never forgets.',
 {if:'flag:c_both',t:'Two fabrications, one night. One for the eye, one for the digital record.'},
 {if:'flag:c_print and !flag:c_both',t:'A glass slide carrying the waterfront sample, Chuck’s reference card on the desk, two prints aligned under the comparator.'},
 {if:'flag:c_gel and !flag:c_both',t:'The electrophoresis gel, the bands, and Chuck’s printed profile sheet on the desk.'},
 '>> The world does not judge. It only compares.'],
 [],
 {at:'D21E',kh:'1998. október 21. · szerda · késő este',ke:'October 21, 1998 · Wednesday · late evening',mini:true});

p('C3','Chuck',[
 {if:'flag:chuck_jail',t:'In the morning, two uniformed officers block the lab entrance. Ostrander walks straight to Chuck’s desk without a word. “Chuck Wexler, you’re coming with us.” Chuck laughs, assuming it’s a joke—until he reads the warrant. Zeller leans against the wall, speechless; Shane says nothing. Chuck looks back at you, and you hold his gaze without flinching.'},
 {if:'flag:chuck_fired',t:'Zeller speaks with Chuck behind closed doors. Ten minutes later, Chuck emerges carrying a cardboard box of personal belongings. Suspended pending formal investigation. “I don’t get it,” he mutters. “I never touched evidence that wasn’t assigned to me.” The statement is the absolute truth.'},
 {if:'flag:chuck_none',t:'Ostrander pulls you aside in the hallway. “Someone has tidied up around Chuck. I don’t know who. Yet.” In the background, Chuck fiddles with his coffee mug, oblivious. No arrest warrant was served, but his name remains red-flagged on the board.'},
 {if:'flag:chuck_known and flag:chuck_jail',t:'At the door, he looks back one last time—perhaps remembering that round of beers at the Spur when you were both laughing.'},
  '>> An innocent man framed by your own hand. That isn’t the Codex. That’s the ancient law of the chain: *someone always pays.*'],
 [{label:'Approach Chuck and declare it’s a mistake',tag:'Order +1 · Cover +2 · Suspicion +1',show:'flag:chuck_jail or flag:chuck_fired',do:['rend+1','alca+2','gyanu+1'],goto:'D22E'},
  {label:'Hold your ground and keep working',tag:'Cover −1 · Suspicion −1',show:'flag:chuck_jail or flag:chuck_fired',do:['alca-1','gyanu-1'],goto:'D22E'},
  {label:'Inquire what Ostrander means',tag:'Suspicion +2 · Cover +1',show:'flag:chuck_none',do:['gyanu+2','alca+1'],goto:'D22E'},
  {label:'Act as if nothing has happened',tag:'Suspicion −1',show:'flag:chuck_none',do:['gyanu-1'],goto:'D22E'}],
 {at:'D22N',kh:'1998. október 22. · csütörtök · délután',ke:'October 22, 1998 · Thursday · afternoon'});

p('E_HAM','Caught: The Forgery',[
 'Ostrander places two documents on your kitchen table: the fingerprint card and the electrophoresis gel printout. Beside them lies your lab report, underlined twice.',
 '“The exact same technical anomaly appears on both sheets,” Ostrander states, her voice devoid of anger. “One mistake is bad luck. Two is a signature.”',
 'You look at the papers. Your own work, with your own discipline in every corner.',
 '>> Two flawed forgeries produced by an overly precise technician. I would have warned you, but you would have rationalized it anyway.',
 '**CAUGHT.** You tried to frame an innocent colleague, and the evidence points straight to your door.'],
 [],{end:'fail',legacy:['leg_ham']});

inf('leg_ham','The Forgery’s Trace','Two forgeries leave the same flaw. Whoever puts them side by side sees the signature.','i');

/* ===== The 1974 box and the Castellano dilemma ===== */
p('B1','The Box',[
 'The lockbox is in the bottom desk drawer, locked. Castellano’s study is deserted, saved for the amber glow of the desk lamp. The housekeeper sleeps down the hall; the periodic flash of the security camera feeds a steady rhythm to the quiet.',
 'On top lies an archived document from 1974: *File Access Request, denied.* Beneath it lie three case folders. On the first, written in Neil’s hand: *H. Error.*',
 'The first folder is Henry {{s}}’s homicide trial, October 1973. Acquitted for lack of evidence, but the suspicion never lifted, and two days later he was dead. The alibi letter had been sitting on the prosecutor’s desk before the trial. It was written by the cashier of an all-night gas station: at the time of the murder Henry was filling his tank there, fourteen miles from the scene, and the dated receipt still exists. In the margin, in the handwriting of Castellano, then an assistant prosecutor: *Not needed. The case is strong.* The letter never reached the courtroom.',
 'The second document bears Tobin’s typed lines: *The target list does not err. The system will consume the child regardless. Jessup may take custody if he insists.* Beside it, written in Neil’s shaky hand: *I’ll take him.*',
 'In the third dossier are two private Polaroids: a girl in each, in the same wood-paneled room, the same lamp visible as on Castellano’s desk. On the back, in his handwriting, a date on each, both months after the girl disappeared. Beside them the note, in a judge’s handwriting: *not proven.* A single word, underlined several times.',
 '>> Your father wasn’t a guilty man who got away. He was a mistake. And the mistake was raised.',
 '>> The purity of the Codex doesn’t belong to justice. It belongs to discipline.'],
 [{label:'Take the whole box with you',tag:'Evidence +1 · Suspicion +3 · Order −2 · the evidence stays with you',danger:1,do:['flag:box_taken=true','flag:box_read=true','ev3+1','gyanu+3','rend-2','info+:in_apa','info+:in_castellano2'],goto:'D26N'},
  {label:'Photograph the pages and put the box back',tag:'Observation ≥ 5 · Evidence +1 · Suspicion +1',req:'megf>=5',why:'Requires Observation ≥ 5',do:['flag:box_read=true','ev3+1','gyanu+1','info+:in_apa','info+:in_castellano2'],goto:'D26N'},
  {label:'Read it through and put it back',tag:'Order +1',do:['flag:box_read=true','rend+1','info+:in_apa','info+:in_castellano2'],goto:'D26N'},
  {label:'Burn the box',tag:'Order −3 · Suspicion −1 · the evidence is destroyed',danger:1,do:['flag:box_burned=true','flag:box_read=true','rend-3','gyanu-1','info+:in_apa','info+:in_castellano2'],goto:'D26N'}],
 {at:'D25J'});

inf('in_apa','Your Father’s File','Your father was not guilty. The chain marked him by mistake, and that is why Neil took the child in.','i');
inf('in_castellano2','Castellano’s Secret','In 1973, as an assistant prosecutor, Castellano withheld your father’s alibi, which never reached the court. According to the Polaroids he still met the girls months after they disappeared, but this cannot be proven.','i');

/* ===== Section 2: Kim at the hospital, drinks at the Spur ===== */
p('S1','After Work',[
 'At six sharp, Chuck grabs his coat from the rack. “Launch beers down at the Spur. Anyone who likes the new system comes; anyone who hates it comes double.” The Spur is humming tonight, but Chuck’s corner booth is wide open.',
 'Shane follows a couple of steps behind, gawking like a kid stepping into a cathedral. He’s nineteen, so Chuck slides him a soda and winks at the bartender.',
 '“Twenty-two years in this lab,” Chuck says, leaning back. “I wanted to be a homicide detective. Flunked the oral board and told myself the lab was temporary.” He laughs dryly. “Temporary. My ex-wife left me over that word.”',
 'He takes a gulp of beer. “In ten years a computer will run these tests faster and better. That’s why I leave my bench door cracked: if someone walks in, it means I’m still useful.”',
 'Over his soda glass, Shane looks up at you. “You never make a mistake on sample logging. How do you pull that off?” Chuck laughs before you can answer. “By not having a personal life.”',
 '>> One booth, three colleagues. The most dangerous thing you can do in this business is care about them.'],
 [{label:'Teach: show Shane how to work with precision',tag:'Cover +3',do:['alca+3','flag:shane_taught=true','flag:shane_close=true','flag:chuck_known=true'],goto:'D14E'},
  {label:'Ask Chuck about the old cases',tag:'Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['info+:in_chuck2','alca+1','flag:chuck_known=true'],goto:'D14E'},
  {label:'Buy the next round and let them talk',tag:'Cover +4',do:['alca+4','flag:chuck_friend=true','flag:chuck_known=true'],goto:'D14E'},
  {label:'Say goodbye early',tag:'Cover −1',do:['alca-1','flag:chuck_known=true'],goto:'D14E'}],
 {at:'D14N',kh:'1998. október 14. · szerda · késő délután',ke:'October 14, 1998 · Wednesday · late afternoon'});

p('K1','The Hospital Corridor',[
 'After dinner, Kim grabs her coat and shoulder bag. “My shift starts at nine. Walk with me? You don’t have to come inside—just to the entrance.” St. Brennan Hospital takes on a grim character at night: long vinyl corridors, harsh buzzing fluorescents, the heavy smell of bleach and antiseptic.',
 'Kim remains silent until you reach the service elevators. On the fourth floor, she pauses outside a private room. “My oldest patient. Walter Hollis, seventy-one, heart failure. Every night he asks me the same question.”',
 '“He asks if they found his granddaughter. She went missing two years ago. The detectives told him she’s dead, but Walter refuses to let go. I never know what to tell the poor man.”',
 'You know who Tammy Hollis is. The box, the hair, the gray truck. Kim does not know that you know.',
 '>> Your personal life and your quarry are standing in the very same hallway. Choose carefully which door you push open.'],
 [{label:'Ask Kim what she usually tells him',tag:'Cover +2',do:['alca+2','flag:kim_hollis=true'],goto:'K2'},
  {label:'Tell her you’re working on the case at the lab too',tag:'Cover +3 · Suspicion +2',do:['alca+3','gyanu+2','flag:kim_knows_lab=true'],goto:'K2'},
  {label:'Say that you know nothing about it',tag:'Cover −1',do:['alca-1','flag:kim_lied=true'],goto:'K2'},
  {label:'Steer her elsewhere: ask how she copes with night shifts',tag:'Persuasion ≥ 5 · Suspicion −1',req:'meg>=5',why:'Requires Persuasion ≥ 5',do:['gyanu-1','alca+2'],goto:'K2'}],
 {at:'D16E',kh:'1998. október 16. · péntek · este',ke:'October 16, 1998 · Friday · evening'});

p('K2','The Old Man',[
 'The room is dimly lit. Propped up in the hospital bed is a frail, white-haired man clutching a silver photo frame: a girl, seventeen, laughing into the camera. The edges of the photograph are yellowed with age.',
 '“You with the police, too?” Walter Hollis’s voice sounds like dry parchment rubbing together. “They all say they’re working on it. All I know is, on her last night, Tammy mentioned that gray pickup. Said it was parked at the end of our block again.”',
 'Kim stands in the doorway, hand over her heart. Walter hasn’t uttered that detail to anyone else in the hospital.',
 {if:'flag:l_lead',t:'The license plate, the tire pattern, Wesley Lindqvist. The gray truck.'},
 '>> An old man has said a sentence that nobody has heard for two years. Now you have heard it.'],
 [{label:'Hear him out and note everything down',tag:'Evidence +1 · Suspicion +1',do:['ev2+1','gyanu+1','info+:ny_walter'],goto:'D16J'},
  {label:'Say that everything possible is being done for her',tag:'Cover +2 · Order +1',do:['alca+2','rend+1'],goto:'D16J'},
  {label:'Take his hand',tag:'Cover +3',do:['alca+3','flag:kim_bond=true'],goto:'D16J'},
  {label:'Watch Kim’s reaction while Walter speaks',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['info+:in_kim3'],goto:'D16J'}],
 {at:'D16E',kh:'1998. október 16. · péntek · késő este',ke:'October 16, 1998 · Friday · late evening'});

inf('in_chuck2','Chuck’s Fear','Chuck is afraid that the machines will one day find his own traces: the lab is full of them.','i');
inf('ny_walter','Clue: Walter Hollis’s Words','According to Walter, on her last night Tammy talked about a gray truck.');
inf('in_kim3','Kim’s Silence','Kim knows more about the case than she says. Or she is simply afraid of it.','i');

/* ===== Section 3: Ostrander's cat and mouse ===== */
p('O1','The Open Folder',[
 'Ostrander leaves you alone in the third-floor conference room, coffee still steaming in her mug. “Hold on, got a call.” The heavy door clicks shut behind her; through the frosted glass, you see her back turned in the corridor.',
 'On the table lies an open folder. A master list of names with small check marks next to them. The top name is struck through.',
 {if:'flag:t1_done',t:'The top name is Eugene Novak. There is no check mark next to it.'},
 '>> An unguarded file and a glass wall. Either sloppy fieldcraft or a deliberate snare.'],
 [{label:'Look at the folder',tag:'Suspicion +2 · new information',do:['gyanu+2','info+:in_ostrander5',{if:'flag:t1_done',do:['gyanu+2']}],goto:'D13E'},
  {label:'Don’t touch it—stare out the window',tag:'Suspicion −2',do:['gyanu-2'],goto:'D13E'},
  {label:'Close the folder and push it back into place',tag:'Suspicion +1 · Order +1 · too tidy',do:['gyanu+1','rend+1'],goto:'D13E'},
  {label:'Confront her when she returns: “Did you leave this out as a test?”',tag:'Persuasion ≥ 6 · Suspicion −3 · Cover +2',req:'meg>=6',why:'Requires Persuasion ≥ 6',do:['gyanu-3','alca+2'],goto:'D13E'}],
 {at:'D13N',kh:'1998. október 13. · kedd · délután',ke:'October 13, 1998 · Tuesday · afternoon'});

p('O2','Lunch',[
 'At noon, Ostrander stands in your doorway holding her coat. “Lunch. My treat. This isn’t an interrogation.” In the diner at Fulton and Third, the waitress pours dark coffee before anyone utters a word.',
 'Ostrander pulls out her booth chair and waits until you sit. She doesn’t look at her notepad. “You want to know why I don’t trust overly disciplined people?”',
 '“My older brother was twenty-six when they found him in a stolen sedan. Immaculate crime scene. No fibers, no prints, no signs of a struggle. His killer was never identified.” She stirs her coffee mechanically. “Ever since that day, I distrust immaculate crime scenes.”',
 {if:'flag:t1_done',t:'Ostrander does not look at you, but she says the sentence slowly, as if she wanted you to listen well.'},
 '>> Ostrander handed you her brother’s death like a piece of evidence. Anyone who does that expects something in return.'],
 [{label:'Express condolences and inquire gently about her brother',tag:'Cover +3 · Suspicion −2',do:['alca+3','gyanu-2','flag:ost_rapport=true','info+:in_ostrander6'],goto:'D19E'},
  {label:'Say you have lost someone too',tag:'Cover +2 · Suspicion −1 · Order −1',do:['alca+2','gyanu-1','rend-1','flag:ost_rapport=true','info+:in_ostrander6'],goto:'D19E'},
  {label:'Say nothing and eat',tag:'Suspicion +2',do:['gyanu+2'],goto:'D19E'},
  {label:'Say something clever about discipline',tag:'Persuasion ≥ 6 · Suspicion −3 · Cover +1',req:'meg>=6',why:'Requires Persuasion ≥ 6',do:['gyanu-3','alca+1'],goto:'D19E'}],
 {at:'D19N',kh:'1998. október 19. · hétfő · dél',ke:'October 19, 1998 · Monday · noon'});

p('O3','Ostrander in the Stairwell',[
 'Sunday night. Someone is waiting inside your apartment stairwell. Ostrander stands near the elevator shaft in her trench coat, posing as if she just happened to be in the neighborhood. “I had a pleasant chat with Kim. Lovely woman. She even gave me a slice of homemade cake.”',
 {if:'flag:kim_knows_lab',t:'“She said she knows you’re working on the Hollis case at the lab, too. You didn’t mention that you’re involved.”'},
 {if:'flag:kim_lied',t:'“She claimed you told her you knew nothing about the Hollis murder. I wonder why.”'},
 {if:'!flag:kim_knows_lab and !flag:kim_lied',t:'“She noted you keep very regular hours. Odd, considering our lab access logs show extensive late-night terminal sessions.”'},
 'Ostrander smirks. It’s the first time you’ve seen her smile.',
 '>> Neighbors make the best prosecution witnesses: they don’t even realize they’re testifying against you.'],
 [{label:'Say Kim is kind, but she can’t see when you work at night',tag:'Suspicion +2 · Cover +1',do:['gyanu+2','alca+1'],goto:'D25J'},
  {label:'Ask flatly what information she’s seeking',tag:'Suspicion −1',do:['gyanu-1'],goto:'D25J'},
  {label:'Invite her inside for coffee',tag:'Suspicion +3 · Cover +3 · risky',danger:1,do:['gyanu+3','alca+3','flag:ost_inside=true'],goto:'D25J'},
  {label:'Convince her that Kim misunderstood something',tag:'Persuasion ≥ 7 · Suspicion −4 · Cover −1',req:'meg>=7',why:'Requires Persuasion ≥ 7',do:['gyanu-4','alca-1'],goto:'D25J'}],
 {at:'D25E',kh:'1998. október 25. · vasárnap · késő este',ke:'October 25, 1998 · Sunday · late evening'});

inf('in_ostrander5','Ostrander’s Open Folder','The list is short, with tiny dates beside the check marks. Ostrander is not careless: this was a trap.','i');
inf('in_ostrander6','Ostrander’s Brother','Ostrander’s brother was found at a clean scene, and the killer was never caught. That is why she distrusts discipline.','i');

/* ===== Section 4: “dead time” – short everyday scenes (Cover building) ===== */
p('R1','The Last Bus',[
 'The 11:50 bus is empty except for an old man in the back clutching a folded paper. Overhead lights hum and flicker; Keith Yates’s voice seeps quietly from the driver’s dashboard radio.',
 'On the bulkhead hangs a poster for the DNA pilot project: a giant helix alongside a smiling lab tech. The old man catches you staring. “Everyone’s gonna be a serial number pretty soon, they say.”',
 '>> Just an ordinary passenger. Nobody keeps track of who gets off at which stop.'],
 [{label:'Chat him up until your stop',tag:'Cover +2',do:['alca+2'],goto:'D03N'},
  {label:'Look out the window',tag:'Cover +1',do:['alca+1'],goto:'D03N'},
  {label:'Get off a stop early and walk home',tag:'Suspicion −1',do:['gyanu-1'],goto:'D03N'}],
 {at:'D02J'});

p('R2','The Laundromat',[
 'At this hour, the Maple Street laundromat is empty save for the steady hum of tumble dryers. A young woman in the corner folds laundry and glances over at your basket. “Number eight is your best bet. The rest steal socks.”',
 'The spin cycle is hypnotic. You can’t remember the last time you felt this calm.',
 '>> Fresh laundry, a quiet night. A person with nothing to hide does laundry on Monday nights. It’s the best cover normal life can buy.'],
 [{label:'Thank her and load your wash into number eight',tag:'Cover +2',do:['alca+2'],goto:'D06N'},
  {label:'Let the wash spin and read your book',tag:'Cover +1 · Order +1',do:['alca+1','rend+1'],goto:'D06N'},
  {label:'Ask her where she works',tag:'Cover +3 · Suspicion +1',do:['alca+3','gyanu+1'],goto:'D06N'}],
 {at:'D05J'});

p('R3','The Late Diner',[
 'At the 24-hour diner, the waitress already knows your order: black coffee and a slice of apple pie. “The usual.” It’s been a long time since anyone looked at you without expecting an explanation.',
 'The muted TV over the counter flashes breaking news: *DNA database nationwide rollout set for October 15.*',
 '>> Routine is the ultimate camouflage. As long as you sit in the same booth at the same hour, you’re invisible.'],
 [{label:'Leave a generous tip and chat with her',tag:'Cover +2',do:['alca+2'],goto:'D07N'},
  {label:'Pay and go',tag:'Cover +1',do:['alca+1'],goto:'D07N'}],
 {at:'D06J'});

p('R4','The TV',[
 'You sit alone on the couch, the television muted. On the nightly news, a forensic specialist assures viewers that the new DNA registry is foolproof and that only the guilty have cause for alarm.',
 'A brief smile. Then you mute your own internal monologue.',
 '>> The public believes technology will protect them. Occasionally, they’re right.'],
 [{label:'Turn off the set and sleep',tag:'Cover +2',do:['alca+2'],goto:'D19N'},
  {label:'Watch to the end and remember what he says',tag:'Expertise ≥ 5 · Suspicion −1',req:'szak>=5',why:'Requires Expertise ≥ 5',do:['gyanu-1'],goto:'D19N'}],
 {at:'D18J'});

p('R5','The Neighbor’s Dog',[
 'At dawn in the stairwell, Mr. Dalton’s aging beagle leans his heavy head against your shin. His owner offers an apology. “Sorry about him. He likes you. He usually barks at strangers.”',
 '>> A dog that trusts you. Animals sense more than people do. Or worse.'],
 [{label:'Pet the dog and small-talk with Mr. Dalton',tag:'Cover +2',do:['alca+2'],goto:'D21N'},
  {label:'Say hello and move on',tag:'Cover +1',do:['alca+1'],goto:'D21N'}],
 {at:'D20J'});

p('R6','A Walk Before Dawn',[
 'At four AM, Fulton Avenue is desolate, shop windows dark. The corner bakery light flicks on, the rich scent of fresh bread drifting into the chilly air. “Night owl or early riser?” the baker asks with a warm smile.',
 '“Late to bed.”',
 '>> Night is another city. Sometimes it’s good to walk in it without wanting anything.'],
 [{label:'Buy a fresh roll and chat with the baker',tag:'Cover +2',do:['alca+2'],goto:'D25N'},
  {label:'Say hello and look at the windows',tag:'Cover +1',do:['alca+1'],goto:'D25N'}],
 {at:'D24J'});

p('R7','The Window',[
 'Through the window frame, the city lights flicker through autumn haze. In the tenement building opposite yours, someone is practicing piano—clumsily repeating the same three measures over and over.',
 'You listen, and catch yourself smiling in the dark. You don’t know why.',
 '>> A rare few moments belong neither to the chain nor to the Codex. They belong solely to you.'],
 [{label:'Listen to the end',tag:'Cover +2 · Order +1',do:['alca+2','rend+1'],goto:'D28N'},
  {label:'Close the window sash and turn in',tag:'Cover +1',do:['alca+1'],goto:'D28N'}],
 {at:'D27J'});

/* ===== Arc 4: The Chain (Oct 22–31) ===== */
p('D22N','The Guest',[
 'Dr. Zeller ushers an elderly man into the evidence room. Thin, sharp-eyed behind wire-rimmed glasses, wearing a tailored vintage wool coat. His movements are measured, like a machine that never wears out.',
 '“Lester Tobin. He worked here as a lab assistant for forty-two years before I took over. He recommended Shane to us, too. An old friend of the department. He still drops by to check on the new staff.”',
 {if:'info:ny_foto or info:leg_tobin',t:'The photograph. The exact same face. *L.T., 1972.*'},
 {if:'!info:ny_foto and !info:leg_tobin',t:'His face triggers a memory, but you can’t place where you’ve seen him before.'},
 'Tobin offers you a firm handshake, a smile that doesn’t reach his eyes.',
 '>> This is the man who mastered the rules decades before you ever learned them.'],
 [{label:'Shake his hand and introduce yourself',tag:'Cover +2',do:['alca+2','flag:tobin_met=true'],goto:'C3'},
  {label:'Avoid him and go about your business',tag:'Suspicion +1',do:['gyanu+1','flag:tobin_met=true'],goto:'C3'},
  {label:'Probe Zeller about Tobin when you’re alone',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['info+:ny_tobin_zeller','flag:tobin_met=true'],goto:'C3'}]);

p('D22E','Coffee',[
 'Tobin is waiting outside the lab building on the rain-slick sidewalk, holding a black umbrella. “Care for a coffee? It won’t take long.”',
 'The phrasing is polite. Tobin’s tone is not.',
 {if:'info:ny_foto',t:'You feel the weight of the photograph in your jacket pocket. Sooner or later, questions will have to be asked.'},
 '>> Tobin isn’t inviting you for coffee. He wants to see how you sit down with someone who knows the chain.'],
 [{label:'Go with him',tag:'Cover +1',do:['alca+1','flag:tobin_coffee=true']},
  {label:'Brush him off: you have urgent work',do:['alca-1']},
  {label:'Counter: “I’d prefer to talk at my place tomorrow.”',tag:'Order −1',do:['flag:tobin_coffee=true','rend-1']}]);

p('D22J','Tobin',[
 'Late at night, you sit in the police archive room, reading through the personnel file of the retired lab technician. Lester Tobin, born 1926; laboratory assistant from 1949 to 1991.',
 {if:'flag:tobin_coffee',t:'Over coffee, Tobin said nothing that couldn’t be denied at any moment. Yet every sentence leaned the same way.'},
 'Only one notable entry stands out in the file: Neil Jessup began his career under Tobin’s supervision in 1972.',
 '>> The roster of living caretakers is shrinking. Fewer and fewer remain who know the truth.'],
 [{label:'Copy out the more important pages',tag:'Expertise ≥ 5 · Suspicion +2',req:'szak>=5',why:'Requires Expertise ≥ 5',do:['info+:in_tobin','gyanu+2'],show:'flag:witnessed',goto:'W1'},
  {label:'Copy out the more important pages',tag:'Expertise ≥ 5 · Suspicion +2',req:'szak>=5',why:'Requires Expertise ≥ 5',do:['info+:in_tobin','gyanu+2'],show:'!flag:witnessed'},
  {label:'Leave it and go home',do:['alca+2'],show:'flag:witnessed',goto:'W1'},
  {label:'Leave it and go home',do:['alca+2'],show:'!flag:witnessed'},
  {label:'Take note of what the file does not say',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['info+:ny_tobin_hiany'],show:'flag:witnessed',goto:'W1'},
  {label:'Take note of what the file does not say',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['info+:ny_tobin_hiany'],show:'!flag:witnessed'}]);

p('D23N','Tobin at Home',[
 'Tobin lives in a modest, immaculate brick house decorated with floral wallpaper. Framed photographs line the hallway—all black-and-white, all stiffly posed.',
 'Beside one frame hangs an unlabelled newspaper clipping: a 1991 murder acquittal, two columns wide, carefully trimmed along the edges.',
 'Tobin pours dark coffee. As he sits, he speaks softly. “I don’t know how much you’ve figured out. But I know Neil didn’t give you the full story.”',
 '“Before you ask: I didn’t write the Codex either. I inherited it from a man they called the Teacher. He got it from someone before him.”',
 '>> It isn’t the killer speaking, but a courier. The one who carries the letter onward.'],
 [{label:'Ask point-blank who originated the chain',do:['info+:ny_tobin_lanc','rend-1']},
  {label:'Ask: “Why Neil? Why me?”',tag:'Cover −1',do:['info+:ny_tobin_miert','alca-1']},
  {label:'Say nothing and let him speak to the end',tag:'Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['info+:ny_tobin_lanc','info+:ny_tobin_miert']}],
 {enter:['info+:kx_hatlap']});

p('D23E','Neil’s Call',[
 'At eight PM, the phone rings. No pleasantries. “Lester was at your place.” It’s a statement, not a question.',
 'Neil’s voice sounds labored, raspy—like a man trying to stand who can’t get his footing.',
 '“Get over here. Now.”',
 '>> It’s the first time in your life he’s made a request instead of giving an order.'],
 [{label:'Go and talk to him',tag:'Cover −1',do:['alca-1']},
  {label:'Tell him you’ll come by in the morning',do:['rend-1','gyanu+1']},
  {label:'Ask back what he wants',tag:'Suspicion +1',do:['gyanu+1']}]);

p('D23J','Neil’s Truth',[
 'Neil sits at the kitchen table with two coffees in his hands, but he drinks neither. The cabinet door is open, for the first time since you can remember.',
 '“You were nine years old,” Neil says softly. “After your father died, I pulled you off the street. Lester said a child could be molded correctly. I believed him. Then I grew to love you. I hadn’t factored that into the equation.”',
 {if:'info:ny_tobin_lanc',t:'“I know what Lester told you. That the chain is older than me. That’s true. But I let you be the one to carry it on.”'},
 'Neil pauses, as if a final sentence were weighed on his tongue. Then he just stares into his coffee mug.',
 '“I didn’t want it for you. But from day one, I knew it would end up on your shoulders.”',
 '>> The worst sentence is the one that is true and comes from love.'],
 [{label:'Take his hand: “I know, Neil.”',tag:'Cover +4',do:['alca+4','flag:neil_truth=true','flag:neil_close=true','rend+2']},
  {label:'Push back: “Why didn’t you leave me out of this?”',do:['flag:neil_truth=true','rend-2','alca-3']},
  {label:'Remain silent and watch his trembling hands',do:['flag:neil_truth=true']},{label:'Stay calm and hear him out',tag:'Composure ≥ 6 · Cover +3 · Order +2',req:'hid>=6',why:'Requires Composure ≥ 6',do:['flag:neil_truth=true','alca+3','rend+2']}],
 {enter:['info+:in_neil_igaz']});

p('D24N','The Cabinet',[
 'Neil allows you to open the locked cabinet. Inside, heavy case folders line the shelves stretching back decades, all clad in yellowed binder stock.',
 'You pull the top file. A master registry of names, dates, and locations—all recorded in the exact same disciplined phrasing.',
 {if:'info:ny_kez',t:'The penmanship is identical: the looped *g*’s match the handwriting in the target files. Tobin’s hand.'},
 {if:'!info:ny_kez',t:'Three distinct handwritings alternate across the decades: one angular, one looped, one heavily slanted. Three custodians spanning generations.'},
 '>> The target list is far longer than you imagined. And it doesn’t end here.'],
 [{label:'Read the list through',tag:'Order −2 · Cover −3',do:['rend-2','alca-3','info+:ny_lista2']},
  {label:'Search the records for your own name',tag:'Observation ≥ 6',req:'megf>=6',why:'Requires Observation ≥ 6',do:['info+:ny_sajat','alca-2']},
  {label:'Close it and don’t look',do:['rend+1','alca+1']},{label:'Read it through coolly and memorize everything',tag:'Composure ≥ 7 · new clues',req:'hid>=7',why:'Requires Composure ≥ 7',do:['info+:ny_lista2','info+:ny_sajat']}],
 {enter:['info+:kx_lista']});

p('D24E','A New Name',[
 'In the evening, Tobin brings an envelope in person. “The chain asks.” Nothing more.',
 'Inside is a single target profile: Craig Castellano. Formerly a prosecutor, later a judge, now a prominent real-estate developer. Indicted twice in connection with the disappearances of two young women; acquitted both times for lack of evidence.',
 '“He possesses material that threatens the entire chain,” Tobin states cold-bloodedly. “A lockbox from 1974. Neil’s name is in it. Yours could be added to it very easily.”',
 '>> A request that is not a request. A name that is not yours.'],
 [{label:'Accept the envelope and hear his terms',do:['flag:t3_known=true','info+:in_castellano','rend-1']},
  {label:'Refuse: “This isn’t the Codex.”',tag:'Order +3 · Suspicion +2',do:['flag:t3_skip=true','rend+3','gyanu+2']},
  {label:'Ask: what is in the box?',tag:'Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['flag:t3_known=true','info+:in_castellano','info+:in_doboz']}]);

p('D24J','Castellano',[
 {if:'flag:t3_known and !flag:t3_skip',t:'Craig Castellano resides in a sprawling, cold estate up in Hillcrest—complete with security gates, surveillance cameras, and a live-in housekeeper. He operates under the assumption that he’s untouchable.'},
 {if:'flag:t3_skip',t:'A quiet night where you stay put. For the Codex, inaction is sometimes the purest choice.'},
 {if:'flag:t3_known and !flag:t3_skip',t:'You stand outside the fence, and your gaze glides over the house.'},
 '>> The chain isn’t asking you for something. The chain protects itself, and uses you.'],
 [{label:'Watch the house and note his routine',tag:'Evidence +1 · Suspicion +3',show:'flag:t3_known and !flag:t3_skip',do:['ev3+1','gyanu+3']},
  {label:'Research Castellano’s historical trial transcripts',tag:'Expertise ≥ 5 · Evidence +1',show:'flag:t3_known and !flag:t3_skip',req:'szak>=5',why:'Requires Expertise ≥ 5',do:['ev3+1','gyanu+1']},
  {label:'Go home',do:['alca+3'],goto:'R6'}]);

p('D25N','Last Sunday',[
 'Neil is physically exhausted, yet dressed, like a man about to go somewhere. The autumn day is crisp and bright.',
 'You set the dining table. Neil breaks the long silence: “I ask one thing of you. Don’t pass this burden on.”',
 {if:'flag:neil_truth',t:'His tone isn’t an order, but a quiet plea. “The chain ends where you decide.”'},
 '>> A promise you don’t have to honor today. But you have to speak it.'],
 [{label:'Promise',tag:'Order −1 · Cover +3',do:['flag:promise=true','alca+3','rend-1']},
  {label:'Say: “I promise nothing.”',do:['alca-1']},
  {label:'Stay silent and hold his weathered hand',do:['alca+2','flag:neil_close=true']}]);

p('D25E','Shane',[
 'At the neighboring workbench in the lab, Shane Crowe is transcribing protocol logs. His movements are meticulous, deliberate—as if someone has been coaching him behind the scenes.',
 {if:'info:ny_tobin_zeller',t:'Zeller mentioned it earlier: Lester Tobin personally recommended him. That detail weighs heavily on your mind now.'},
 'Shane looks up, meeting your eyes for a silent moment. He asks nothing, says nothing.',
 '>> Does he know? Or is he blind to it? Neither option lets you sleep easier.'],
 [{label:'Observe how he works, as a teacher would',tag:'Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['flag:shane_watch=true','info+:in_shane2'],goto:'O3'},
  {label:'Avoid him and let him work',do:['alca+1'],goto:'O3'},
  {label:'Talk to him and see what he thinks of you',tag:'Cover +2',do:['alca+2','flag:shane_watch=true','flag:shane_close=true'],goto:'O3'}]);

p('D25J','Castellano, Again',[
 {if:'flag:t3_known and !flag:t3_skip',t:'Silence shrouds Hillcrest. Castellano’s study lamp burns bright; a silhouette sits at the mahogany desk, locking a metal box into a drawer.'},
 {if:'flag:t3_skip',t:'Tonight you pass on Hillcrest and head straight home.'},
 {if:'flag:t3_known and !flag:t3_skip',t:'The box is larger than expected. Embossed on its steel casing are two sets of initials: *N.J.* and *L.T.*'},
 '>> The danger is not Castellano, but what he guards.'],
 [{label:'Maintain surveillance and compile evidence',tag:'Evidence +1 · Suspicion +3',show:'flag:t3_known and !flag:t3_skip',do:['ev3+1','gyanu+3']},
  {label:'Wait for him to leave and watch where he puts the key',tag:'Observation ≥ 6 · Evidence +1',show:'flag:t3_known and !flag:t3_skip',req:'megf>=6',why:'Requires Observation ≥ 6',do:['ev3+1','info+:in_doboz'],goto:'B1'},
  {label:'Disable the camera and break in when he leaves',tag:'Expertise ≥ 5 · Evidence +1 · Suspicion +4 · dangerous',show:'flag:t3_known and !flag:t3_skip',req:'szak>=5',why:'Requires Expertise ≥ 5',danger:1,do:['ev3+1','gyanu+4','info+:in_doboz'],goto:'B1'},
  {label:'Go home',do:['alca+3']}]);

p('D26N','The Match',[
 'Dr. Zeller sits inside her office staring at the database terminal, her expression somber.',
 {if:'flag:dna_risk',t:'“The system cross-matched two crime scene profiles: one from the waterfront warehouse and one from the Hollis homicide. We have a single shared contributor. It’s a partial match, but undeniable.”'},
 {if:'!flag:dna_risk',t:'“The database flagged a partial profile hit connected to the Hollis case. It isn’t identified yet, but it’s interesting.”'},
 'Ostrander stands in the doorway, silent as a statue.',
 '>> A profile match without a name. For now.'],
 [{label:'Explain that a partial profile is often faulty',tag:'Expertise ≥ 6 · Suspicion −3',req:'szak>=6',why:'Requires Expertise ≥ 6',do:['gyanu-3','rend-1']},
  {label:'Ask for Zeller’s trust: “Let’s work on it together.”',tag:'Suspicion −2',show:'flag:zeller_trust',do:['gyanu-2','alca+1']},
  {label:'Say nothing and watch Ostrander’s face',do:['gyanu+3']}],
 {enter:[{if:'flag:dna_risk',do:['gyanu+5']},{if:'!flag:dna_risk',do:['gyanu+2']},{if:'flag:gel_trace',do:['gyanu+2']}]});

p('D26E','Late Interview',[
 'Ostrander stands at your office door, coat draped over her arm. “A moment of your time, {{s}}. Coffee, five minutes.”',
 'Inside the third-floor conference room, it’s dark except for a single desk lamp. Ostrander remains standing.',
 '“Tell me what you did over the past two weekends. I’m not accusing you. I’d just like to put things in order.”',
 '>> “Order” is the most dangerous word a detective can use.'],
 [{label:'Tell the truth, as much as you can',tag:'Suspicion −3 · Cover −2',do:['gyanu-3','alca-2'],goto:'H3'},
  {label:'Call Dr. Zeller as a witness',tag:'Suspicion +1 · Cover +1',do:['gyanu+1','alca+1'],goto:'H3'},
  {label:'Refuse: “I’ll talk to a lawyer.”',tag:'Suspicion +6',danger:1,do:['gyanu+6','alca-3'],goto:'H3'},{label:'Convince Ostrander that she is investigating in the wrong direction',tag:'Persuasion ≥ 8 · Suspicion −5',req:'meg>=8',why:'Requires Persuasion ≥ 8',do:['gyanu-5','alca-1'],goto:'H3'}]);

p('D26J','The Third Job',[
 {if:'flag:t3_known and !flag:t3_skip and !flag:t3_done',t:'Darkness over Hillcrest. Castellano’s estate stands guarded as before, security cameras blinking. The Codex offers no guidance on this target, but the chain demands execution.'},
 {if:'flag:t3_done',t:'There is no need to go to Hillcrest anymore.'},
 {if:'flag:t3_skip',t:'Tonight you stay home—the definitive choice you’ve made all month.'},
 {if:'flag:t3_known and !flag:t3_skip and !flag:t3_done and ev3<3',t:'Something is still missing from the Castellano file. The nights on Hillcrest and the box could have given you more.'},
 '>> This is where your identity settles: are you the master of the chain, or merely its instrument?'],
 [{label:'Carry out the job: Craig Castellano',tag:'Evidence ≥ 3 · for the sake of the chain',show:'flag:t3_known and !flag:t3_done and !flag:t3_skip',req:'ev3>=3',why:'Not enough evidence (3 needed)',danger:1,do:['flag:t3_done=true','rend+2','gyanu+5','alca-4']},
  {label:'Hand the two girls’ files to Ostrander and leave the Codex behind',tag:'Order +4 · Suspicion +4 · the system judges',show:'flag:t3_known and !flag:t3_done and !flag:t3_skip',do:['flag:t3_skip=true','flag:castellano_tip=true','rend+4','gyanu+4']},
  {label:'Force the action: evidence is incomplete, but the chain demands it',tag:'Order −10 · Suspicion +5',show:'flag:t3_known and !flag:t3_done and !flag:t3_skip and ev3<3',danger:1,do:['flag:t3_done=true','flag:t3_unproven=true','rend-10','gyanu+5','alca-4']},
  {label:'Abort the operation: “This is no longer my burden.”',tag:'Order +3 · Cover +2',show:'flag:t3_known and !flag:t3_done and !flag:t3_skip',do:['flag:t3_skip=true','rend+3','alca+2']},
  {label:'Go home and sleep',show:'!flag:t3_known or flag:t3_done or flag:t3_skip',do:['alca+3']}]);

p('D27N','Official',[
 'At eight AM sharp, Ostrander arrives accompanied by two uniformed officers. “An official interview, {{s}}. You are not under arrest.”',
 'The chair in the interrogation room is cold steel; white fluorescent tubes hum overhead. Tape recorder, pad, pen.',
 {if:'flag:witnessed and !flag:paid_wayne and !flag:t4_done',t:'Ostrander leafs through her file. “A witness spotted you near the Lindqvist property. A Dockside pawnbroker. Not the most credible source.”'},
 {if:'flag:paid_wayne and !flag:t4_done',t:'Ostrander flips a page. “A pawnbroker claimed he saw you near Lindqvist’s house. Then he suddenly recanted his statement. Remarkable how people change their minds after receiving cash.”'},
 {if:'flag:t4_done',t:'Ostrander flips a page. “A pawnbroker claimed he saw you near Lindqvist’s house. Now that pawnbroker is dead. I don’t like coincidences.”'},
 {if:'flag:wayne_talks and !flag:t4_done',t:'“He gave us more details than he intended. Claimed he saw you around Dockside repeatedly.” Ostrander studies your face. “I’m assessing his credibility.”'},
 {if:'!flag:witnessed',t:'Ostrander places a printout on the table: your late-night lab access logs over the past three weeks.'},
 '>> The ordinary world never threatens. It only asks.'],
 [{label:'Answer calmly, everything that is true',tag:'Suspicion −4 · Cover −2',do:['gyanu-4','alca-2']},
  {label:'Say you are happy to help, but you want a lawyer',tag:'Suspicion +3 · Cover +1',do:['gyanu+3','alca+1']},
  {label:'Counter-attack: “What are you trying to prove?”',tag:'Suspicion +7',danger:1,do:['gyanu+7','alca-3']},{label:'Persuade her that late-night lab entries are standard procedure',tag:'Persuasion ≥ 8 · Suspicion −5',req:'meg>=8',why:'Requires Persuasion ≥ 8',do:['gyanu-5','alca-1']},{label:'Reference your lunch conversation: “You said yourself you don’t trust perfect crime scenes.”',tag:'Suspicion −3 · Cover +1',show:'flag:ost_rapport',do:['gyanu-3','alca+1']},{label:'Stay calm and repeat the same thing',tag:'Composure ≥ 7 · Suspicion −4',req:'hid>=7',why:'Requires Composure ≥ 7',do:['gyanu-4']}],
 {sfx:'phone',enter:[{if:'flag:wayne_talks and !flag:t4_done',do:['gyanu+3']}]});

p('D27E','Kim Sees',[
 'Kim is waiting in the stairwell that evening, eyes bloodshot, hands trembling. “A cop came to the hospital today and asked about you.”',
 {if:'flag:kim_bond',t:'Kim isn’t afraid of the police. She’s afraid because she doesn’t know what to say.'},
 {if:'!flag:kim_bond',t:'Kim’s voice is cool, as if the stairwell light had taken the warmth out of it.'},
{if:'flag:kim_knows_lab',t:'Kim recalls your hospital conversation: she knows you work at the lab and that you’re on the Hollis case, too. That carries a different weight now.'},
 {if:'flag:kim_lied',t:'Kim recalls your hospital conversation: you swore you knew nothing about the Hollis murder. Now a cop has been asking about the lab.'},
 '>> The Codex’s second rule now has a human face.'],
 [{label:'Tell her an investigation is underway, but that you have done nothing',tag:'Cover +3 · Suspicion +1',do:['alca+3','gyanu+1','flag:kim_bond=true'],show:'flag:witnessed',goto:'W2'},
  {label:'Tell her an investigation is underway, but that you have done nothing',tag:'Cover +3 · Suspicion +1',do:['alca+3','gyanu+1','flag:kim_bond=true'],show:'!flag:witnessed'},
  {label:'Say it is a misunderstanding, and hold her',tag:'Cover +2',do:['alca+2','flag:kim_bond=true'],show:'flag:witnessed',goto:'W2'},
  {label:'Say it is a misunderstanding, and hold her',tag:'Cover +2',do:['alca+2','flag:kim_bond=true'],show:'!flag:witnessed'},
  {label:'Turn away and say you are tired',tag:'Cover −4',do:['alca-4','rend-2'],show:'flag:witnessed',goto:'W2'},
  {label:'Turn away and say you are tired',tag:'Cover −4',do:['alca-4','rend-2'],show:'!flag:witnessed'}]);

p('D27J','The Codex',[
 'At night, the Codex rests on the kitchen table. The yellowed paper seems to glow under the desk lamp like old parchment.',
 {if:'info:kx_lista',t:'The master registry of names from Neil’s cabinet remains burned into your memory. Decades of targets you never knew existed.'},
 {if:'flag:promise',t:'Neil’s final plea—never to pass the chain onward—echoes through the silent room.'},
 '>> A single sheet of paper. That’s how fragile the chain is. Or how indestructible.'],
 [{label:'Read the rules again',tag:'Order +3',do:['rend+3']},
  {label:'Singe the edge of the document with your lighter, then extinguish it',tag:'Cover −1 · Order +1',do:['alca-1','rend+1','flag:kodex_burn=true']},
  {label:'Lock it in the desk drawer and sleep',do:['alca+3'],goto:'R7'}]);

p('D28N','The Watch',[
 'Neil lies in the hospital bed wearing his familiar wool cardigan over his gown. In his right hand, he grips a worn silver pocket watch.',
 '“Lester passed this to me,” Neil whispers. “And I’m passing it to you. Everyone in the chain carried it.”',
 {if:'megf>=5 or info:ny_foto',t:'Engraved on the casing back are three sets of initials, with space left for a fourth.'},
 {if:'!flag:box_read',t:'Neil speaks abruptly, his voice breaking. “Your father wasn’t a killer. He was a tragic mistake. Lester insisted the target list never errs. I knew it did. Then I took you in.”'},
 {if:'flag:box_read',t:'Neil reads your face. “You read the 1973 folder. I can see it in your eyes.” He asks nothing.'},
 '“I knew the system was flawed from that day forward. But if I admitted Lester was wrong, then everything I did afterward was for nothing. I chose to uphold the rules rather than confront the fact that I served a lie.”',
 '>> An object that isn’t forbidden, yet tells everything. The watch is the chain.'],
 [{label:'Accept the watch',tag:'Order −1 · Cover +1',do:['info+:ny_ora','rend-1','alca+1']},
  {label:'Refuse it: “I won’t carry it on.”',tag:'Order +3 · Cover −1',do:['rend+3','alca-1','flag:watch_refused=true']},
  {label:'Put it back on the bed and hold his hand',do:['alca+2','flag:neil_close=true']}],
 {enter:[{if:'!flag:box_read',do:['info+:in_apa']}]});

p('D28E','Night Visit',[
 'Kim works the night shift on the ward where Neil was admitted. You wait in the quiet corridor until Kim steps out of his room.',
 {if:'flag:kim_bond',t:'“I don’t know what you’ve done, but he loves you. You can’t fake that.”'},
 {if:'!flag:kim_bond',t:'“He’s very weak. I don’t know how long he can hold on.”'},
 '>> A nurse who can tell who loves her patient. There is no more accurate witness.'],
 [{label:'Thank her and stay with Neil',tag:'Cover +3',do:['alca+3','flag:neil_close=true']},
  {label:'Go home and rest',do:['alca+1']},
  {label:'Ask Kim what Neil said',tag:'Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['info+:in_neil_szava']}]);

p('D28J','A Night at the Hospital',[
 'Three AM. The hospital floor is dead quiet save for the rhythmic bleep of heart monitors. Neil is sleeping, his breathing shallow and steady, hand resting near the watch.',
 {if:'flag:neil_close',t:'His hand is on yours, as if someone had asked you to stay.'},
 'You sit for an hour and think of nothing. For once in your life even the Host is silent.',
 {if:'flag:t4_done',t:'The Host doesn’t speak tonight either. Not out of tranquility, but out of total satisfaction.'},
 '>> A silence in which everyone is simply themselves. For one night there is nothing to perform.'],
 [{label:'Stay until morning',tag:'Cover +4 · Suspicion −1',do:['alca+4','gyanu-1','flag:neil_close=true']},
  {label:'Go home, because you have work tomorrow',do:['alca+1']},
  {label:'Tell Neil aloud what has happened and what you think',tag:'Order +2 · Cover +2',do:['rend+2','alca+2']},{label:'Stay until morning, and give in to no thoughts',tag:'Composure ≥ 6 · Cover +3 · Order +2',req:'hid>=6',why:'Requires Composure ≥ 6',do:['alca+3','rend+2','flag:neil_close=true']}]);

p('D29N','Neil’s Death',[
 'The telephone rings at six AM sharp. Kim’s voice is gentle, but firm. “{{n}}... Neil passed away. Just before dawn.”',
 {if:'flag:neil_close',t:'You are holding the watch in your hand and do not know when you picked it up.'},
 {if:'!flag:neil_close',t:'You did not cry. You did not know how.'},
 'The world goes muffled, as if someone drew a heavy curtain over every sound.',
 '>> A man has died who didn’t want you to be who you are. You are that anyway.'],
 [{label:'Call Kim back and ask her to stay with you',tag:'Cover +3',do:['alca+3','flag:kim_bond=true']},
  {label:'Go to the lab and work',tag:'Cover +1 · Suspicion −1',do:['alca+1','gyanu-1']},
  {label:'Sit down on the floor and do nothing',do:['alca-2','rend-1']},{label:'Get up and go to work as if nothing happened',tag:'Composure ≥ 7 · Cover +3 · Order +1',req:'hid>=7',why:'Requires Composure ≥ 7',do:['alca+3','rend+1','gyanu-1']}],
 {enter:['flag:neil_dead=true']});

p('D29E','Farewell',[
 'The cemetery sits on the city limits under a cold, overcast morning sky. A tiny gathering: Kim, Chuck, a couple of retired cops, Tobin holding a black umbrella.',
 'The minister recites brief committal prayers; you hear none of it.',
 {if:'flag:tobin_met',t:'Tobin watches you from the other side of the grave, as if asking: and now?'},
 '>> After the service, everyone returns to their daily routines. You do as well—but everything has shifted.'],
 [{label:'Stay by Kim’s side',tag:'Cover +3',do:['alca+3','flag:kim_bond=true'],goto:'H4'},
  {label:'Turn to Tobin and say: “This is over.”',tag:'Order +3 · Suspicion +2',do:['rend+3','gyanu+2','flag:tobin_confronted=true'],goto:'H4'},
  {label:'Depart the graveyard alone for a long walk',do:['alca-1'],goto:'H4'}]);

p('D29J','Shane',[
 {if:'flag:shane_watch',t:'Late at night, Shane Crowe sits alone in the darkened lab, monitor light illuminating his face. You walk in; Shane doesn’t jump.'},
 {if:'!flag:shane_watch',t:'Shane pulls night hours in the lab. He isn’t assigned to, but he’s there anyway.'},
 '“I think I understand what’s happening here,” Shane says softly. “Not every detail. But enough.”',
 'You sit down beside him. You feel the watch in your pocket, the Codex in your drawer, and something in your chest that is not usually there.',
 {if:'flag:shane_trauma',t:'You remember his story about his mother. This kid isn’t asking out of curiosity. He’s asking because someone let him down.'},
 {if:'flag:shane_defended',t:'You remember the corridor, too: Shane lied to Ostrander for you, without knowing who he was protecting.'},
 {if:'flag:shane_honest',t:'Shane knows you don’t believe in the system. Yet he sits beside you anyway.'},
 {if:'flag:shane_lied_to',t:'Shane thinks you believe in the system. That lie weighs heavily now.'},
 '>> Here is the decision: this boy, or no one. The chain is that simple.'],
 [{label:'Initiate him: reveal the Codex and its purpose',tag:'Order −3 · Cover −3',danger:1,do:['flag:shane_chosen=true','rend-3','alca-3']},
  {label:'Shield him: order him to pack his bags and forget everything',tag:'Order +3 · Cover +2',do:['flag:shane_protected=true','rend+3','alca+2']},
  {label:'Say you are tired and you will talk tomorrow',do:['alca-1']},{label:'Question Shane calmly before you decide',tag:'Composure ≥ 6 · Order +1',req:'hid>=6',why:'Requires Composure ≥ 6',do:['info+:in_shane2','rend+1']}]);

p('D30N','The Search',[
 'Friday morning. Ostrander stands inside the lab entrance holding a signed judicial search warrant. “We’re going through the lockers. Not just yours.”',
 {if:'flag:dna_risk',t:'The DNA profile hit, the waterfront warehouse evidence, and two Homicide detectives carrying search warrants.'},
 {if:'!flag:dna_risk',t:'A routine internal audit, they call it. Nobody in the room buys it.'},
 {if:'flag:box_taken',t:'The lockbox sits in your apartment beside the Codex. Today Ostrander searches the lockers. Tomorrow, your home.'},
 {if:'flag:wayne_body',t:'Ostrander has brought Wayne’s pawnshop ledgers, laying them alongside the lab intake logbook.'},
 {if:'flag:wayne_trace',t:'Bank records highlight two large cash withdrawals matching the exact dates of Wayne’s extortion demands.'},
 {if:'flag:wayne_talks and !flag:t4_done',t:'The pawnbroker’s signed deposition lies face up on the table.'},
 '>> The Codex isn’t in your locker. But the locker matters all the same.'],
 [{label:'Open it and cooperate',tag:'Suspicion −3 · Cover −1',do:['gyanu-3','alca-1']},
  {label:'Call Zeller and ask for a witness',tag:'Suspicion +1 · Cover +1',do:['gyanu+1','alca+1']},
  {label:'Refuse and demand a lawyer',tag:'Suspicion +7',danger:1,do:['gyanu+7','alca-2']},{label:'Calmly assert you have nothing to hide',tag:'Persuasion ≥ 7 · Suspicion −4',req:'meg>=7',why:'Requires Persuasion ≥ 7',do:['gyanu-4']}],
 {enter:[{if:'flag:box_taken',do:['gyanu+2']},{if:'flag:wayne_body',do:['gyanu+3']},{if:'flag:wayne_trace',do:['gyanu+2']},{if:'flag:wayne_talks and !flag:t4_done',do:['gyanu+2']}]});

p('D30E','The Last Show',[
 'Keith Yates at the mic, his voice worn down to a rasp. “*Night Shift* is on the air for the final broadcast of the week. I’m asking anyone with information: call in. Don’t give names. Give me dates. Give me locations.”',
 'The caller queue dwindles. Then Marlene Okafor’s voice fills the airwaves, perfectly composed.',
 '“I won’t give a name. Only this: today, standing at a dead man’s grave, I saw the exact same man I saw thirty years ago.”',
 '>> Tobin. Who else.'],
 [{label:'Listen through to sign-off and kill the radio',do:['alca+0']},
  {label:'Note down what Marlene said',tag:'Observation ≥ 5',req:'megf>=5',why:'Requires Observation ≥ 5',do:['info+:ny_marlene2']},
  {label:'Call Marlene directly to demand her silence',tag:'Suspicion +5 · dangerous',danger:1,do:['gyanu+5','flag:radio_exposed=true']}]);

p('D30J','The Night Before',[
 'Devil’s Night. The city is stringing up paper lanterns, fake cobwebs, and plastic skulls—as if fear were something you could purchase at a storefront.',
 {if:'flag:neil_dead',t:'Neil’s cabinet is empty. The Codex is in your drawer. The watch is on the table.'},
 'You stand at the window and look out at the lights of the harbor. Tomorrow night everything will be decided, and you do not know how.',
 '>> One final night to decide who you want to be when the smoke clears.'],
 [{label:'Turn in early and preserve your strength',tag:'Cover +4 · Suspicion −1',do:['alca+4','gyanu-1']},
  {label:'Read the journal and think the month through',do:['rend+2','alca+1']},
  {label:'Go to Kim and talk with her',tag:'Cover +3',show:'flag:kim_bond',do:['alca+3','gyanu-1']}]);

p('D31N','Halloween Morning',[
 'October thirty-first. The streets are louder than usual: kids in cheap plastic masks, storefront decor, radio stations blasting novelty songs.',
 {if:'gyanu>=70',t:'Suspicion sits on your shoulder, so close that you can no longer hear where your own breathing begins.'},
 {if:'gyanu<70',t:'An ordinary day. An unusually ordinary day, which may be the last.'},
 '>> Today everyone wears a mask. You included. Yours just happens to be invisible.'],
 [{label:'Report to the lab as if it’s business as usual',tag:'Suspicion −2',do:['gyanu-2','alca+1']},
  {label:'Stay home and prepare',do:['alca+2']},
  {label:'Call Kim to coordinate plans for tonight',tag:'Cover +3',show:'flag:kim_bond',do:['alca+3','gyanu-1']}]);

p('D31E','Halloween Night',[
 'Fulton Avenue is packed with trick-or-treaters, rubber ghouls, and bags of candy. Beat cops are smiling—an eerie sight.',
 {if:'flag:kim_bond',t:'Kim waits on the corner in her winter coat, smiling warmly. “You promised you’d come.”'},
 {if:'flag:shane_chosen',t:'Shane stands on the opposite sidewalk, waving. In his hands he clutches a small cardboard file box: his initial field notes.'},
 {if:'gyanu>=70',t:'Ostrander’s patrol car sits idly at the corner of Fulton and Anchor, headlights killed.'},
 '>> The final stretch. You don’t have to fix the world tonight. You only have to choose your ending.'],
 [{label:'Join Kim and walk the neighborhood together',tag:'Cover +3',show:'flag:kim_bond',do:['alca+3','gyanu-1']},
  {label:'Go to the lab and retrieve your critical items',tag:'Suspicion +2',do:['gyanu+2']},
  {label:'Wait and see what happens',do:['alca+0']}]);

p('D31J','The Final Night',[
 'Minutes before midnight. Heavy fog rolls off the harbor, muffling the distant city noise. You sit at the kitchen table. Before you lie the Codex, Neil’s silver watch, and a blank sheet of paper.',
 {if:'flag:neil_truth',t:'Neil’s voice echoes in the quiet: “The chain ends where you decide.”'},
 {if:'flag:shane_chosen',t:'Shane knows. If you step away, he carries the torch.'},
 {if:'flag:shane_protected',t:'Shane is safe. He’s forgotten. If anything happens, he won’t know.'},
 {if:'gyanu>=70',t:'The phone rings. Ostrander. You let it ring out.'},
 '>> The final line isn’t mine to write. You speak it.'],
 [{label:'Hand the Codex and the watch over to Shane',tag:'final · the chain goes on',show:'flag:shane_chosen',danger:1,goto:'E_ATADAS'},
  {label:'Burn the Codex and turn yourself in to Ostrander',tag:'final · the chain breaks',show:'flag:neil_truth and flag:shane_protected',danger:1,goto:'E_LANC'},
  {label:'Let it all go and go to Kim',tag:'final · Order ≥ 50 · Suspicion < 75',show:'flag:kim_bond',req:'rend>=50 and gyanu<75',why:'Requires Order ≥ 50 and Suspicion < 75',danger:1,goto:'E_ELENGEDES'},
  {label:'Board the midnight train, alone',tag:'final · alone · the chain stays open',danger:1,goto:'E_VONAT'},
  {label:'Wait for Ostrander',tag:'final · caught',danger:1,do:['flag:waited_ost=true'],goto:'E_CAL'}]);

/* ===== Endings ===== */
p('E_CAL','Caught: Ostrander',[
 'Ostrander doesn’t knock. Your front door was unlocked—interrogators appreciate it when you save them the hassle of kicking it down.',
 'She takes a seat at the kitchen table and unclasps her brief folder. “Clean, flawless work. That was its fatal flaw: nobody is that neat.”',
 'You smile, because there is nothing else you can do. The Codex in the drawer, the watch on the table, the Host silent.',
 {if:'flag:box_taken',t:'The lockbox sits in your hall closet. Ostrander already knows which key opens it.'},
 {if:'flag:shane_defended',t:'Shane sits in an interrogation room repeating his lie to Homicide. Ostrander doesn’t buy a word of it.'},
  {if:'flag:t4_done',t:'Ostrander places Wayne Sullivan’s homicide file on the table alongside the rest. “That’s the third one that doesn’t fit the pattern.”'},
 {if:'flag:waited_ost',t:'*What led here:* on the last night the decision was yours: you waited for Ostrander. Other endings were open.'},
 {if:'!flag:waited_ost',t:'*What led here:* Suspicion reached 100% without your trace entering the system or the radio: many small risks and the daily wear added up. Next time: more restrained steps, less tracking.'},
 '>> I won’t mock you. But your precision deserved a far better ending than this.',
 {if:'flag:waited_ost',t:'**CAUGHT.** You waited for her. The chain breaks, but you did not break it.'},
 {if:'!flag:waited_ost',t:'**CAUGHT.** The chain breaks here, not by your decision.'}],
 [],{end:'fail',legacy:['leg_dna']});

p('E_DNS','Caught: The Database',[
 'At seven AM sharp, bright green text flashes across the lab terminal. A match. Not partial, not ambiguous. A 100% profile match.',
 'Dr. Zeller puts her hand over her mouth. Chuck sets down his coffee. Shane does not look you in the eye, and that is the worst part.',
 'Ostrander stands in the doorway, taking her time. She didn’t have to chase you; the technology did her work for her.',
 '*What led here:* your trace entered the DNA system, either through the sample submitted the usual way or a badly run gel. From then on every day brought the hit closer. Next time: don’t submit the sample the usual way, and be careful with the forgery’s gel run.',
 '>> A database doesn’t tire, doesn’t feel guilt, doesn’t sleep. It simply processes data. Chuck said that within ten years every sample would be tested. He was wrong: it didn’t even take ten weeks.',
 '**CAUGHT.** The modern technology you monitored up close finally ran you down.'],
 [],{end:'fail',legacy:['leg_dna']});

p('E_RADIO','Caught: The Show',[
 'At night on WMHR 101.3, Keith Yates is waiting for a caller. On the other end of the line is a familiar voice that you have heard once before: your own voice, distorted.',
 '“Tell me, caller... why did you call my show?”',
 'Marlene Okafor is patched into the line as well. Yates plays back an audio tape: two broadcasts, two statements, one single voice. Ostrander stands in your kitchen listening to the broadcast, looking like a hunter who finally bagged her trophy.',
 '*What led here:* you called the show and said too much to the caller. Keith Yates’s listeners hear everything. Next time: don’t call the show, let others do the talking.',
 '>> Late-night radio hears everything. You should have remembered that.',
 '**CAUGHT.** Tonight *Night Shift* was all about you.'],
 [],{end:'fail',legacy:['leg_tobin']});

p('E_TEV','A Mistake',[
 'Vernon Prescott was working the crane at the cannery when you cornered him. He offered no defense because he didn’t comprehend what was happening. His final words were a question that received no answer.',
 'Two days later, Ostrander received new evidence: a hair sample that the DNA database matched conclusively to Wesley Lindqvist. According to the news, the real killer fled the state.',
 'The Host doesn’t speak. For the first time, its silence comes not from discipline, but from dark satisfaction.',
 '>> Rule Five: when in doubt, leave it. You didn’t leave it. I would have said something, but you wouldn’t have listened to me anyway.',
 '**A Mistake.** Truth cannot be undone.'],
 [],{end:'fail',legacy:['leg_prescott']});

p('E_HAZ','The Host',[
 'You don’t register the precise moment the shift occurs. Suddenly you are staring down at your own hands, but the hands no longer belong to you. The movements are smooth, familiar—the intent is entirely foreign.',
 'Reflected in the windowpane, you catch your reflection: someone who smiles warmly, shakes hands politely, serves coffee. The eyes behind the smile are cold as stainless steel.',
 'The five rules of the Codex no longer matter. The Host never recognized them to begin with.',
 '>> At last. For so many years you wore my smile. Now I wear yours.',
 '**The Host.** You go on working, but you are no longer yourself.'],
 [],{end:'fail',legacy:['leg_haz']});

p('E_ELENGEDES','Letting Go',[
 'Before midnight you step out of the apartment. The Codex stays on the table, the watch beside it. You take neither with you.',
 'Kim waits on the street corner in her heavy coat, asking no questions. “Let’s find a diner that serves late coffee.”',
 'In the street, children in costumes, the world loud and foolish. You walk beside her, and in your chest something slowly loosens.',
 {if:'flag:chuck_jail',t:'Somewhere in a county cell, Chuck Wexler explains to a guard that he never touched anything that wasn’t his. He’s telling the truth.'},
 {if:'flag:chuck_fired',t:'Chuck Wexler has been working at an auto repair shop ever since. Sometimes he still thinks of the lab, and of how his mugs were always somewhere other than where he left them.'},
 {if:'info:in_apa and !flag:box_burned',t:'You leave Henry {{s}}’s folder behind, but you don’t forget his name. It stays on the table beside the Codex.'},
 {if:'flag:box_burned',t:'The lockbox is ash. The mistake vanished with it, and that is the last thing you will thank the Codex for.'},
 {if:'flag:castellano_tip',t:'Two months later Craig Castellano is arrested. His lawyer says the tip was too precise. Nobody asks who gave it.'},
 {if:'flag:t3_unproven',t:'Three months later it emerges that the two girls were killed by another man. Castellano was innocent, at least of that. It cannot be undone.'},
 {if:'flag:shane_defended',t:'The next morning, Shane stares at your vacant desk. He won’t ask why. But he will.'},
 {if:'flag:t4_done',t:'Wayne Sullivan’s death stays among the unsolved files. The Codex never acknowledged that death.'},
 {if:'flag:paid_wayne and !flag:t4_done',t:'Wayne Sullivan receives the money for three more months. Then he stops asking. You do not know why.'},
 {if:'flag:witnessed and !flag:paid_wayne and !flag:t4_done',t:'Wayne Sullivan opens a new pawnshop in another city. Sometimes you think about what he knows.'},
  {if:'rend>=70 and alca>=70',t:'*Three months later.* Kim doesn’t ask why you don’t sleep. The Host is quiet. You don’t know if it died or if it’s just lying in wait.'},
 {if:'rend>=45 and rend<70',t:'*Three months later.* Sometimes you wake at 3 AM feeling like the room was altered in your sleep. Kim’s hand touches your back. That is enough. For now, enough.'},
 {if:'rend>=70 and alca<70',t:'*Three months later.* The days run smooth and identical. Sometimes the monotony stings. Kim holds your hand when it does.'},
 {if:'rend<45',t:'*Three months later.* On a cold December night, your hand lingers on a doorknob. The Host says nothing. It doesn’t need to.'},
 {if:'flag:ost_rapport and gyanu<50',t:'In early December, an unsigned holiday card arrives at the lab: *Happy Holidays.* She likely knows. She likely can’t prove it.'},
  {if:'flag:shane_protected',t:'Shane never learns who you protected him from. At the lab, he no longer looks through you.'},
 '>> I don’t know how long you can sustain this peaceful life. But tonight, I’ll keep quiet.',
 '**LETTING GO.** There are no guarantees. Just one quiet night where nobody dies.'],
 [],{end:'good',legacy:['leg_neil']});

p('E_ATADAS','The Handover',[
 'Shane sits in a small rented office on Fulton Avenue beneath a desk lamp. You place three items before him: the Codex, the silver watch, and a fresh sheet of paper ready for a fourth set of initials.',
 '“I didn’t want it to be you. But from the very first day I knew it would be.”',
 'Shane is silent, because he understands. You have spoken the same sentence that Neil once spoke to you. The same emphasis, too.',
 'Over the harbor, the fog breaks. Somewhere across the city, a man pauses outside a gate he did not choose.',
 {if:'flag:chuck_jail',t:'Chuck Wexler spends his third month in pretrial detention. His lawyer argues the fingerprint is too clean. Nobody listens.'},
 {if:'flag:chuck_fired',t:'Chuck Wexler has been working at an auto repair shop ever since. Sometimes he still thinks of the lab, and of how his mugs were always somewhere other than where he left them.'},
 {if:'flag:box_taken',t:'You lay Henry {{s}}’s folder before Shane as well. “So you understand what you’re inheriting.” Shane reads it for a long time before opening the Codex.'},
 {if:'flag:box_burned',t:'Only ash remains of the lockbox; Shane receives only the Codex. The mistake is not passed on. The chain looks clean—its most lethal deception.'},
 {if:'flag:castellano_tip',t:'Two months later Craig Castellano is arrested. His lawyer says the tip was too precise. Nobody asks who gave it.'},
 {if:'flag:t3_unproven',t:'Three months later it emerges that the two girls were killed by another man. Castellano was innocent, at least of that. It cannot be undone.'},
 {if:'flag:shane_trauma',t:'A framed photo of Shane’s mother stands on his desk. He doesn’t speak of her, and from tonight on, he doesn’t have to.'},
 {if:'flag:t4_done',t:'Wayne Sullivan’s death stays among the unsolved files. The Codex never acknowledged that death.'},
 {if:'flag:paid_wayne and !flag:t4_done',t:'Wayne Sullivan receives the money for three more months. Then he stops asking. You do not know why.'},
 {if:'flag:witnessed and !flag:paid_wayne and !flag:t4_done',t:'Wayne Sullivan opens a new pawnshop in another city. Sometimes you think about what he knows.'},
  '*A year later.* Inside Shane’s office, the Codex rests in the bottom drawer. On the first page, your handwriting stands recorded beneath Neil’s; below yours, Shane’s fresh ink.',
 {if:'flag:shane_trauma',t:'The first target Shane writes down is a 1991 homicide acquittal. He doesn’t know if the choice is his own, or already the chain’s.'},
 {if:'flag:box_taken',t:'Shane staples Henry {{s}}’s file behind the Codex. *Mistake*, it reads. You don’t know if that marks the end of the chain, or its next error.'},
 {if:'flag:box_burned',t:'Shane never questions target validity. To him, the list is infallible—the chain’s ultimate strength.'},
 {if:'flag:shane_defended',t:'Shane remarks once: “Someone lied for me when they didn’t have to.” He doesn’t ask who.'},
  {if:'flag:shane_honest',t:'Shane’s first act is adding a sixth rule to the Codex: *Verify before you believe.* You don’t know if that saves the chain or merely slows it down.'},
 {if:'flag:shane_lied_to',t:'Shane believes in the system, and therefore in the Codex. That is the most dangerous faith of all.'},
 {if:'flag:shane_asked',t:'Shane did not take your “And you?” as an evasion but as an assignment. In pencil, in the Codex margin, he writes: *Do I believe?* He erases it, then writes it again. You do not know what he will answer himself.'},
 '>> The chain didn’t break. It simply forged a new link. Good night, Shane.',
 '**THE HANDOVER.** The system is fulfilled.'],
 [],{end:'good',legacy:['leg_shane','leg_neil','leg_tobin']});

p('E_LANC','The End of the Chain',[
 'Above the kitchen sink the yellow sheet of the Codex turns black in moments. The watch in your pocket ticks more slowly than your heart.',
 'You call Ostrander. “I won’t make excuses. Bring someone to take a statement.”',
 'Shane is asleep when the call goes through. He knows nothing, and perhaps he never will. The chain ends where someone decides.',
 {if:'flag:chuck_jail',t:'The first line of your formal statement clears Chuck Wexler: he is innocent; release him immediately. Ostrander writes that down first.'},
 {if:'flag:chuck_fired',t:'The second line of your statement clears Chuck Wexler: reinstate him at the lab.'},
 {if:'flag:box_taken',t:'Attached to your confession is the 1973 evidence file: Henry {{s}}’s name, the chain’s mistake, Tobin’s and Neil’s penmanship.'},
 {if:'flag:box_burned',t:'You cannot hand over the lockbox. Only your words remain, and nobody believes words.'},

var S=null,view='start',ORDER=[];

function nextId(id){var i=ORDER.indexOf(id);return i>=0&&i+1<ORDER.length?ORDER[i+1]:null}
function adjTag(t){
 if(!t||!S)return t;
 return t.split(' · ').map(function(part){
  var m=part.match(/^(Gyanú|Suspicion|Álca|Cover|Rend|Order)\s*([+\u2212-])\s*(\d+)$/);
  if(!m)return part;
  var k=/^(Gyanú|Suspicion)$/.test(m[1])?'gyanu':/^(Álca|Cover)$/.test(m[1])?'alca':'rend',up=(m[2]==='+'),n=+m[3];
  if(n<2||n>6)return part;
  var red=0;
  if(k==='gyanu'&&up)red=Math.floor((S.v.meg||0)/4);
  else if(k!=='gyanu'&&!up)red=Math.floor((S.v.hid||0)/4);
  if(!red)return part;
  return m[1]+' '+m[2]+Math.max(1,n-red)+'*';
 }).join(' · ');
}
function effId(id){var q=P[id];return (q&&q.at)||id}

 var t=cleanName(raw).split(' ').filter(Boolean).map(function(w){return capw(w.slice(0,20))});
 if(!t.length)t=DEF[g==='f'?'f':'m'].split(' ');

}

var cc={};
function has(k,n){if(k==='seen'){if(S.vis)return !!S.vis[n];var a=ORDER.indexOf(n),b=ORDER.indexOf(effId(S.pos||'D01N'));return a>=0&&b>=a}return k==='flag'?!!S.flags[n]:S.info.indexOf(n)>=0}
function V(n){
 if(n==='clues')return S.info.filter(function(x){return x.indexOf('ny_')===0}).length;
 if(n==='day')return dayOf(S.pos);
 return S.v[n]||0;
}
function cond(e){
 if(!e)return true;var f=cc[e];
 if(!f){
  var js=e.replace(/(flag|info|seen):(\w+)/g,function(m,k,n){return "H('"+k+"','"+n+"')"})
   .replace(/\b(alca|gyanu|rend|megf|szak|meg|hid|ev1|ev2|ev3|ev4|clues|day)\s*(>=|<=|>|<|==)\s*(\d+)/g,'(V("$1") $2 $3)')
   .replace(/\band\b/g,'&&').replace(/\bor\b/g,'||');
  f=new Function('V','H','return !!('+js+')');cc[e]=f;
 }
 return f(V,has);
}
function fx(list){
 for(var i=0;i<list.length;i++){var e=list[i],m;
  if(typeof e==='object'){if(cond(e.if))fx(e.do);continue}
  if(m=e.match(/^(alca|gyanu|rend)([+-])(\d+)$/)){var amt=+m[3],sg=(m[2]==='+'?1:-1);
   if(amt>=2&&amt<=6){if(m[1]==='gyanu'&&sg>0)amt=Math.max(1,amt-Math.floor((S.v.meg||0)/4));else if(m[1]!=='gyanu'&&sg<0)amt=Math.max(1,amt-Math.floor((S.v.hid||0)/4))}
   S.v[m[1]]=clamp(S.v[m[1]]+sg*amt)}
  else if(m=e.match(/^(ev[1-4])([+-])(\d+)$/)){S.v[m[1]]=Math.max(0,Math.min(3,S.v[m[1]]+(m[2]==='+'?1:-1)*(+m[3])))}
  else if(m=e.match(/^flag:(\w+)=(true|false)$/)){S.flags[m[1]]=m[2]==='true'}
  else if(m=e.match(/^info\+:(\w+)$/)){if(S.info.indexOf(m[1])<0)S.info.push(m[1])}
 }
}

 if(AC)return AC;
 try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();MG=AC.createGain();var cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination);setVol()}catch(e){AC=null}

function tone(f0,f1,t,d,pk,type,at){
 var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+(at||0.01));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+0.05);
}
function noise(t,d,pk,type,f0,f1,q){
 var n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0),i;for(i=0;i<n;i++)a[i]=Math.random()*2-1;
 var s=AC.createBufferSource();s.buffer=b;var f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+d);f.Q.value=q||1;
 var g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+d*0.15);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+d+0.05);
}
var SFX={

function go(id){
 var p0=P[id];if(!p0){id='D01N';p0=P[id]}
 if(S.pos&&S.pos!==id)S.prev=S.pos;
 if(!S.vis)S.vis={};S.vis[id]=1;
 S.pos=id;
 if(id==='C2')S.mini={i:0,res:{},done:false};
 if(/^D\d\d[NEJ]$/.test(id)&&id.charAt(3)==='N'){
  if(dayOf(id)>=2&&S.drift!==id){
   var kills=['t1_done','t2_done','t3_done','t4_done'].filter(function(f){return S.flags[f]}).length;
   S.v.alca=clamp(S.v.alca-((S.v.hid||0)>=7?1:2));S.v.gyanu=clamp(S.v.gyanu+1+Math.min(kills,3)+(S.flags.dna_risk&&dayOf(id)>=16?1:0));
   S.drift=id;
  }
  if(!S.iron)S.morning=JSON.stringify({v:S.v,flags:S.flags,info:S.info,pos:id});
  sfx('pager');
 }
 fx(p0.enter||[]);
 if(p0.sfx)sfx(p0.sfx);
 if(p0.end){reachEnd(id,p0);return}
 if(S.v.gyanu>=100){S.pos='';go(S.flags.dna_risk?'E_DNS':S.flags.radio_exposed?'E_RADIO':'E_CAL');return}
 if(S.v.alca<=0||S.v.rend<=0){go('E_HAZ');return}
}

 S.pos=id;S.ended=id;
 if(!meta.endings[id])meta.endings[id]=1;
 (p0.legacy||[]).forEach(function(x){if(meta.legacy.indexOf(x)<0)meta.legacy.push(x)});
 saveMeta();sfx(p0.end==='fail'?'fail':'end');
}

 var m=JSON.parse(S.morning);
 S.v=m.v;S.flags=m.flags;S.info=m.info;S.ended=null;
 S.v.gyanu=Math.min(99,S.v.gyanu+8);S.v.rend=Math.max(1,S.v.rend-5);S.v.alca=Math.max(1,S.v.alca);

}

 var d={res:{},gain:[],note:S.note};
 ['alca','gyanu','rend'].forEach(function(k){var x=S.v[k]-a.v[k];if(x)d.res[k]=x});
 S.info.forEach(function(i){if(a.info.indexOf(i)<0&&INFO[i])d.gain.push(INFO[i])});

function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function distort(html,seed){
 var depth=0,n=0;
 return html.split(/(<[^>]+>)/).map(function(ch){
  if(ch.charAt(0)==='<'){if(/^<b>|^<span class="gl">/.test(ch))depth++;else if(/^<\/b>|^<\/span>/.test(ch))depth--;return ch}
  if(depth>0)return ch;
  return ch.replace(/\p{L}{4,}/gu,function(w){n++;var h=hash(seed+':'+n);if(h%9!==0)return w;var a=w.split(''),k=Math.max(1,Math.floor(w.length/3)),i;for(i=0;i<k;i++){var pos=1+((h>>>(i*5))+i*7)%(w.length-2);a[pos]='■'}return '<span class="gl">'+a.join('')+'</span>'});
 }).join('');
}

  return '';

}

function dnaSize(){if(!dnaCv)return;var r=dnaCv.getBoundingClientRect();dnaW=r.width;dnaH=r.height;if(!dnaW||!dnaH)return;dnaCv.width=dnaW*dnaDpr;dnaCv.height=dnaH*dnaDpr;dnaCx.setTransform(dnaDpr,0,0,dnaDpr,0,0)}

function dnaDraw(now){

  for(var m=0;m<pts.length;m+=3){var q2=pts[m],z=q2[sd][1],P2=XY(q2.pos,q2[sd][0]);cx.fillStyle='rgba('+rgb+','+(.35+.55*(z+1)/2)*fade+')';cx.beginPath();cx.arc(P2[0],P2[1],1.6+1.7*(z+1)/2,0,7);cx.fill()}
