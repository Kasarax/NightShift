  chuck_lo:['Chuck viccet kezd, és félúton abbahagyja. Nem tudja, miért.','Chuck kérdés nélkül ad egy kávét. A keze kicsit remeg a kanalon.','Chuck nevet, de későn, mint aki szabályt követ, nem hangulatot.','Chuck megáll a pultnál. „Furcsa vagy mostanában, tudod?” Aztán megvonja a vállát.','Chuck nem néz a szemedbe. Ez nála ritka.','Chuck a sörről beszél, de a hangja máshol jár.'],
  host_lo:['>> Miért cipelsz ennyi szabályt? Egy mozdulat, és könnyebb lenne.','>> Nézd meg a kezed. Már alig remeg. Mi ketten egyre jobban értjük egymást.','>> A Kódex nem tud megvédeni attól, aki vagy.','>> Hagyd abba a tagadást. Nem a szabály az, ami visszatart.','>> Hallod? Egyre halkabb az ellenkezésed.','>> Nem kérem, hogy eldobd a szabályokat. Csak azt, hogy ne higgy bennük.'],
  host_vlo:['>> **Elég volt a várakozásból.**','>> **Már nem kérdezem. Mondom.**','>> **A Kódex a te láncod. Az enyém csak a türelem.**','>> **Ne harcolj ellene. Úgysem te vagy az, aki nyer.**','>> **Nyisd ki a kezed. Ott van, amire vágysz.**','>> **Hallgasd a csendet. Az az én hangom.**'],
  gen_hi:['A kollégák halkabban beszélnek, amikor belépsz. Mintha a labor is tudna valamit.','A telefon kétszer cseng, aztán elhallgat. Nem tudod, ki hívott, de a szoba szűkebbnek tűnik.','Az utcán egy ismeretlen autó áll. Lehet, hogy semmi. Lehet, hogy figyelnek.','A tükörben a szemed alatt sötét karikák. Mintha valaki más arca lenne, aki rég nem aludt.','Valaki a folyosón hirtelen elhallgat, és úgy tesz, mintha telefonálna.','Minden lépésednek hangja van, mintha a ház maga is hallgatózna.'],
  trust:['Chuck kávét tölt neked, mielőtt kérnéd.','Zeller rád mosolyog a folyosón, és megkérdezi, milyen volt a hétvége. A kérdés őszinte.','Valaki a labor konyhájában a nevedet mondja, és nevet. Nem rosszindulatból.','Shane bólint, ahogy elmész mellette, mint aki egy szabályos dolgot lát.','Egy pillanatra elfelejted, hogy bármit is játszol. Ez a legjobb álca.','A világ ma kegyes: senki sem néz rád kétszer.']
 },
 en:{
  ost_hi:['Ostrander asks nothing today. She only watches, and that is worse than any question.','“I’m not asking anymore, {{s}},” Ostrander says quietly. “Now I only watch.”','Ostrander speaks more slowly than usual, as if every word were meant for the transcript.','Ostrander counts the pauses between your words too. You can feel it.','Ostrander stops in the doorway for a moment and does not turn back. “Take care of yourself.” It is not advice.','Ostrander’s smile stops at the corner of her mouth. It does not reach her eyes.'],
  ost_lo:['Ostrander is kinder than usual today. That is not reassuring: a good mood can be a method too.','Ostrander nods as she walks past you. “You’re doing well, {{s}}.” Praise, or only an observation.','Ostrander looks at you for a moment, then at the next person. You are not the important one today.','Ostrander drinks her coffee and pays no attention to you. The absence of attention is a good sign, if it is true.','“It’s no bad thing that you run an orderly place,” Ostrander says, and shrugs.','Today Ostrander says the other lab workers’ names before her questions. Not yours anymore.'],
  shane_lo:['Shane looks at you over the monitor and quickly looks back at the keyboard.','Shane draws back a little when you walk past, as if he sensed something.','Shane half asks, then swallows the sentence. “Never mind.”','Today Shane says only the obligatory words. His silence is more precise than his questions.','Shane jots something down and closes the page in his palm.','Shane looks for your eyes. When he finds them, he does not know what to see in them.'],
  kim_lo:['Kim looks at your face a little longer than she used to.','Kim touches your arm and pulls her hand away. “You’re cold.” It is not a question.','Kim looks under your eyes. “You’re sleeping badly. Something’s wrong.”','Kim smiles, but her eyes do not. As if she were counting something else.','Kim stays silent, and this is not a friendly silence.','Kim stops for a moment in the stairwell, as if she wanted to cross to the other side.'],
  chuck_lo:['Chuck starts a joke and stops halfway. He doesn’t know why.','Chuck hands you a coffee without a word. His hand trembles a little on the spoon.','Chuck laughs, but late, like someone following a rule, not a mood.','Chuck stops at the counter. “You’ve been strange lately, you know that?” Then he shrugs.','Chuck does not look you in the eye. That is rare for him.','Chuck talks about beer, but his voice is somewhere else.'],
  host_lo:['>> Why carry so many rules? One move, and it would be lighter.','>> Look at your hands. They barely tremble. The two of us understand each other better and better.','>> The Codex cannot protect you from who you are.','>> Stop denying it. It is not the rule that holds you back.','>> Do you hear that? Your resistance grows quieter.','>> I am not asking you to throw away the rules. Only to stop believing in them.'],
  host_vlo:['>> **Enough waiting.**','>> **I am not asking anymore. I am telling.**','>> **The Codex is your chain. Mine is only patience.**','>> **Don’t fight it. You are not the one who wins.**','>> **Open your hand. What you long for is already there.**','>> **Listen to the silence. That is my voice.**'],
  gen_hi:['The colleagues speak more softly when you walk in. As if the lab knew something too.','The phone rings twice, then falls silent. You don’t know who called, but the room seems narrower.','An unfamiliar car is parked in the street. It may be nothing. It may be that they are watching.','Dark circles under your eyes in the mirror. Like the face of someone else, someone who hasn’t slept in a long time.','Somebody in the corridor suddenly goes quiet and pretends to be on the phone.','Every step you take has a sound, as if the building itself were listening.'],
  trust:['Chuck pours you a coffee before you ask.','Zeller smiles at you in the corridor and asks how the weekend was. The question is sincere.','Somebody in the lab kitchen says your name and laughs. Not unkindly.','Shane nods as you pass him, like someone looking at something in order.','For a moment you forget that you are playing anything at all. That is the best cover.','The world is kind today: nobody looks at you twice.']
 }

 openOv('<h3>'+L('HANG','SOUND')+'</h3><p>'+L('A hangok a böngésző hangszintetizátorából szólnak, külön fájl nélkül.','The sounds are generated by the browser\'s synthesizer, with no separate audio files.')+'</p><label class="itm" style="cursor:pointer"><input type="checkbox" id="aon"><div><div class="n">'+L('Hang bekapcsolva','Sound on')+'</div><div class="d">'+L('Billentyű, személyhívó, telefon, riasztás, bukás és befejezés.','Keystrokes, pager, phone, alarm, failure and endings.')+'</div></div></label><div class="sec">'+L('Hangerő: ','Volume: ')+'<span id="avl"></span>%</div><input type="range" id="avr" min="0" max="100" step="5" aria-label="'+L('Hangerő','Volume')+'" style="width:100%;accent-color:var(--acc)"><div class="row"><button class="btn alt" id="atest">'+L('Próba','Test')+'</button><button class="btn alt" data-a="close">'+L('Bezár','Close')+'</button></div>');
 var on=document.getElementById('aon'),vr=document.getElementById('avr'),vl=document.getElementById('avl');
 on.checked=!!AUD.on;vr.value=AUD.vol;vl.textContent=AUD.vol;
 on.onchange=function(){AUD.on=on.checked;saveAud();setVol();syncSound()};
 vr.oninput=function(){AUD.vol=+vr.value;vl.textContent=AUD.vol;saveAud();setVol()};
 document.getElementById('atest').onclick=function(){if(!AUD.on){AUD.on=true;on.checked=true;saveAud();setVol();syncSound()}sfx('pager')};
}
function syncSound(){var b=document.querySelector('.hbtn button[data-a=sound]');if(b)b.classList.toggle('off',!AUD.on)}
function menuOv(){
 var calm=document.body.classList.contains('calm');
 openOv('<h3>'+L('MENÜ','MENU')+'</h3><p>'+L('A játék minden lépés után automatikusan ment.','The game saves automatically after every step.')+'</p>'+langSeg()+themeSeg()+'<div class="row"><button class="btn" data-a="close">'+L('Folytatás','Continue')+'</button><button class="btn alt" data-a="legacy">'+L('Hagyaték','Legacy')+'</button><button class="btn alt" data-a="calm">'+L('Villogás és mozgás: '+(calm?'ki':'be'),'Flicker and motion: '+(calm?'off':'on'))+'</button><button class="btn alt" data-a="age-redo">'+L('Korhatár újra','Age check again')+'</button><button class="btn alt" data-a="tostart">'+L('Új játék','New game')+'</button><button class="btn alt" data-a="wipe">'+L('Mindent töröl','Erase everything')+'</button></div>');
}
/* ====== események ====== */
document.addEventListener('click',function(e){
 var t=e.target.closest('button');if(!t)return;
 var a=t.getAttribute('data-a'),ci=t.getAttribute('data-i');
 if(ci!==null&&view==='game'){var o=document.getElementById('stage')._ch[+ci];if(!o||o.dis)return;choose(o.c);return}
 if(a==='g'){CC.g=t.getAttribute('data-g');[].forEach.call(document.querySelectorAll('button[data-a=g]'),function(b){b.setAttribute('aria-pressed',String(b===t))});var nmi=document.getElementById('nm');if(nmi)nmi.placeholder=DEF[CC.g];return}
 else if(a==='gen'){CC.name=genName(CC.g);var nmx=document.getElementById('nm');if(nmx){nmx.value=CC.name;nmx.focus()}return}
 else if(a==='pt'){var k=t.getAttribute('data-k'),d=+t.getAttribute('data-d'),left=POOL-pts();if(d>0&&(left<=0||1+CC[k]>=10))return;if(d<0&&CC[k]<=0)return;CC[k]+=d;refreshPts();return}
 else if(a==='theme'){applyTheme(t.getAttribute('data-th'));if(ov.classList.contains('on')){closeOv();menuOv()}else render();return}
 else if(a==='lang'){var nl=t.getAttribute('data-l');if(nl!==LANG){setLang(nl);if(ov.classList.contains('on')){closeOv();menuOv()}render()}return}
 else if(a==='age-yes'){lsSet(LS_AGE,'1');view='start';render()}
 else if(a==='age-no'){view='out';render()}
 else if(a==='age-back'){view='gate';render()}
 else if(a==='age-redo'){lsDel(LS_AGE);closeOv();view='gate';render()}
 else if(a==='begin'){var ir=document.getElementById('iron');view='game';newRun(ir&&ir.checked);render();window.scrollTo(0,0)}
 else if(a==='cont'){var r=readJSON(LS_RUN);if(r&&P[r.pos]){S=r;view='game';render()}}
 else if(a==='help')helpOv();
 else if(a==='kodex')kodexOv();
 else if(a==='akta')aktaOv();
 else if(a==='notes')notesOv();
 else if(a==='jt'){notesOv(t.getAttribute('data-t'))}
 else if(a==='sound')soundOv();
 else if(a==='menu')menuOv();
 else if(a==='legacy')legacyOv();
 else if(a==='calm'){var c=document.body.classList.toggle('calm');lsSet(LS_CALM,c?'1':'0');menuOv()}
 else if(a==='card'){saveCard('safe');return}
 else if(a==='close')closeOv();
 else if(a==='tostart'){closeOv();view='start';render()}
 else if(a==='wipe'){if(confirm(L('Biztosan törlöd a mentést, a Hagyatékot és a naplót is?','Are you sure you want to erase the save, the Legacy and the journal?'))){lsDel(LS_RUN);lsDel(LS_META);lsDel(LS_NOTES);meta={endings:{},legacy:[],runs:0};S=null;closeOv();view='start';render()}}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){closeOv();return}
 if(view!=='game'||ov.classList.contains('on')||e.ctrlKey||e.metaKey||e.altKey)return;
 var n=parseInt(e.key,10);if(!(n>=1))return;
 var b=document.querySelectorAll('.ch')[n-1];if(b&&!b.disabled)b.click();
});

/* ====== indulás ====== */
(function(){
 if(lsGet(LS_CALM)==='1')document.body.classList.add('calm');
 var bg=document.getElementById('bg'),hx='0123456789ABCDEF';
 function buildBg(){var W=Math.max(window.innerWidth||0,screen.width||0),H=Math.max(window.innerHeight||0,screen.height||0),cols=Math.ceil(W/7.2)+8,nr=Math.max(120,Math.ceil(H/15)+10),rows=[],i,j;
  for(i=0;i<nr;i++){var s='';for(j=0;j<cols;j++){s+=(Math.random()<.12?' ':hx.charAt((Math.random()*16)|0))+(j%4===3?' ':'')}rows.push(s)}
  var txt=rows.join('\n');bg.innerHTML='<pre>'+txt+'\n'+txt+'</pre>'}
 buildBg();var bgT;window.addEventListener('resize',function(){clearTimeout(bgT);bgT=setTimeout(buildBg,300)});
})();
view=lsGet(LS_AGE)==='1'?'start':'gate';
window.__ejm={CC:CC,parseName:parseName,genName:genName,sfxLog:sfxLog,AUD:AUD,sfx:sfx,get S(){return S},setLang:setLang,L:L,get LANG(){return LANG},get TARGETS(){return TARGETS},miniAuto:function(res){if(!S.mini)S.mini={i:0,res:{},done:false};miniFinish(res)},set S(v){S=v},meta:function(){return meta},go:go,render:render,get ORDER(){return ORDER},get P(){return P},get INFO(){return INFO},cond:cond,fx:fx,setView:function(v){view=v}};
render();
})();
</script>
