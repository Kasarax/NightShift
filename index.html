<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AdventureTime">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>AdventureTime — DEMO</title>
<style>
:root{--bg:#0a0c12;--panel:#121726;--line:#232b42;--fg:#d9deec;--dim:#8791ad;--amber:#f39c12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding:max(24px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));text-align:center;line-height:1.55}
h1{color:var(--amber);margin:8px 0 10px;font-size:clamp(1.6rem,5vw,2.4rem);letter-spacing:.02em}
.intro{max-width:620px;margin:0 auto 22px;color:var(--dim)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:6px}
.lang button{background:transparent;color:var(--fg);border:0;padding:10px 22px;font-size:1rem;cursor:pointer;min-height:44px}
.lang button[aria-pressed=true]{background:var(--amber);color:#111;font-weight:700}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:1200px;margin:0 auto}
.card{--c:#e74c3c;display:block;width:min(100%,280px);background:var(--panel);border:2px solid var(--line);border-radius:12px;
  padding:24px;color:var(--fg);text-decoration:none;text-align:left;transition:transform .2s,border-color .2s}
.card:hover,.card:focus-visible{transform:translateY(-5px);border-color:var(--c);outline:none}
.card h2{margin:0 0 10px;color:var(--c);font-size:1.2rem}
.card p{margin:0;font-size:.95rem}
.badge{display:inline-block;margin-top:12px;font-size:.78rem;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
.gray{--c:#e74c3c}.rozsda{--c:#e67e22}.tower{--c:#3498db}.mnemo{--c:#00e5ff}
footer{margin-top:34px;color:var(--dim);font-size:.85rem}
.demo-badge{position:fixed;top:0;left:0;z-index:99999;pointer-events:none;width:84px;height:84px;overflow:hidden}
.demo-badge span{position:absolute;top:17px;left:-30px;width:118px;text-align:center;transform:rotate(-45deg);background:#ffb545;color:#1a1200;font:700 11px/20px system-ui,Arial,sans-serif;letter-spacing:.18em;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.demo-tag{display:inline-block;margin:0 0 14px;padding:5px 14px;border:1px solid #ffb545;border-radius:999px;color:#ffb545;background:rgba(255,181,69,.1);font-weight:600;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
.card .dm{display:inline-block;margin-left:8px;padding:1px 8px;border:1px solid #ffb545;border-radius:999px;color:#ffb545;font-size:.65rem;letter-spacing:.12em;vertical-align:middle}
</style>
</head>
<body>
<div class="demo-badge" aria-hidden="true"><span>DEMO</span></div>
<div class="lang" role="group" aria-label="Language / Nyelv">
  <button data-l="en">English</button>
  <button data-l="hu">Magyar</button>
</div>
<h1 id="h1"></h1>
<div class="demo-tag" id="dtag"></div>
<p class="intro" id="intro"></p>
<div class="cards" id="cards"></div>
<script>
/* A játékok listája. Ha egy játék angolra is le van fordítva, állítsd az en értékét true-ra. */
var GAMES=[
 {file:'Grayhaven-2.html',cls:'gray',en:true,
  t:{hu:'Grayhaven City',en:'Grayhaven City'},
  d:{hu:'Grayhaven egy káoszba fulladt nagyváros, ahol elszabadult a halálos K-17-es vírus. A város felett visszaszámlálás ketyeg: a hadsereg végső szőnyegbombázásra készül, a túlélőknek versenyt kell futniuk az idővel.',
     en:'Grayhaven is a city drowning in chaos, where the deadly K-17 virus has broken loose. A countdown ticks over the city: the army is preparing a final carpet bombing, and the survivors race against time.'}},
 {file:'Rustglow.html',cls:'rozsda',en:true,
  t:{hu:'Rozsdafény',en:'Rustglow'},
  d:{hu:'Sötét, poszt-apokaliptikus világ, ahol a nyers ipari rozsda, a pusztulás és a disztópikus veszélyek uralkodnak. Csak a legfüggetlenebb túlélők maradnak talpon.',
     en:'A dark post-apocalyptic world ruled by raw industrial rust, ruin and dystopian dangers. Only the most self-reliant survivors stay on their feet.'}},
 {file:'adventower.html',cls:'tower',en:true,
  t:{hu:'A Kiválasztott Munkaidőben Küzd',en:'The Chosen One Fights During Working Hours'},
  d:{hu:'A próféciák szerint te vagy a Kiválasztott. A gond csak annyi, hogy hősködni kizárólag munkaidőben lehet. Küzdj meg a bürokrácia szörnyeivel, mielőtt letelik a műszak!',
     en:'The prophecies say you are the Chosen One. The catch: heroics are only allowed during working hours. Fight the monsters of bureaucracy before your shift ends!'}},
 {file:'Mnemosyne.html',cls:'mnemo',en:true,
  t:{hu:'Mnemosyne: A Memória-építészet',en:'Mnemosyne: The Memory Architect'},
  d:{hu:'Új-Budapest, 2089. Emlék-restaurátor vagy: kómás elmékbe csatlakozva göngyölítesz fel egy gyilkosságot. De a Mnemosyne Corp emlékeket ír át, és te magad is a kísérleteik alanya vagy.',
     en:'New Budapest, 2089. You are a memory restorer, entering comatose minds to solve a murder. But Mnemosyne Corp rewrites memories, and you are one of their test subjects.'}}
];
var UI={
 hu:{h1:'Üdvözöllek, Kalandor!',intro:'Sok veszélyes és sorsfordító világ vár rád. Válaszd ki, melyik történetbe szeretnél fejest ugrani! Melyik világba szeretnél belépni?',
     only:'Csak magyarul',dtag:'DEMO VERZIÓ — ingyenes részletek mind a négy játékból'},
 en:{h1:'Welcome, Adventurer!',intro:'Many dangerous, fate-changing worlds await you. Choose which story you want to dive headfirst into! Which world do you want to enter?',
     only:'Hungarian only (English coming)',dtag:'DEMO VERSION — free excerpts from all four games'}
};
function lang(){try{var s=localStorage.getItem('at.lang');if(s==='en'||s==='hu')return s}catch(e){}
  var q=/[?&]lang=(en|hu)/.exec(location.search);if(q)return q[1];
  return (navigator.language||'hu').slice(0,2)==='hu'?'hu':'en'}
function render(l){
  try{localStorage.setItem('at.lang',l)}catch(e){}
  document.documentElement.lang=l;
  var u=UI[l];h1.textContent=u.h1;dtag.textContent=u.dtag;intro.textContent=u.intro;
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===l)});
  cards.innerHTML='';
  GAMES.forEach(function(g){
    var a=document.createElement('a');a.className='card '+g.cls;a.href=g.file+'?lang='+l;
    var h=document.createElement('h2');h.textContent=g.t[l];var dm=document.createElement('span');dm.className='dm';dm.textContent='DEMO';h.appendChild(dm);
    var p=document.createElement('p');p.textContent=g.d[l];
    a.appendChild(h);a.appendChild(p);
    if(l==='en'&&!g.en){var b=document.createElement('span');b.className='badge';b.textContent=u.only;a.appendChild(b)}
    cards.appendChild(a)});
}
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){render(b.dataset.l)}});
render(lang());
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){})})}
</script>
</body>
</html>
